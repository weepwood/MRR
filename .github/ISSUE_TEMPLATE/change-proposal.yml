name: 高风险变更提案
description: 用于数据库、权限、安全、架构、部署、外部接口或大规模数据变更
title: "[Change Proposal] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        该模板用于先确定边界和验收标准，再进入编码。请勿包含真实患者信息、生产凭据或未脱敏内网信息。

  - type: dropdown
    id: risk
    attributes:
      label: 风险等级
      description: P0/P1 通常需要先处理风险或故障；P2 是重要业务变更；P3 是低风险体验或文档调整。
      options:
        - P0：生产故障、数据损坏或严重安全风险
        - P1：核心流程、权限、审计或发布风险
        - P2：重要功能或跨模块改造
        - P3：低风险体验、文档或内部整理
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 问题与证据
      description: 描述真实问题、影响范围、复现方式、日志、指标或用户流程。
    validations:
      required: true

  - type: textarea
    id: goal
    attributes:
      label: 目标
      description: 写清完成后系统应具备的能力。
    validations:
      required: true

  - type: textarea
    id: non-goals
    attributes:
      label: 非目标
      description: 明确本次不处理的相邻问题，避免 AI 扩大范围。
    validations:
      required: true

  - type: textarea
    id: invariants
    attributes:
      label: 必须保持的不变量
      placeholder: |
        - 已分类影像不得被自动覆盖
        - 无权限用户不得读取患者影像
        - 已发布 Flyway 迁移不可修改
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案与影响文件
      description: 尽量列出模块、接口、数据表、迁移、配置、部署和文档影响。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案与取舍
      description: 说明为何不采用更简单或更保守的方案。
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: 验收标准
      placeholder: |
        - [ ] 正常路径……
        - [ ] 权限拒绝……
        - [ ] 失败恢复……
        - [ ] PostgreSQL 16 下……
        - [ ] Chrome 109 / Windows Server 下……
    validations:
      required: true

  - type: textarea
    id: verification
    attributes:
      label: 验证计划
      description: 列出单元、集成、E2E、手工、性能、迁移和回滚验证。
    validations:
      required: true

  - type: textarea
    id: rollback
    attributes:
      label: 回滚与数据修复方案
      description: 说明代码回滚、功能开关、数据库前向修复和受影响数据处理方式。
    validations:
      required: true

  - type: checkboxes
    id: privacy
    attributes:
      label: 数据与隐私确认
      options:
        - label: 提交内容不包含真实患者信息、密码、令牌或生产密钥
          required: true
        - label: 已考虑权限、审计、日志脱敏和缓存策略
        - label: 已考虑 3000 万级数据量与失败恢复
