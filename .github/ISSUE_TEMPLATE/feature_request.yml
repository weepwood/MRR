name: 功能建议
description: 提出明确的业务问题、使用场景和验收标准
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 描述当前流程中的具体困难，不要只描述想要的按钮或页面。
    validations:
      required: true

  - type: textarea
    id: users
    attributes:
      label: 使用者与场景
      placeholder: 病案室人员、管理员、HIS 外部系统、运维人员……
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 可以包含交互、接口、数据模型或部署方式。
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: 验收标准
      placeholder: |
        - [ ] 在……条件下可以……
        - [ ] 无权限用户不能……
        - [ ] 3000 万记录规模下……
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: 业务优先级
      options:
        - P0：阻塞生产或存在数据/安全风险
        - P1：核心流程明显受阻
        - P2：重要改进
        - P3：体验优化或长期规划
    validations:
      required: true

  - type: textarea
    id: risks
    attributes:
      label: 风险与兼容性
      description: 说明数据库迁移、权限、审计、Chrome 109、Windows 部署或回滚影响。
