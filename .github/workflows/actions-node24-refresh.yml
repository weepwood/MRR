name: actions-node24-refresh

on:
  push:
    branches:
      - chore/github-actions-node24-20260728

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - name: Upgrade remaining GitHub Actions
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              'actions/download-artifact@v4': 'actions/download-artifact@v8',
              'pnpm/action-setup@v4': 'pnpm/action-setup@v6',
              'actions/setup-java@v4': 'actions/setup-java@v5',
              'softprops/action-gh-release@v2': 'softprops/action-gh-release@v3',
          }
          roots = [
              Path('.github/workflows'),
              Path('frontend-fantastic-admin/.github/workflows'),
              Path('backend-repo/.github/workflows'),
              Path('scripts/tests'),
          ]
          changed = []
          for root in roots:
              if not root.exists():
                  continue
              for path in root.rglob('*'):
                  if not path.is_file() or path.suffix not in {'.yml', '.yaml', '.py'}:
                      continue
                  text = path.read_text(encoding='utf-8')
                  updated = text
                  for old, new in replacements.items():
                      updated = updated.replace(old, new)
                  if updated != text:
                      path.write_text(updated, encoding='utf-8')
                      changed.append(str(path))
          if not changed:
              raise SystemExit('No remaining GitHub Actions references were updated')
          print('\n'.join(changed))
          PY

      - name: Commit changes and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows frontend-fantastic-admin/.github/workflows backend-repo/.github/workflows scripts/tests
          git rm .github/workflows/actions-node24-refresh.yml
          git commit -m "工程：升级剩余 GitHub Actions"
          git push
