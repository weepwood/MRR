name: Apply multilevel navigation implementation

on:
  push:
    branches:
      - feat/navigation-multilevel-menu
    paths:
      - .github/workflows/apply-navigation-multilevel.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/navigation-multilevel-menu

      - name: Patch navigation implementation
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          ROOT = Path('frontend-fantastic-admin')

          def replace_once(relative_path: str, old: str, new: str) -> None:
              path = ROOT / relative_path
              text = path.read_text(encoding='utf-8')
              if old not in text:
                  raise RuntimeError(f'Expected block not found in {path}: {old[:120]!r}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          types_path = ROOT / 'src/types/global.d.ts'
          if "mode?: 'side' | 'head' | 'single' | 'multi'" in types_path.read_text(encoding='utf-8'):
              print('Multilevel navigation implementation is already applied.')
              raise SystemExit(0)

          replace_once(
              'src/types/global.d.ts',
              """     * @可选值 `'single'` 侧边栏模式（无主导航）
     */
    mode?: 'side' | 'head' | 'single'""",
              """     * @可选值 `'single'` 侧边栏模式（无主导航）
     * @可选值 `'multi'` 左侧多级菜单模式（单栏分组展开）
     */
    mode?: 'side' | 'head' | 'single' | 'multi'""",
          )

          replace_once(
              'src/layouts/index.vue',
              "return ['single', 'side'].includes(settingsStore.settings.menu.mode) || settingsStore.mode === 'mobile'",
              "return ['single', 'side', 'multi'].includes(settingsStore.settings.menu.mode) || settingsStore.mode === 'mobile'",
          )
          replace_once(
              'src/layouts/index.vue',
              """  return settingsStore.settings.menu.mode === 'single'
    || (settingsStore.settings.menu.mode === 'head' && settingsStore.mode !== 'mobile')""",
              """  return ['single', 'multi'].includes(settingsStore.settings.menu.mode)
    || (settingsStore.settings.menu.mode === 'head' && settingsStore.mode !== 'mobile')""",
          )
          replace_once(
              'src/layouts/index.vue',
              """  &[data-menu-mode="single"] {
    .sidebar-container {""",
              """  &[data-menu-mode="single"],
  &[data-menu-mode="multi"] {
    .sidebar-container {""",
          )

          replace_once(
              'src/layouts/components/MainSidebar/index.vue',
              """    <div v-if="settingsStore.settings.menu.mode === 'side' || (settingsStore.mode === 'mobile' && settingsStore.settings.menu.mode !== 'single')" class="main-sidebar-container">""",
              """    <div v-if="settingsStore.settings.menu.mode === 'side' || (settingsStore.mode === 'mobile' && !['single', 'multi'].includes(settingsStore.settings.menu.mode))" class="main-sidebar-container">""",
          )

          replace_once(
              'src/layouts/components/SubSidebar/index.vue',
              """const settingsStore = useSettingsStore()
const menuStore = useMenuStore()

const enableSidebar = computed(() => {
  return settingsStore.mode === 'mobile' || (
    menuStore.sidebarMenus.length !== 0
    && !menuStore.sidebarMenus.every(item => item.meta?.menu === false)
  )
})""",
              """const settingsStore = useSettingsStore()
const menuStore = useMenuStore()

const isMultiLevelMode = computed(() => settingsStore.settings.menu.mode === 'multi')
const multiLevelMenus = computed<Menu.recordRaw[]>(() => {
  return menuStore.allMenus.map(item => ({
    meta: item.meta,
    children: item.children,
  }))
})

const enableSidebar = computed(() => {
  const menus = isMultiLevelMode.value ? multiLevelMenus.value : menuStore.sidebarMenus
  return settingsStore.mode === 'mobile' || (
    menus.length !== 0
    && !menus.every(item => item.meta?.menu === false)
  )
})""",
          )
          replace_once(
              'src/layouts/components/SubSidebar/index.vue',
              """        v-if="['side', 'single'].includes(settingsStore.settings.menu.mode)" :show-logo="settingsStore.settings.menu.mode === 'single'" class="sidebar-logo" :class="{
          'single': settingsStore.settings.menu.mode === 'single',""",
              """        v-if="['side', 'single', 'multi'].includes(settingsStore.settings.menu.mode)" :show-logo="['single', 'multi'].includes(settingsStore.settings.menu.mode)" class="sidebar-logo" :class="{
          'single': ['single', 'multi'].includes(settingsStore.settings.menu.mode),""",
          )
          replace_once(
              'src/layouts/components/SubSidebar/index.vue',
              """      <FaScrollArea :scrollbar="false" mask gradient-color="var(--mrr-navigation-bg-solid)" class="flex-1 overscroll-contain">
        <TransitionGroup :name="transitionName">
          <template v-for="(mainItem, mainIndex) in menuStore.allMenus" :key="mainIndex">
            <div v-show="mainIndex === menuStore.actived">
              <Menu
                :menu="mainItem.children" :value="route.meta.activeMenu || route.path" :default-openeds="menuStore.defaultOpenedPaths" :accordion="settingsStore.settings.menu.subMenuUniqueOpened" :collapse="settingsStore.mode === 'pc' && settingsStore.settings.menu.subMenuCollapse" class="menu"
              />
            </div>
          </template>
        </TransitionGroup>
      </FaScrollArea>""",
              """      <FaScrollArea :scrollbar="false" mask gradient-color="var(--mrr-navigation-bg-solid)" class="flex-1 overscroll-contain">
        <Menu
          v-if="isMultiLevelMode"
          :menu="multiLevelMenus"
          :value="route.meta.activeMenu || route.path"
          :default-openeds="menuStore.defaultOpenedPaths"
          :accordion="settingsStore.settings.menu.subMenuUniqueOpened"
          :collapse="settingsStore.mode === 'pc' && settingsStore.settings.menu.subMenuCollapse"
          class="menu menu--multi-level"
        />
        <TransitionGroup v-else :name="transitionName">
          <template v-for="(mainItem, mainIndex) in menuStore.allMenus" :key="mainIndex">
            <div v-show="mainIndex === menuStore.actived">
              <Menu
                :menu="mainItem.children" :value="route.meta.activeMenu || route.path" :default-openeds="menuStore.defaultOpenedPaths" :accordion="settingsStore.settings.menu.subMenuUniqueOpened" :collapse="settingsStore.mode === 'pc' && settingsStore.settings.menu.subMenuCollapse" class="menu"
              />
            </div>
          </template>
        </TransitionGroup>
      </FaScrollArea>""",
          )
          replace_once(
              'src/layouts/components/SubSidebar/index.vue',
              """      <div v-if="settingsStore.settings.menu.mode === 'single'" class="account-area flex-center px-3 pb-3">""",
              """      <div v-if="['single', 'multi'].includes(settingsStore.settings.menu.mode)" class="account-area flex-center px-3 pb-3">""",
          )
          replace_once(
              'src/layouts/components/SubSidebar/index.vue',
              """  .collapse-area {
    border-top: 1px solid var(--mrr-navigation-border);
  }""",
              """  .menu--multi-level {
    padding-top: 10px;

    :deep(> .menu-item) {
      padding-inline: 0;
    }

    :deep(> .menu-item > .menu-item-container) {
      min-height: 40px;
      padding-inline: 10px !important;
      font-weight: 620;
      color: var(--text-primary) !important;
      background: color-mix(in srgb, var(--mrr-navigation-hover) 48%, transparent);
      border-radius: var(--mrr-radius-md);
    }

    :deep(> .sub-menu) {
      margin: 2px 0 7px 13px;
      padding-inline-start: 7px;
      border-inline-start: 1px solid var(--mrr-navigation-border);
    }
  }

  .collapse-area {
    border-top: 1px solid var(--mrr-navigation-border);
  }""",
          )

          replace_once(
              'src/views/settings/components/AppConfigPanel.vue',
              """              <FaTooltip text="侧边栏模式（不含主导航）" :delay="500">
                <button type="button" class="mode mode-single" :class="{ active: settingsStore.settings.menu.mode === 'single' }" @click="settingsStore.settings.menu.mode = 'single'">
                  <span class="mode-container" />
                </button>
              </FaTooltip>""",
              """              <FaTooltip text="左侧多级菜单（单栏分组展开）" :delay="500">
                <button type="button" class="mode mode-multi" :class="{ active: settingsStore.settings.menu.mode === 'multi' }" @click="settingsStore.settings.menu.mode = 'multi'">
                  <span class="mode-container" />
                </button>
              </FaTooltip>
              <FaTooltip text="侧边栏模式（不含主导航）" :delay="500">
                <button type="button" class="mode mode-single" :class="{ active: settingsStore.settings.menu.mode === 'single' }" @click="settingsStore.settings.menu.mode = 'single'">
                  <span class="mode-container" />
                </button>
              </FaTooltip>""",
          )
          replace_once(
              'src/views/settings/components/AppConfigPanel.vue',
              """          <div class="setting-item">
            <div class="label-copy">
              <strong>主导航点击模式</strong>""",
              """          <div v-if="!['single', 'multi'].includes(settingsStore.settings.menu.mode)" class="setting-item">
            <div class="label-copy">
              <strong>主导航点击模式</strong>""",
          )
          replace_once(
              'src/views/settings/components/AppConfigPanel.vue',
              """            <FaSwitch v-model="settingsStore.settings.menu.enableHotkeys" :disabled="['single'].includes(settingsStore.settings.menu.mode)" />""",
              """            <FaSwitch v-model="settingsStore.settings.menu.enableHotkeys" :disabled="['single', 'multi'].includes(settingsStore.settings.menu.mode)" />""",
          )
          replace_once(
              'src/views/settings/components/AppConfigPanel.vue',
              """.menu-mode {
  display: flex;
  gap: 14px;""",
              """.menu-mode {
  display: flex;
  flex-wrap: wrap;
  gap: 14px;""",
          )
          replace_once(
              'src/views/settings/components/AppConfigPanel.vue',
              """.mode-single::after {
  top: 8px;""",
              """.mode-multi::before {
  top: 8px;
  bottom: 8px;
  left: 8px;
  width: 16px;
  border-radius: 4px 0 0 4px;
}

.mode-multi::after {
  top: 14px;
  left: 12px;
  width: 8px;
  height: 2px;
  border-radius: 999px;
  box-shadow: 0 7px 0 color-mix(in srgb, var(--el-color-primary) 60%, transparent), 0 14px 0 color-mix(in srgb, var(--el-color-primary) 60%, transparent);
}

.mode-multi .mode-container {
  inset: 8px 8px 8px 26px;
  border-radius: 0 4px 4px 0;
}

.mode-single::after {
  top: 8px;""",
          )
          PY

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend-fantastic-admin/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend-fantastic-admin
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        working-directory: frontend-fantastic-admin
        run: pnpm build

      - name: Commit implementation
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend-fantastic-admin/src/types/global.d.ts \
            frontend-fantastic-admin/src/layouts/index.vue \
            frontend-fantastic-admin/src/layouts/components/MainSidebar/index.vue \
            frontend-fantastic-admin/src/layouts/components/SubSidebar/index.vue \
            frontend-fantastic-admin/src/views/settings/components/AppConfigPanel.vue
          git commit -m "feat: add left multilevel navigation mode"
          git push origin HEAD:feat/navigation-multilevel-menu
