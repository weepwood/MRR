name: archive-folder-typography-autofix

on:
  push:
    branches:
      - style/unify-archive-folder-typography-20260713

permissions:
  contents: write

jobs:
  apply-typography:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: style/unify-archive-folder-typography-20260713
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend-fantastic-admin/.node-version
          cache: pnpm
          cache-dependency-path: frontend-fantastic-admin/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend-fantastic-admin
        run: pnpm install --frozen-lockfile

      - name: Apply archive folder typography
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('frontend-fantastic-admin/src/views/statistics-detail/ArchiveDetailContent.vue')
          text = path.read_text(encoding='utf-8')

          def replace_once(old: str, new: str, label: str) -> None:
              global text
              if text.count(old) != 1:
                  raise RuntimeError(f'{label}: expected exactly one match, found {text.count(old)}')
              text = text.replace(old, new, 1)

          replace_once(
              '<div class="folder-code-block folder-code-block-full">\n                <span class="folder-code-label">病人姓名</span>',
              '<div class="folder-code-block folder-code-block-full folder-code-block--patient">\n                <span class="folder-code-label">病人姓名</span>',
              'patient name block class',
          )

          replace_once(
              '''  --folder-accent: #1d4ed8;
          --folder-tint: #eef4ff;

          position: relative;''',
              '''  --folder-accent: #1d4ed8;
          --folder-tint: #eef4ff;
          --folder-meta-font-size: 11px;
          --folder-value-font-size: 14px;
          --folder-patient-name-font-size: 17px;

          position: relative;''',
              'folder typography variables',
          )

          replace_once('''  font-size: 10px;
          font-weight: 800;
          font-variant-numeric: tabular-nums;''', '''  font-size: var(--folder-meta-font-size);
          font-weight: 800;
          font-variant-numeric: tabular-nums;''', 'folder index size')

          replace_once('''  padding: 3px 7px;
          font-size: 10px;
          font-weight: 700;''', '''  padding: 3px 7px;
          font-size: var(--folder-meta-font-size);
          font-weight: 700;''', 'selected label size')

          replace_once(
              '''.folder-identity {
          display: flex;
          flex-wrap: wrap;
          gap: 8px;
          align-items: center;
          }

          .folder-index {''',
              '''.folder-identity {
          display: flex;
          flex-wrap: wrap;
          gap: 8px;
          align-items: center;
          }

          .folder-top :deep(.el-tag) {
          font-size: var(--folder-meta-font-size);
          }

          .folder-index {''',
              'archive type tag size',
          )

          replace_once('''  font-size: 10px;
          font-weight: 700;
          color: var(--text-secondary);
          letter-spacing: 0.08em;''', '''  font-size: var(--folder-meta-font-size);
          font-weight: 700;
          color: var(--text-secondary);
          letter-spacing: 0.08em;''', 'field label size')

          replace_once('''  font-size: clamp(15px, 1.4vw, 18px);
          font-weight: 800;''', '''  font-size: var(--folder-value-font-size);
          font-weight: 750;''', 'field value size')

          replace_once(
              '''.folder-code-block-full .folder-code-value {
          flex: 1;
          min-width: 0;
          text-align: right;
          font-size: clamp(18px, 3.2vw, 20px);
          line-height: 1.1;
          color: color-mix(in srgb, var(--text-primary) 88%, var(--bg));
          }

          .folder-code-block:nth-child(-n+2) .folder-code-value {
          font-size: clamp(13px, 1.2vw, 14px);
          font-weight: 700;
          color: color-mix(in srgb, var(--text-primary) 88%, var(--bg));
          }''',
              '''.folder-code-block--patient .folder-code-value {
          flex: 1;
          min-width: 0;
          font-size: var(--folder-patient-name-font-size);
          font-weight: 800;
          line-height: 1.2;
          color: var(--text-primary);
          text-align: right;
          letter-spacing: 0.01em;
          }''',
              'patient emphasis and legacy size overrides',
          )

          replace_once('''  font-size: 22px;
          font-variant-numeric: tabular-nums;''', '''  font-size: var(--folder-value-font-size);
          font-weight: 800;
          font-variant-numeric: tabular-nums;''', 'page count size')

          replace_once('''  font-size: 11px;
          font-weight: 700;
          color: var(--text-secondary);''', '''  font-size: var(--folder-meta-font-size);
          font-weight: 700;
          color: var(--text-secondary);''', 'page count label size')

          replace_once('''.folder-action {
          font-weight: 700;
          }''', '''.folder-action {
          font-size: var(--folder-value-font-size);
          font-weight: 700;
          }''', 'folder action size')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Format and verify styles
        working-directory: frontend-fantastic-admin
        run: |
          pnpm exec stylelint src/views/statistics-detail/ArchiveDetailContent.vue --fix
          pnpm exec stylelint src/views/statistics-detail/ArchiveDetailContent.vue
          pnpm exec eslint src/views/statistics-detail/ArchiveDetailContent.vue
          pnpm lint:tsc

      - name: Commit typography update
        run: |
          rm .github/workflows/archive-folder-typography-autofix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add frontend-fantastic-admin/src/views/statistics-detail/ArchiveDetailContent.vue .github/workflows/archive-folder-typography-autofix.yml
          git commit -m "style(statistics-detail): unify archive folder typography"
          git push origin HEAD:style/unify-archive-folder-typography-20260713
