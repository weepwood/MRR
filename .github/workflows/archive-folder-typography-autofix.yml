name: archive-folder-typography-autofix

on:
  push:
    branches:
      - style/unify-archive-folder-typography-20260713

permissions:
  contents: write

jobs:
  apply-typography:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: style/unify-archive-folder-typography-20260713
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend-fantastic-admin/.node-version
          cache: pnpm
          cache-dependency-path: frontend-fantastic-admin/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend-fantastic-admin
        run: pnpm install --frozen-lockfile

      - name: Apply archive folder typography
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('frontend-fantastic-admin/src/views/statistics-detail/ArchiveDetailContent.vue')
          text = path.read_text(encoding='utf-8')

          def replace_once(old: str, new: str, label: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{label}: expected exactly one match, found {count}')
              text = text.replace(old, new, 1)

          def regex_once(pattern: str, replacement: str, label: str) -> None:
              global text
              text, count = re.subn(pattern, replacement, text, count=1, flags=re.MULTILINE)
              if count != 1:
                  raise RuntimeError(f'{label}: expected exactly one match, found {count}')

          replace_once(
              '<div class="folder-code-block folder-code-block-full">',
              '<div class="folder-code-block folder-code-block-full folder-code-block--patient">',
              'patient name block class',
          )

          replace_once(
              '  --folder-tint: #eef4ff;\n\n  position: relative;',
              '  --folder-tint: #eef4ff;\n  --folder-meta-font-size: 11px;\n  --folder-value-font-size: 14px;\n  --folder-patient-name-font-size: 17px;\n\n  position: relative;',
              'folder typography variables',
          )

          regex_once(
              r'(\.folder-identity \{.*?^\})\n\n(\.folder-index \{)',
              r'\1\n\n.folder-top :deep(.el-tag) {\n  font-size: var(--folder-meta-font-size);\n}\n\n\2',
              'archive type tag size',
          )

          regex_once(
              r'(\.folder-index \{.*?^\s*)font-size: 10px;',
              r'\1font-size: var(--folder-meta-font-size);',
              'folder index size',
          )

          regex_once(
              r'(\.folder-selected-label \{.*?^\s*)font-size: 10px;',
              r'\1font-size: var(--folder-meta-font-size);',
              'selected label size',
          )

          regex_once(
              r'(\.folder-code-label \{.*?^\s*)font-size: 10px;',
              r'\1font-size: var(--folder-meta-font-size);',
              'field label size',
          )

          regex_once(
              r'(\.folder-code-value \{.*?^\s*)font-size: clamp\(15px, 1\.4vw, 18px\);\n\s*font-weight: 800;',
              r'\1font-size: var(--folder-value-font-size);\n  font-weight: 750;',
              'field value size',
          )

          regex_once(
              r'\.folder-code-block-full \.folder-code-value \{.*?^\}\n\n\.folder-code-block:nth-child\(-n\+2\) \.folder-code-value \{.*?^\}',
              '.folder-code-block--patient .folder-code-value {\n  flex: 1;\n  min-width: 0;\n  font-size: var(--folder-patient-name-font-size);\n  font-weight: 800;\n  line-height: 1.2;\n  color: var(--text-primary);\n  text-align: right;\n  letter-spacing: 0.01em;\n}',
              'patient emphasis and legacy size overrides',
          )

          regex_once(
              r'(\.folder-page-count strong \{.*?^\s*)font-size: 22px;',
              r'\1font-size: var(--folder-value-font-size);\n  font-weight: 800;',
              'page count size',
          )

          regex_once(
              r'(\.folder-page-count span \{.*?^\s*)font-size: 11px;',
              r'\1font-size: var(--folder-meta-font-size);',
              'page count label size',
          )

          replace_once(
              '.folder-action {\n  font-weight: 700;\n}',
              '.folder-action {\n  font-size: var(--folder-value-font-size);\n  font-weight: 700;\n}',
              'folder action size',
          )

          path.write_text(text, encoding='utf-8')
          PY

      - name: Format and verify styles
        working-directory: frontend-fantastic-admin
        run: |
          pnpm exec stylelint src/views/statistics-detail/ArchiveDetailContent.vue --fix
          pnpm exec stylelint src/views/statistics-detail/ArchiveDetailContent.vue
          pnpm exec eslint src/views/statistics-detail/ArchiveDetailContent.vue
          pnpm lint:tsc

      - name: Commit typography update
        run: |
          rm .github/workflows/archive-folder-typography-autofix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add frontend-fantastic-admin/src/views/statistics-detail/ArchiveDetailContent.vue .github/workflows/archive-folder-typography-autofix.yml
          git commit -m "style(statistics-detail): unify archive folder typography"
          git push origin HEAD:style/unify-archive-folder-typography-20260713
