name: backend-normalization-check

on:
  workflow_dispatch:

permissions:
  contents: read

# 同一分支连续 push 时取消旧运行，避免并行落盘多份构建日志。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend-repo

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend-repo/pom.xml

      - name: Compile backend
        shell: bash
        run: |
          set +e
          mvn -q -DskipTests compile > ../backend-compile.log 2>&1
          status=$?
          tail -n 160 ../backend-compile.log
          exit $status

      - name: Upload compile failure log
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: backend-compile-log
          path: backend-compile.log
          if-no-files-found: ignore
          retention-days: 3

      - name: Compile tests and run normalization tests
        shell: bash
        run: |
          set +e
          mvn -q -Dtest=MedicalRecordCodeUtilsTest test > ../backend-test.log 2>&1
          status=$?
          tail -n 160 ../backend-test.log
          exit $status

      - name: Upload test failure log
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-log
          path: backend-test.log
          if-no-files-found: ignore
          retention-days: 3
