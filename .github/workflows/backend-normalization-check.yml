name: backend-normalization-check

on:
  pull_request:
    branches:
      - main
    paths:
      - 'backend-repo/**'
      - '.github/workflows/backend-normalization-check.yml'
  push:
    branches:
      - feat/oss-migration-management-20260722
    paths:
      - '.github/workflows/backend-normalization-check.yml'

permissions:
  contents: write

jobs:
  apply-review-fix:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '触发 OSS 浏览缓存边界修复')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/oss-migration-management-20260722
          fetch-depth: 0
      - name: Apply regression test and cache boundary fix
        run: |
          python3 - <<'PY'
          from pathlib import Path

          service_path = Path('backend-repo/src/main/java/com/zjcxph/imgapi/service/impl/OssServiceImpl.java')
          service = service_path.read_text(encoding='utf-8')
          old = '''    @Override
    @Cacheable(value = "ossSignedUrl", key = "#ossKey", unless = "#result == null")
    public String generateBrowserPresignedUrl(String ossKey) {'''
          new = '''    @Override
    public String generateBrowserPresignedUrl(String ossKey) {'''
          if old not in service:
              raise SystemExit('未找到浏览器签名缓存注解')
          service_path.write_text(service.replace(old, new, 1), encoding='utf-8')

          test_path = Path('backend-repo/src/test/java/com/zjcxph/imgapi/unit/service/OssServiceImplTest.java')
          test = test_path.read_text(encoding='utf-8')
          marker = '''    @Test
    @DisplayName("deleteObject — 不抛异常即成功")
    void deleteObjectDoesNotThrow() {'''
          addition = '''    @Test
    @DisplayName("浏览器签名方法不得复用通用签名 URL 缓存")
    void browserPresignedUrlValidationCannotBeBypassedBySharedCache() throws Exception {
        var method = OssServiceImpl.class.getMethod("generateBrowserPresignedUrl", String.class);

        assertThat(method.getAnnotation(org.springframework.cache.annotation.Cacheable.class)).isNull();
    }

    @Test
    @DisplayName("deleteObject — 不抛异常即成功")
    void deleteObjectDoesNotThrow() {'''
          if marker not in test:
              raise SystemExit('未找到 OSS 服务测试插入位置')
          test_path.write_text(test.replace(marker, addition, 1), encoding='utf-8')
          PY
      - name: Commit review fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend-repo/src/main/java/com/zjcxph/imgapi/service/impl/OssServiceImpl.java \
            backend-repo/src/test/java/com/zjcxph/imgapi/unit/service/OssServiceImplTest.java
          git commit -m "修复：隔离 OSS 浏览签名地址缓存边界"
          git push origin HEAD:feat/oss-migration-management-20260722

  backend-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-repo

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend-repo/pom.xml

      - name: Compile backend
        shell: bash
        run: |
          set +e
          mvn -q -DskipTests compile > ../backend-compile.log 2>&1
          status=$?
          tail -n 160 ../backend-compile.log
          exit $status

      - name: Upload compile failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-compile-log
          path: backend-compile.log
          if-no-files-found: ignore

      - name: Compile tests and run normalization tests
        shell: bash
        run: |
          set +e
          mvn -q -Dtest=MedicalRecordCodeUtilsTest test > ../backend-test.log 2>&1
          status=$?
          tail -n 160 ../backend-test.log
          exit $status

      - name: Upload test failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-log
          path: backend-test.log
          if-no-files-found: ignore

# trigger-after-push-definition
