name: backend-normalization-check

on:
  pull_request:
    branches:
      - dev-no-login
    paths:
      - 'backend-repo/**'
      - '.github/workflows/backend-normalization-check.yml'

permissions:
  contents: read

jobs:
  backend-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-repo

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend-repo/pom.xml

      - name: Compile backend
        run: mvn -B -DskipTests compile

      - name: Compile tests and run normalization tests
        run: mvn -B -Dtest=MedicalRecordCodeUtilsTest test
