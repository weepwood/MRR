name: bootstrap-frontend-coverage

on:
  push:
    branches:
      - chore/frontend-coverage-baseline
    paths:
      - .github/workflows/bootstrap-frontend-coverage.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/bootstrap-frontend-coverage.yml

permissions:
  contents: write

concurrency:
  group: bootstrap-frontend-coverage
  cancel-in-progress: true

jobs:
  patch-quality-gate:
    if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout coverage branch
        uses: actions/checkout@v7
        with:
          ref: chore/frontend-coverage-baseline

      - name: Patch frontend coverage steps
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/quality-gate.yml')
          text = path.read_text(encoding='utf-8')
          before = "      - name: Unit Test\n        run: pnpm test:run\n\n"
          after = """      - name: Unit Test with coverage
                  run: pnpm test:coverage

                - name: Summarize frontend coverage
                  shell: bash
                  run: |
                    set -euo pipefail
                    baseline_args=()
                    if [ -f ../quality/frontend-coverage-baseline.json ]; then
                      baseline_args+=(--baseline ../quality/frontend-coverage-baseline.json)
                    fi
                    python ../scripts/vitest_coverage.py \\
                      --summary coverage/coverage-summary.json \\
                      \"${baseline_args[@]}\" \\
                      --max-regression 0.50 \\
                      --output-json coverage/coverage-comparison.json \\
                      --output-markdown coverage/coverage-comparison.md \\
                      --github-summary \"${GITHUB_STEP_SUMMARY}\"

                - name: Upload frontend coverage report
                  if: always()
                  uses: actions/upload-artifact@v7
                  with:
                    name: frontend-coverage-report
                    path: frontend-fantastic-admin/coverage
                    if-no-files-found: ignore
                    retention-days: 30

          """
          if before not in text:
              raise SystemExit('Expected frontend unit test block was not found')
          path.write_text(text.replace(before, after, 1), encoding='utf-8')
          PY

      - name: Commit quality gate update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/quality-gate.yml
          git commit -m "工程：接入前端覆盖率报告"
          git push origin HEAD:chore/frontend-coverage-baseline
