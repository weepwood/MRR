name: bootstrap-frontend-coverage

on:
  push:
    branches:
      - chore/frontend-coverage-baseline
    paths:
      - .github/workflows/bootstrap-frontend-coverage.yml

permissions:
  contents: write

jobs:
  update-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend-fantastic-admin
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: chore/frontend-coverage-baseline

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend-fantastic-admin/.node-version
          cache: pnpm
          cache-dependency-path: frontend-fantastic-admin/pnpm-lock.yaml

      - name: Install matching Vitest coverage provider
        run: pnpm add --save-dev --save-exact @vitest/coverage-v8@3.2.4

      - name: Commit generated manifest and lockfile
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend-fantastic-admin/package.json frontend-fantastic-admin/pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "pnpm did not produce dependency changes."
            exit 0
          fi
          git commit -m "工程：添加 Vitest 覆盖率 provider"
          git push origin HEAD:chore/frontend-coverage-baseline
