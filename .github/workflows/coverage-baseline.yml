name: coverage-baseline

on:
  workflow_run:
    workflows:
      - quality-gate
    types:
      - completed
  workflow_dispatch:
    inputs:
      run_id:
        description: 包含后端测试报告的 quality-gate workflow run ID
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: coverage-baseline-${{ github.event.workflow_run.id || inputs.run_id }}
  cancel-in-progress: true

jobs:
  summarize-backend-coverage:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SOURCE_RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
    steps:
      - name: Checkout coverage tooling
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download integration coverage artifact
        id: integration-artifact
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: backend-integration-test-reports
          path: artifacts/integration
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download unit coverage artifact
        id: unit-artifact
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: backend-unit-test-reports
          path: artifacts/unit
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Locate JaCoCo XML
        id: jacoco
        shell: bash
        run: |
          set -euo pipefail
          xml_path="$(find artifacts -path '*/site/jacoco/jacoco.xml' -print -quit 2>/dev/null || true)"
          if [ -z "${xml_path}" ]; then
            echo 'available=false' >> "${GITHUB_OUTPUT}"
            {
              echo '## 后端 JaCoCo 覆盖率'
              echo
              echo "quality-gate run ${SOURCE_RUN_ID} 没有生成后端覆盖率制品，通常表示本次仅修改前端或文档。"
            } >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          echo 'available=true' >> "${GITHUB_OUTPUT}"
          echo "xml_path=${xml_path}" >> "${GITHUB_OUTPUT}"

      - name: Compare coverage with baseline
        if: steps.jacoco.outputs.available == 'true'
        run: |
          python scripts/jacoco_coverage.py \
            --xml "${{ steps.jacoco.outputs.xml_path }}" \
            --baseline quality/coverage-baseline.json \
            --max-regression 0.50 \
            --output-json coverage-summary.json \
            --output-markdown coverage-summary.md \
            --github-summary "${GITHUB_STEP_SUMMARY}"

      - name: Upload coverage summary
        if: steps.jacoco.outputs.available == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage-summary-${{ env.SOURCE_RUN_ID }}
          path: |
            coverage-summary.json
            coverage-summary.md
          retention-days: 30
