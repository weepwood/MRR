name: css-organize-autofix

on:
  push:
    branches:
      - refactor/organize-css-20260713
    paths:
      - 'frontend-fantastic-admin/**'
      - '.github/workflows/css-organize-autofix.yml'

permissions:
  contents: write

concurrency:
  group: css-organize-autofix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stylelint-autofix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend-fantastic-admin
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: refactor/organize-css-20260713
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend-fantastic-admin/.node-version
          cache: pnpm
          cache-dependency-path: frontend-fantastic-admin/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply Stylelint fixes
        run: pnpm lint:stylelint:fix

      - name: Verify styles
        run: pnpm lint:stylelint

      - name: Commit fixes and remove one-off workflow
        working-directory: .
        run: |
          rm .github/workflows/css-organize-autofix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add frontend-fantastic-admin .github/workflows/css-organize-autofix.yml
          if git diff --cached --quiet; then
            echo "No Stylelint fixes were needed."
            exit 0
          fi
          git commit -m "style(css): apply stylelint fixes across frontend"
          git push origin HEAD:refactor/organize-css-20260713
