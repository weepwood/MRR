name: dependency-backend-refresh

on:
  push:
    branches:
      - chore/dependabot-backend-libraries-20260728

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - name: Apply dependency versions
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('backend-repo/pom.xml')
          text = path.read_text(encoding='utf-8')
          replacements = {
              '<java-jwt.version>4.5.1</java-jwt.version>': '<java-jwt.version>4.6.0</java-jwt.version>',
              '<aws-sdk.version>1.12.500</aws-sdk.version>': '<aws-sdk.version>1.12.797</aws-sdk.version>',
              '<version>5.3.0</version>': '<version>5.5.1</version>',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Expected version marker not found: {old}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit updates and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend-repo/pom.xml
          git rm .github/workflows/dependency-backend-refresh.yml
          git commit -m "依赖：整合后端常规库升级"
          git push
