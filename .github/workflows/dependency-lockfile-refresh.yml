name: dependency-lockfile-refresh

on:
  push:
    branches:
      - chore/dependabot-frontend-tooling-20260728

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend-fantastic-admin/.node-version
          cache: pnpm
          cache-dependency-path: frontend-fantastic-admin/pnpm-lock.yaml

      - name: Refresh lockfile
        working-directory: frontend-fantastic-admin
        run: pnpm install --lockfile-only --no-frozen-lockfile --ignore-scripts

      - name: Commit lockfile and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend-fantastic-admin/package.json frontend-fantastic-admin/pnpm-lock.yaml
          git rm .github/workflows/dependency-lockfile-refresh.yml
          git commit -m "依赖：刷新前端工具链锁文件"
          git push
