name: deploy-pages-demo

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/deploy-pages-demo.yml'
      - 'frontend-fantastic-admin/**'
      - 'VERSION'
      - 'release-baseline.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-pages-demo.yml'
      - 'frontend-fantastic-admin/**'
      - 'VERSION'
      - 'release-baseline.json'

# PR 上连续推送时只保留最新一次运行；main 发布不中途取消，避免 Pages 部署半途而废。
concurrency:
  group: github-pages-mrr-demo-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      pages_demo_smoke: ${{ steps.select.outputs.pages_demo_smoke }}
      targeted_e2e_specs: ${{ steps.targeted.outputs.specs }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Select Pages demo validation scope
        id: select
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 -m scripts.ci_gate scope --mode pr --base "${PR_BASE_SHA}" --head "${PR_HEAD_SHA}" --output "${GITHUB_OUTPUT}"
      - name: Select changed mock browser specs
        id: targeted
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/ci_targeted_e2e.py select --base "${PR_BASE_SHA}" --head "${PR_HEAD_SHA}" --output "${GITHUB_OUTPUT}"

  build:
    needs: scope
    if: always() && (github.event_name != 'pull_request' || needs.scope.outputs.pages_demo_smoke != 'false')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend-fantastic-admin
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 配置 pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - name: 配置 Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: frontend-fantastic-admin/.node-version
          cache: pnpm
          cache-dependency-path: frontend-fantastic-admin/pnpm-lock.yaml

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 生成演示环境文件
        run: cp .env.pages.example .env.pages

      - name: 构建静态演示版本
        run: pnpm build:pages

      - name: 读取 Playwright 版本
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "${GITHUB_OUTPUT}"

      - name: 缓存 Playwright 浏览器
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ steps.playwright.outputs.version }}

      - name: 安装 Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: 安装 Chromium 系统依赖（浏览器已缓存）
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: Pages 静态演示冒烟
        run: node e2e/smoke-pages-demo.mjs

      - name: 定向 Mock 浏览器回归
        if: github.event_name == 'pull_request' && needs.scope.outputs.targeted_e2e_specs != '' && needs.scope.outputs.targeted_e2e_specs != '[]'
        timeout-minutes: 10
        env:
          TARGETED_E2E_SPECS: ${{ needs.scope.outputs.targeted_e2e_specs }}
        run: python3 ../scripts/ci_targeted_e2e.py run

      - name: 上传 Pages 构建产物
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: frontend-fantastic-admin/dist-pages

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 配置 GitHub Pages
        uses: actions/configure-pages@v6

      - name: 发布 Pages 演示站
        id: deployment
        uses: actions/deploy-pages@v5
