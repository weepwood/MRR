name: 一次性诊断 MRR 0.7.2 发布状态

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/diagnose-release-0.7.2-once.yml

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Collect and publish status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          report="$(mktemp)"
          {
            echo '## MRR 0.7.2 发布状态诊断'
            echo
            echo '### Windows release package'
            echo '```text'
            gh run list --repo "$GITHUB_REPOSITORY" --workflow windows-release-package.yml \
              --branch v0.7.2 --limit 10 || true
            echo '```'
            echo
            echo '### Standalone JAR release'
            echo '```text'
            gh run list --repo "$GITHUB_REPOSITORY" --workflow standalone-jar-release.yml \
              --branch v0.7.2 --limit 10 || true
            echo '```'
            echo
            echo '### 资产验收与自愈任务'
            echo '```text'
            gh run list --repo "$GITHUB_REPOSITORY" --workflow verify-release-0.7.2-once.yml \
              --branch main --limit 5 || true
            gh run list --repo "$GITHUB_REPOSITORY" --workflow ensure-release-0.7.2-assets-once.yml \
              --branch main --limit 5 || true
            echo '```'
            echo
            echo '### GitHub Release'
            echo '```json'
            gh release view v0.7.2 --repo "$GITHUB_REPOSITORY" \
              --json tagName,name,isDraft,isPrerelease,publishedAt,assets 2>/dev/null \
              | jq '{tagName,name,isDraft,isPrerelease,publishedAt,assets:[.assets[]|{name,size,state,updatedAt}]}' \
              || echo '{"release":"not-found"}'
            echo '```'
          } > "$report"

          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/issues/217/comments" \
            -f body="$(cat "$report")"

      - name: Remove diagnostic workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/diagnose-release-0.7.2-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "发布：完成 MRR 0.7.2 构建状态诊断"
          git push origin main
