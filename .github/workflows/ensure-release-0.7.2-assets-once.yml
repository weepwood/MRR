name: 一次性确保 MRR 0.7.2 正式资产

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/ensure-release-0.7.2-assets-once.yml

permissions:
  actions: write
  contents: write

jobs:
  ensure:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      RELEASE_TAG: v0.7.2
      ZIP_NAME: MRR-v0.7.2.zip
      JAR_NAME: MRR-v0.7.2-standalone.jar
      SHA_NAME: MRR-v0.7.2-standalone.jar.sha256
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Ensure official workflows are running
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          ensure_workflow() {
            workflow="$1"
            runs="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$workflow" \
              --branch "$RELEASE_TAG" --limit 20 \
              --json databaseId,status,conclusion,event,headBranch,headSha,url 2>/dev/null || printf '[]')"
            echo "$workflow runs:"
            echo "$runs" | jq .

            if jq -e 'any(.[]; .status == "queued" or .status == "in_progress" or .status == "waiting" or .status == "requested" or .status == "pending")' \
              <<< "$runs" >/dev/null; then
              echo "$workflow 已有运行中任务"
              return
            fi
            if jq -e 'any(.[]; .status == "completed" and .conclusion == "success")' \
              <<< "$runs" >/dev/null; then
              echo "$workflow 已有成功任务"
              return
            fi

            echo "$workflow 没有运行中或成功任务，重新调度"
            gh workflow run "$workflow" --repo "$GITHUB_REPOSITORY" --ref "$RELEASE_TAG"
          }

          ensure_workflow windows-release-package.yml
          ensure_workflow standalone-jar-release.yml

      - name: Wait for complete formal Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          found=false
          for attempt in $(seq 1 160); do
            if json="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --json tagName,name,isDraft,isPrerelease,assets 2>/dev/null)"; then
              if jq -e \
                --arg tag "$RELEASE_TAG" \
                --arg zip "$ZIP_NAME" \
                --arg jar "$JAR_NAME" \
                --arg sha "$SHA_NAME" \
                '.tagName == $tag
                 and (.isDraft | not)
                 and (.isPrerelease | not)
                 and ([.assets[].name] | index($zip)) != null
                 and ([.assets[].name] | index($jar)) != null
                 and ([.assets[].name] | index($sha)) != null
                 and ([.assets[] | select(.name == $zip or .name == $jar or .name == $sha) | .size > 0] | all)' \
                <<< "$json" >/dev/null; then
                found=true
                echo "$json" | jq .
                break
              fi
            fi
            if (( attempt % 20 == 0 )); then
              echo "构建状态快照："
              gh run list --repo "$GITHUB_REPOSITORY" --workflow windows-release-package.yml \
                --branch "$RELEASE_TAG" --limit 5 || true
              gh run list --repo "$GITHUB_REPOSITORY" --workflow standalone-jar-release.yml \
                --branch "$RELEASE_TAG" --limit 5 || true
            fi
            echo "正式资产尚未齐全（${attempt}/160）"
            sleep 15
          done
          test "$found" = true

      - name: Download and verify assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p build/release-verify
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir build/release-verify \
            --pattern "$ZIP_NAME" \
            --pattern "$JAR_NAME" \
            --pattern "$SHA_NAME"

          cd build/release-verify
          test -s "$ZIP_NAME"
          test -s "$JAR_NAME"
          test -s "$SHA_NAME"
          sha256sum -c "$SHA_NAME"
          unzip -t "$ZIP_NAME" >/dev/null
          cd ../..

          python scripts/build_standalone_jar.py verify \
            --jar "build/release-verify/$JAR_NAME" \
            --default-port 8002

          python3 <<'PY'
          import json
          from pathlib import Path
          from zipfile import ZipFile

          package = Path("build/release-verify/MRR-v0.7.2.zip")
          with ZipFile(package) as archive:
              names = set(archive.namelist())
              required = {"VERSION", "manifest.json", "SHA256SUMS", "backend/mrr-backend.jar"}
              missing = required - names
              if missing:
                  raise SystemExit(f"Windows ZIP missing: {sorted(missing)}")
              if archive.read("VERSION").decode("utf-8-sig").strip() != "0.7.2":
                  raise SystemExit("Windows ZIP VERSION mismatch")
              manifest = json.loads(archive.read("manifest.json").decode("utf-8-sig"))
              if manifest.get("productVersion") != "0.7.2":
                  raise SystemExit("Windows ZIP manifest version mismatch")
          PY

      - name: Record success and remove recovery workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/ensure-release-0.7.2-assets-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "发布：确认 MRR 0.7.2 构建与资产完整"
          git push origin main
