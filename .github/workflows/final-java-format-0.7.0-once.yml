name: 一次性最终修正 0.7.0 Java 缩进

on:
  push:
    branches:
      - release/0.7.0
    paths:
      - .github/workflows/final-java-format-0.7.0-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/0.7.0

      - name: 显式重写脱敏辅助方法
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import re
          from pathlib import Path

          path = Path('backend-repo/src/main/java/com/zjcxph/imgapi/service/OperationsCenterService.java')
          content = path.read_text(encoding='utf-8')
          pattern = re.compile(
              r'    static Map<String, Object> redactOverviewForReport\(Map<String, Object> source\) \{.*?'
              r'(?=    static Map<String, Object> redactOperationForReport\(Map<String, Object> source\) \{)',
              re.DOTALL,
          )
          replacement = (
              '    static Map<String, Object> redactOverviewForReport(Map<String, Object> source) {\n'
              '        Map<String, Object> result = new LinkedHashMap<>(source);\n'
              '        Object latestOperation = source.get("latestOperation");\n'
              '        if (latestOperation instanceof Map<?, ?> latestMap && !latestMap.isEmpty()) {\n'
              '            Map<String, Object> normalized = new LinkedHashMap<>();\n'
              '            latestMap.forEach((key, value) -> normalized.put(String.valueOf(key), value));\n'
              '            result.put("latestOperation", redactOperationForReport(normalized));\n'
              '        }\n'
              '        return Map.copyOf(result);\n'
              '    }\n'
              '\n'
              '    static Map<String, Object> redactIntegrityForReport(Map<String, Object> source) {\n'
              '        Map<String, Object> result = new LinkedHashMap<>(source);\n'
              '        Object lastError = source.get("lastError");\n'
              '        if (lastError != null && !String.valueOf(lastError).isBlank()) {\n'
              '            result.put("lastError", "[REDACTED]");\n'
              '        }\n'
              '        return Map.copyOf(result);\n'
              '    }\n'
              '\n'
          )
          updated, count = pattern.subn(replacement, content, count=1)
          if count != 1:
              raise RuntimeError(f'脱敏辅助方法边界匹配数量异常：{count}')
          path.write_text(updated, encoding='utf-8')
          PY

          git diff --check
          git rm .github/workflows/final-java-format-0.7.0-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend-repo/src/main/java/com/zjcxph/imgapi/service/OperationsCenterService.java
          git commit -m "维护：完成 0.7.0 Java 代码格式整理"
          git push origin release/0.7.0
