name: fix-architecture-auth-label-once

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/fix-architecture-auth-label-once.yml'

permissions:
  contents: write

jobs:
  fix-drawio:
    if: github.head_ref == 'chore/cleanup-main-branch-migration'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Update compressed Draw.io labels
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import urllib.parse
          import xml.etree.ElementTree as ET
          import zlib
          from pathlib import Path

          path = Path('vitepress-doc/architecture/MRR-system-architecture.drawio')
          tree = ET.parse(path)
          root = tree.getroot()
          compressed = root.get('compressed', 'true').lower() == 'true'
          replacements = {
              'dev-no-login': 'main',
              '绕过 JWT': '启用 JWT 与 RBAC',
              '故意绕过登录与权限验证': '启用正式登录与权限验证',
              '正式生产需恢复登录与权限校验': '旧兼容访问默认关闭且仅限只读',
              '认证屏蔽分支': '正式认证主分支',
          }

          def decode(payload: str) -> str:
              if not compressed or payload.lstrip().startswith('<mxGraphModel'):
                  return payload
              raw = base64.b64decode(payload)
              return urllib.parse.unquote(zlib.decompress(raw, -15).decode('utf-8'))

          def encode(xml: str) -> str:
              if not compressed:
                  return xml
              escaped = urllib.parse.quote(xml, safe="~()*!.'")
              compressor = zlib.compressobj(level=9, wbits=-15)
              raw = compressor.compress(escaped.encode('utf-8')) + compressor.flush()
              return base64.b64encode(raw).decode('ascii')

          changed = False
          for diagram in root.findall('diagram'):
              decoded = decode(diagram.text or '')
              updated = decoded
              for old, new in replacements.items():
                  updated = updated.replace(old, new)
              if updated != decoded:
                  diagram.text = encode(updated)
                  changed = True

          if not changed:
              raise SystemExit('Draw.io 中没有找到需要修正的认证说明')

          tree.write(path, encoding='utf-8', xml_declaration=True)
          PY
          python scripts/check_main_branch_references.py

      - name: Commit Draw.io fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add vitepress-doc/architecture/MRR-system-architecture.drawio
          git commit -m '文档：修正 Draw.io 主分支认证说明'
          git push origin HEAD:chore/cleanup-main-branch-migration
