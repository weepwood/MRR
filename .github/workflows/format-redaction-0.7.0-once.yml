name: 一次性整理 0.7.0 脱敏代码格式

on:
  push:
    branches:
      - release/0.7.0
    paths:
      - .github/workflows/format-redaction-0.7.0-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/0.7.0

      - name: 整理辅助方法缩进
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path('backend-repo/src/main/java/com/zjcxph/imgapi/service/OperationsCenterService.java')
          content = path.read_text(encoding='utf-8')
          old = '''    static Map<String, Object> redactOverviewForReport(Map<String, Object> source) {
          Map<String, Object> result = new LinkedHashMap<>(source);
          Object latestOperation = source.get("latestOperation");
          if (latestOperation instanceof Map<?, ?> latestMap && !latestMap.isEmpty()) {
              Map<String, Object> normalized = new LinkedHashMap<>();
              latestMap.forEach((key, value) -> normalized.put(String.valueOf(key), value));
              result.put("latestOperation", redactOperationForReport(normalized));
          }
          return Map.copyOf(result);
          }

              static Map<String, Object> redactIntegrityForReport(Map<String, Object> source) {
          Map<String, Object> result = new LinkedHashMap<>(source);
          Object lastError = source.get("lastError");
          if (lastError != null && !String.valueOf(lastError).isBlank()) {
              result.put("lastError", "[REDACTED]");
          }
          return Map.copyOf(result);
          }
          '''.replace('\n          ', '\n')
          new = '''    static Map<String, Object> redactOverviewForReport(Map<String, Object> source) {
              Map<String, Object> result = new LinkedHashMap<>(source);
              Object latestOperation = source.get("latestOperation");
              if (latestOperation instanceof Map<?, ?> latestMap && !latestMap.isEmpty()) {
                  Map<String, Object> normalized = new LinkedHashMap<>();
                  latestMap.forEach((key, value) -> normalized.put(String.valueOf(key), value));
                  result.put("latestOperation", redactOperationForReport(normalized));
              }
              return Map.copyOf(result);
          }

              static Map<String, Object> redactIntegrityForReport(Map<String, Object> source) {
              Map<String, Object> result = new LinkedHashMap<>(source);
              Object lastError = source.get("lastError");
              if (lastError != null && !String.valueOf(lastError).isBlank()) {
                  result.put("lastError", "[REDACTED]");
              }
              return Map.copyOf(result);
          }
          '''.replace('\n          ', '\n')
          if content.count(old) != 1:
              raise RuntimeError('无法唯一匹配待格式化脱敏辅助方法')
          path.write_text(content.replace(old, new, 1), encoding='utf-8')
          PY

          git diff --check
          git rm .github/workflows/format-redaction-0.7.0-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend-repo/src/main/java/com/zjcxph/imgapi/service/OperationsCenterService.java
          git commit -m "维护：规范 0.7.0 脱敏辅助方法格式"
          git push origin release/0.7.0
