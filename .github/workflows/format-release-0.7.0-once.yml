name: 一次性整理 0.7.0 代码格式

on:
  push:
    branches:
      - release/0.7.0
    paths:
      - .github/workflows/format-release-0.7.0-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/0.7.0

      - name: 整理新增 Java 方法缩进
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          replacements = {
              Path('backend-repo/src/main/java/com/zjcxph/imgapi/config/SpaPathResourceResolver.java'): [(
                  '''    private static boolean isSameOrChild(String resourcePath, String reservedPath) {
              return resourcePath.equals(reservedPath) || resourcePath.startsWith(reservedPath + "/");
          }
          ''',
                  '''    private static boolean isSameOrChild(String resourcePath, String reservedPath) {
                  return resourcePath.equals(reservedPath) || resourcePath.startsWith(reservedPath + "/");
              }
          '''
              )],
              Path('backend-repo/src/main/java/com/zjcxph/imgapi/service/OperationsCenterService.java'): [(
                  '''    private List<Map<String, Object>> redactedRecentOperations(int limit) {
              return recentOperations(limit).stream()
            .map(OperationsCenterService::redactOperationForReport)
            .toList();
          }

              static Map<String, Object> redactOperationForReport(Map<String, Object> source) {
              Map<String, Object> result = new LinkedHashMap<>();
              for (String key : List.of("id", "request_id", "method", "response_status", "execute_time", "access_time")) {
                  if (source.containsKey(key) && source.get(key) != null) {
            result.put(key, source.get(key));
                  }
              }
              result.put("request_uri", stripQueryAndFragment(String.valueOf(source.getOrDefault("request_uri", ""))));
              result.put("username", redactIfPresent(source.get("username")));
              result.put("client_ip", redactIfPresent(source.get("client_ip")));
              result.put("error_message", redactIfPresent(source.get("error_message")));
              return Map.copyOf(result);
          }

              private static String stripQueryAndFragment(String value) {
              int query = value.indexOf('?');
              int fragment = value.indexOf('#');
              int end = value.length();
              if (query >= 0) {
                  end = Math.min(end, query);
              }
              if (fragment >= 0) {
                  end = Math.min(end, fragment);
              }
              return value.substring(0, end);
          }

              private static String redactIfPresent(Object value) {
              return value == null || String.valueOf(value).isBlank() ? "" : "[REDACTED]";
          }
          ''',
                  '''    private List<Map<String, Object>> redactedRecentOperations(int limit) {
                  return recentOperations(limit).stream()
                          .map(OperationsCenterService::redactOperationForReport)
                          .toList();
              }

              static Map<String, Object> redactOperationForReport(Map<String, Object> source) {
                  Map<String, Object> result = new LinkedHashMap<>();
                  for (String key : List.of("id", "request_id", "method", "response_status", "execute_time", "access_time")) {
                      if (source.containsKey(key) && source.get(key) != null) {
                          result.put(key, source.get(key));
                      }
                  }
                  result.put("request_uri", stripQueryAndFragment(String.valueOf(source.getOrDefault("request_uri", ""))));
                  result.put("username", redactIfPresent(source.get("username")));
                  result.put("client_ip", redactIfPresent(source.get("client_ip")));
                  result.put("error_message", redactIfPresent(source.get("error_message")));
                  return Map.copyOf(result);
              }

              private static String stripQueryAndFragment(String value) {
                  int query = value.indexOf('?');
                  int fragment = value.indexOf('#');
                  int end = value.length();
                  if (query >= 0) {
                      end = Math.min(end, query);
                  }
                  if (fragment >= 0) {
                      end = Math.min(end, fragment);
                  }
                  return value.substring(0, end);
              }

              private static String redactIfPresent(Object value) {
                  return value == null || String.valueOf(value).isBlank() ? "" : "[REDACTED]";
              }
          '''
              )]
          }

          for path, pairs in replacements.items():
              content = path.read_text(encoding='utf-8')
              for old, new in pairs:
                  if content.count(old) != 1:
                      raise RuntimeError(f'无法唯一匹配待格式化代码：{path}')
                  content = content.replace(old, new, 1)
              path.write_text(content, encoding='utf-8')
          PY

          git diff --check
          git rm .github/workflows/format-release-0.7.0-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend-repo/src/main/java/com/zjcxph/imgapi/config/SpaPathResourceResolver.java \
            backend-repo/src/main/java/com/zjcxph/imgapi/service/OperationsCenterService.java
          git commit -m "维护：规范 0.7.0 审查修复代码格式"
          git push origin release/0.7.0
