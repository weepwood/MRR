name: frontend-mock

on:
  # Optional supplementary mock-backed check. The required quality gate already
  # runs frontend type, unit, build, and scoped E2E checks for pull requests.
  workflow_dispatch:
    inputs:
      cross_browser:
        description: Run only the optional Firefox and WebKit qualification matrix
        type: boolean
        default: false
      shard_probe:
        description: Run only two full Chromium shards for an optional comparison (takes precedence over cross_browser)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: frontend-mock-${{ github.workflow }}-${{ github.ref }}-${{ inputs.cross_browser }}-${{ inputs.shard_probe }}
  cancel-in-progress: true

jobs:
  standalone-frontend:
    if: inputs.cross_browser != true && inputs.shard_probe != true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend-fantastic-admin
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: frontend-fantastic-admin/.node-version
          cache: pnpm
          cache-dependency-path: frontend-fantastic-admin/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm lint:tsc

      - name: Unit tests
        id: unit-tests
        continue-on-error: true
        run: |
          set +e
          pnpm test:run 2>&1 | tee vitest.log
          test_status=${PIPESTATUS[0]}
          echo "exit_code=${test_status}" >> "$GITHUB_OUTPUT"
          exit "${test_status}"

      - name: Upload failed unit test log
        if: steps.unit-tests.outcome == 'failure'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: vitest-log-${{ github.run_id }}
          path: frontend-fantastic-admin/vitest.log
          if-no-files-found: warn
          retention-days: 7

      - name: Build mock application
        run: pnpm build:mock

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end tests without backend
        id: e2e-tests
        continue-on-error: true
        timeout-minutes: 15
        run: pnpm test:e2e

      - name: Upload failed Playwright diagnostics
        if: steps.e2e-tests.outcome == 'failure'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: playwright-diagnostics-${{ github.run_id }}
          path: |
            frontend-fantastic-admin/test-results
            frontend-fantastic-admin/playwright-report
          if-no-files-found: warn
          retention-days: 7

      - name: Preserve unit test failure
        if: always() && steps.unit-tests.outcome == 'failure'
        run: |
          echo "::error::Unit tests failed with exit code ${{ steps.unit-tests.outputs.exit_code }}. See the uploaded Vitest log artifact."
          exit 1

      - name: Preserve E2E failure
        if: always() && steps.e2e-tests.outcome == 'failure'
        run: |
          echo "::error::End-to-end tests failed. See the uploaded Playwright diagnostics artifact."
          exit 1

  cross-browser:
    if: inputs.cross_browser == true && inputs.shard_probe != true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend-fantastic-admin
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend-fantastic-admin/.node-version
          cache: pnpm
          cache-dependency-path: frontend-fantastic-admin/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Install locked Playwright engines
        run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Firefox and WebKit candidate qualification
        run: pnpm exec playwright test --config=playwright.cross-browser.config.ts --project=firefox --project=webkit
      - name: Preserve cross-browser test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cross-browser-results-${{ github.run_id }}
          path: frontend-fantastic-admin/test-results-cross-browser/e2e-junit.xml
          retention-days: 1
          if-no-files-found: warn
      - name: Preserve failed cross-browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: cross-browser-failure-${{ github.run_id }}
          path: |
            frontend-fantastic-admin/test-results-cross-browser
            frontend-fantastic-admin/playwright-cross-browser-report
          retention-days: 1
          if-no-files-found: warn


  chromium-shard-probe:
    if: inputs.shard_probe == true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    defaults:
      run:
        working-directory: frontend-fantastic-admin
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend-fantastic-admin/.node-version
          cache: pnpm
          cache-dependency-path: frontend-fantastic-admin/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Read Playwright version
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "${GITHUB_OUTPUT}"
      - uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-chromium-${{ steps.playwright.outputs.version }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: |
          pnpm exec playwright install-deps chromium
          pnpm exec playwright install chromium
      - name: Full Chromium shard
        timeout-minutes: 40
        env:
          SHARD: ${{ matrix.shard }}
        run: pnpm exec playwright test --project=chromium --workers=2 --shard="${SHARD}/2"
      - name: Preserve shard test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: chromium-shard-${{ matrix.shard }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            frontend-fantastic-admin/test-results/e2e-junit.xml
            frontend-fantastic-admin/test-results/e2e-results.json
          if-no-files-found: warn
          retention-days: 3
      - name: Preserve failed shard diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: chromium-shard-failure-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: frontend-fantastic-admin/test-results
          if-no-files-found: ignore
          retention-days: 2
