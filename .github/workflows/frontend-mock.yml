name: frontend-mock

on:
  pull_request:
    branches:
      - dev-no-login
    paths:
      - 'frontend-fantastic-admin/**'
      - '.github/workflows/frontend-mock.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-mock-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  standalone-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend-fantastic-admin
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend-fantastic-admin/.node-version
          cache: pnpm
          cache-dependency-path: frontend-fantastic-admin/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm lint:tsc

      - name: Unit tests
        run: pnpm test:run

      - name: Build mock application
        run: pnpm build:mock

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end tests without backend
        run: pnpm test:e2e
