name: frontend-mock

on:
  pull_request:
    branches:
      - dev-no-login
    paths:
      - 'frontend-fantastic-admin/**'
      - '.github/workflows/frontend-mock.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: frontend-mock-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  standalone-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend-fantastic-admin
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Apply plaintext ID route compatibility
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/views/statistics/archive.vue')
          content = path.read_text(encoding='utf-8')
          old = '''async function syncIdCardSearchFromRoute(token: string, bah: string, sjh: string) {
            searchIdCard.value = ''
            if (idCardToken.value !== token || !archiveCases.value.length) {
              const result = await loadArchiveCasesByToken(token)
              if (!result) {
                clearArchiveState(errorMsg.value || '身份证查询链接无效')
                return
              }
            }

            const selectedCase = archiveCases.value.find(item => caseMatches(item, bah, sjh))
              || archiveCases.value[0]
            if (!selectedCase) {
              clearArchiveState(errorMsg.value || '未查询到该患者的影像病案')
              return
            }

            const selectedBah = normalizeSearchParam(selectedCase.bah)
            const selectedSjh = normalizeSearchParam(selectedCase.sjh)
            if (selectedBah !== bah || selectedSjh !== sjh) {
              await router.replace({
                path: '/archive',
                query: {
                  id: token,
                  bah: selectedBah,
                  ...(selectedSjh ? { sjh: selectedSjh } : {}),
                },
              })
              return
            }

            await loadSelectedArchiveCase(selectedCase)
          }'''
          new = '''async function syncIdCardSearchFromRoute(idParam: string, bah: string, sjh: string) {
            searchIdCard.value = ''
            const isPlainIdCard = ID_CARD_PATTERN.test(idParam)
            if (idCardToken.value !== idParam || !archiveCases.value.length) {
              const result = isPlainIdCard
                ? await loadArchiveCasesByIdCard(idParam)
                : await loadArchiveCasesByToken(idParam)
              if (!result) {
                clearArchiveState(errorMsg.value || '身份证查询链接无效')
                return
              }
            }

            const resolvedToken = idCardToken.value || (isPlainIdCard ? '' : idParam)
            if (!resolvedToken) {
              clearArchiveState('身份证查询链接生成失败')
              return
            }

            const selectedCase = archiveCases.value.find(item => caseMatches(item, bah, sjh))
              || archiveCases.value[0]
            if (!selectedCase) {
              clearArchiveState(errorMsg.value || '未查询到该患者的影像病案')
              return
            }

            const selectedBah = normalizeSearchParam(selectedCase.bah)
            const selectedSjh = normalizeSearchParam(selectedCase.sjh)
            if (resolvedToken !== idParam || selectedBah !== bah || selectedSjh !== sjh) {
              await router.replace({
                path: '/archive',
                query: {
                  id: resolvedToken,
                  bah: selectedBah,
                  ...(selectedSjh ? { sjh: selectedSjh } : {}),
                },
              })
              return
            }

            await loadSelectedArchiveCase(selectedCase)
          }'''
          old = '\n'.join(line[10:] if line.startswith('          ') else line for line in old.splitlines())
          new = '\n'.join(line[10:] if line.startswith('          ') else line for line in new.splitlines())
          if old not in content:
              raise SystemExit('target syncIdCardSearchFromRoute block not found')
          path.write_text(content.replace(old, new, 1), encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/views/statistics/archive.vue
          git commit -m "feat(archive): accept plaintext ID query and replace with token"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend-fantastic-admin/.node-version
          cache: pnpm
          cache-dependency-path: frontend-fantastic-admin/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm lint:tsc

      - name: Unit tests
        id: unit-tests
        continue-on-error: true
        run: |
          set +e
          pnpm test:run 2>&1 | tee vitest.log
          test_status=${PIPESTATUS[0]}
          echo "exit_code=${test_status}" >> "$GITHUB_OUTPUT"
          exit "${test_status}"

      - name: Upload failed unit test log
        if: steps.unit-tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: vitest-log-${{ github.run_id }}
          path: frontend-fantastic-admin/vitest.log
          if-no-files-found: warn
          retention-days: 7

      - name: Build mock application
        run: pnpm build:mock

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end tests without backend
        run: pnpm test:e2e

      - name: Preserve unit test failure
        if: always() && steps.unit-tests.outcome == 'failure'
        run: |
          echo "::error::Unit tests failed with exit code ${{ steps.unit-tests.outputs.exit_code }}. See the uploaded Vitest log artifact."
          exit 1
