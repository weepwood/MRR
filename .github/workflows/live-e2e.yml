name: Live browser integration

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend-fantastic-admin/.node-version
          cache: pnpm
          cache-dependency-path: frontend-fantastic-admin/pnpm-lock.yaml
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Package backend (unit and integration checks run in Quality gate)
        run: mvn -B -ntp -f backend-repo/pom.xml package -DskipTests -Dlocal.config.exclude=true
      - name: Install browser test dependencies
        working-directory: frontend-fantastic-admin
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      - name: Real login, import, query and permission refusal on PostgreSQL 16
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(find backend-repo/target -maxdepth 1 -name '*.jar' ! -name '*.original' | head -n 1)"
          test -n "${JAR}"
          python scripts/run_live_e2e.py --jar "${JAR}"
