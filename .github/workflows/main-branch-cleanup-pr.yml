name: main-branch-cleanup-pr

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/main-branch-cleanup-pr.yml'

permissions:
  contents: write

jobs:
  cleanup:
    if: github.head_ref == 'chore/cleanup-main-branch-migration'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Execute embedded cleanup script
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/main-branch-cleanup-once.yml').read_text(encoding='utf-8')
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n"
          script = workflow.split(start_marker, 1)[1].split(end_marker, 1)[0]
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in script.splitlines())
          script = script.replace(
              "subprocess.run(['python', 'scripts/check_main_branch_references.py'], check=True)",
              "print('防回归脚本将在独立步骤中重写并验证。')",
          )
          exec(compile(script, 'main-branch-cleanup-once.yml', 'exec'))
          PY

      - name: Write branch reference checker
        shell: bash
        run: |
          cat > scripts/check_main_branch_references.py <<'PY'
          #!/usr/bin/env python3
          from __future__ import annotations

          from pathlib import Path

          ACTIVE_PATHS = (
              '.github/workflows/quality-gate.yml',
              '.github/workflows/backend-normalization-check.yml',
              '.github/workflows/frontend-mock.yml',
              '.github/workflows/monitoring-validation.yml',
              '.github/workflows/windows-release-package.yml',
              'README.md',
              'CONTRIBUTING.md',
              'CLAUDE.md',
              'AGENTS.md',
              'vitepress-doc/internal/index.md',
              'vitepress-doc/internal/development.md',
              'vitepress-doc/getting-started/installation.md',
              'vitepress-doc/user-guide/index.md',
              'vitepress-doc/architecture/mrr-system-architecture.md',
          )

          FORBIDDEN = 'dev-no-login'


          def find_forbidden_references(
              root: Path,
              paths: tuple[str, ...] = ACTIVE_PATHS,
          ) -> list[str]:
              violations: list[str] = []
              for relative_path in paths:
                  path = root / relative_path
                  if not path.is_file():
                      violations.append(f'{relative_path}: 文件不存在')
                      continue
                  for line_number, line in enumerate(
                      path.read_text(encoding='utf-8').splitlines(),
                      start=1,
                  ):
                      if FORBIDDEN in line:
                          violations.append(f'{relative_path}:{line_number}: {line.strip()}')
              return violations


          def main() -> int:
              violations = find_forbidden_references(Path(__file__).resolve().parents[1])
              if violations:
                  print('发现活跃 dev-no-login 残留：')
                  print('\n'.join(violations))
                  return 1
              print('main 分支活跃引用检查通过。')
              return 0


          if __name__ == '__main__':
              raise SystemExit(main())
          PY

          cat > scripts/tests/test_check_main_branch_references.py <<'PY'
          import tempfile
          import unittest
          from pathlib import Path

          from scripts.check_main_branch_references import find_forbidden_references


          class MainBranchReferenceCheckTest(unittest.TestCase):
              def test_reports_active_legacy_branch_reference(self):
                  with tempfile.TemporaryDirectory() as directory:
                      root = Path(directory)
                      path = root / 'README.md'
                      path.write_text('git checkout dev-no-login\n', encoding='utf-8')

                      self.assertEqual(
                          find_forbidden_references(root, ('README.md',)),
                          ['README.md:1: git checkout dev-no-login'],
                      )

              def test_accepts_main_branch_reference(self):
                  with tempfile.TemporaryDirectory() as directory:
                      root = Path(directory)
                      path = root / 'README.md'
                      path.write_text('git switch main\n', encoding='utf-8')

                      self.assertEqual(find_forbidden_references(root, ('README.md',)), [])


          if __name__ == '__main__':
              unittest.main()
          PY

      - name: Validate cleanup
        run: |
          python -m unittest scripts.tests.test_check_main_branch_references -v
          python scripts/check_main_branch_references.py
          git diff --check

      - name: Commit non-workflow cleanup
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            AGENTS.md \
            CLAUDE.md \
            CONTRIBUTING.md \
            README.md \
            backend-repo/docs/architecture-foundation-phase-1.md \
            scripts/check_main_branch_references.py \
            scripts/tests/test_check_main_branch_references.py \
            vitepress-doc/architecture/MRR-system-architecture-overview.svg \
            vitepress-doc/architecture/mrr-system-architecture.md \
            vitepress-doc/getting-started/installation.md \
            vitepress-doc/internal/development.md \
            vitepress-doc/internal/index.md \
            vitepress-doc/scripts/generate-git-changelog.test.mjs \
            vitepress-doc/user-guide/changelog.md \
            vitepress-doc/user-guide/index.md \
            vitepress-doc/user-guide/release-notes.md
          git commit -m '维护：更新 main 分支开发与认证说明'
          git push origin HEAD:chore/cleanup-main-branch-migration
