name: metric-card-pr-runner

on:
  pull_request:
    branches:
      - dev-no-login

permissions:
  contents: write

jobs:
  apply-metric-card-system:
    if: github.head_ref == 'style/unify-metric-cards-20260713' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: style/unify-metric-cards-20260713
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend-fantastic-admin/.node-version
          cache: pnpm
          cache-dependency-path: frontend-fantastic-admin/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend-fantastic-admin
        run: pnpm install --frozen-lockfile

      - name: Execute metric card migration
        run: |
          python - <<'PYRUNNER'
          from pathlib import Path
          import subprocess
          import traceback

          try:
              source = Path('.github/workflows/metric-card-system-autofix.yml').read_text(encoding='utf-8')
              marker = "          python - <<'PY'\n"
              start = source.index(marker) + len(marker)
              end = source.index('\n          PY', start)
              lines = source[start:end].splitlines()
              script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines)

              response_start = script.index('# 7. Response analysis')
              response_end = script.index('# 8. Audit analytics', response_start)
              response_patch = r"""# 7. Response analysis
          path, text = load('src/views/response-analysis/index.vue')
          new = '''      <section class="mrr-metric-grid" aria-label="响应指标总览">
                <el-card shadow="never" class="mrr-metric-card">
                  <div class="mrr-metric-card__icon"><i class="i-ant-design:api-twotone" /></div>
                  <div class="mrr-metric-card__body">
                    <span class="mrr-metric-card__label">总请求数</span>
                    <strong class="mrr-metric-card__value">{{ formatNumber(analysis?.overview.totalRequests) }}</strong>
                    <p class="mrr-metric-card__note">所选时间范围内完成的请求</p>
                  </div>
                </el-card>
                <el-card shadow="never" class="mrr-metric-card mrr-metric-card--green">
                  <div class="mrr-metric-card__icon"><i class="i-ant-design:check-circle-twotone" /></div>
                  <div class="mrr-metric-card__body">
                    <span class="mrr-metric-card__label">HTTP 成功率</span>
                    <strong class="mrr-metric-card__value">{{ formatPercent(analysis?.overview.successRate) }}</strong>
                    <p class="mrr-metric-card__note">HTTP 2xx 响应占全部请求的比例</p>
                  </div>
                </el-card>
                <el-card shadow="never" class="mrr-metric-card mrr-metric-card--violet">
                  <div class="mrr-metric-card__icon"><i class="i-ant-design:field-time-outlined" /></div>
                  <div class="mrr-metric-card__body">
                    <span class="mrr-metric-card__label">客户端 P95</span>
                    <strong class="mrr-metric-card__value">{{ formatDuration(analysis?.overview.p95ClientDurationMs) }}</strong>
                    <p class="mrr-metric-card__note">包含网络与浏览器处理耗时</p>
                  </div>
                </el-card>
                <el-card shadow="never" class="mrr-metric-card mrr-metric-card--amber">
                  <div class="mrr-metric-card__icon"><i class="i-ant-design:dashboard-twotone" /></div>
                  <div class="mrr-metric-card__body">
                    <span class="mrr-metric-card__label">服务端平均耗时</span>
                    <strong class="mrr-metric-card__value">{{ formatDuration(analysis?.overview.avgServerDurationMs) }}</strong>
                    <p class="mrr-metric-card__note">服务端请求处理平均值</p>
                  </div>
                </el-card>
              </section>'''
          text = regex_once(
              text,
              r'      <section class="summary-grid" aria-label="响应指标总览">.*?      </section>',
              new,
              'response analysis summary template',
          )
          text = regex_once(text, r'\n\.summary-grid \{.*?(?=\n\.analysis-card \{)', '\n', 'response analysis local metric styles')
          text = re.sub(r'\n\s*\.summary-grid \{\n\s*grid-template-columns:[^\n]+;\n\s*\}\n', '\n', text)
          save(path, text)

          """
              script = script[:response_start] + response_patch + script[response_end:]
              exec(compile(script, 'metric-card-migration.py', 'exec'))
          except Exception:
              Path('.github/metric-card-error.log').write_text(traceback.format_exc(), encoding='utf-8')
              subprocess.run(['git', 'config', 'user.name', 'github-actions[bot]'], check=True)
              subprocess.run(['git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'], check=True)
              subprocess.run(['git', 'add', '.github/metric-card-error.log'], check=True)
              subprocess.run(['git', 'commit', '-m', 'chore: capture metric card migration error'], check=True)
              subprocess.run(['git', 'push', 'origin', 'style/unify-metric-cards-20260713'], check=True)
              raise
          PYRUNNER

      - name: Apply repository lint rules
        working-directory: frontend-fantastic-admin
        run: |
          status=0
          log="../.github/metric-card-lint.log"
          : > "$log"
          echo "=== ESLint ===" >> "$log"
          pnpm exec eslint \
            src/views/records-statistics/index.vue \
            src/views/statistics/index.vue \
            src/views/statistics-detail/index.vue \
            src/views/oss-migration/index.vue \
            src/views/monitoring/index.vue \
            src/views/response-analysis/index.vue \
            src/views/audit-images/components/AuditAnalytics.vue \
            --fix >> "$log" 2>&1 || status=1
          echo "=== Stylelint ===" >> "$log"
          pnpm exec stylelint \
            src/assets/styles/globals.css \
            src/views/records-statistics/index.vue \
            src/views/statistics/index.vue \
            src/views/statistics-detail/index.vue \
            src/views/oss-migration/index.vue \
            src/views/monitoring/index.vue \
            src/views/response-analysis/index.vue \
            src/views/audit-images/components/AuditAnalytics.vue \
            --fix >> "$log" 2>&1 || status=1
          echo "=== Vue Type Check ===" >> "$log"
          pnpm exec vue-tsc -b >> "$log" 2>&1 || status=1
          if [ "$status" -ne 0 ]; then
            cd ..
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add .github/metric-card-lint.log
            git commit -m "chore: capture metric card lint diagnostics"
            git push origin style/unify-metric-cards-20260713
            exit 1
          fi

      - name: Commit design system migration
        run: |
          rm .github/workflows/metric-card-system-autofix.yml
          rm .github/workflows/metric-card-pr-runner.yml
          rm -f .github/metric-card-error.log .github/metric-card-lint.log
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            frontend-fantastic-admin/DESIGN.md \
            frontend-fantastic-admin/src/assets/styles/globals.css \
            frontend-fantastic-admin/src/views/records-statistics/index.vue \
            frontend-fantastic-admin/src/views/statistics/index.vue \
            frontend-fantastic-admin/src/views/statistics-detail/index.vue \
            frontend-fantastic-admin/src/views/oss-migration/index.vue \
            frontend-fantastic-admin/src/views/monitoring/index.vue \
            frontend-fantastic-admin/src/views/response-analysis/index.vue \
            frontend-fantastic-admin/src/views/audit-images/components/AuditAnalytics.vue \
            .github/workflows/metric-card-system-autofix.yml \
            .github/workflows/metric-card-pr-runner.yml \
            .github/metric-card-error.log \
            .github/metric-card-lint.log
          git commit -m "style(design): unify business metric cards"
          git push origin style/unify-metric-cards-20260713
