name: monitoring-validation

on:
  pull_request:
    branches:
      - main
    paths:
      - 'monitoring/**'
      - '.github/workflows/monitoring-validation.yml'

permissions:
  contents: read

concurrency:
  group: monitoring-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  monitoring-config:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Validate Prometheus configuration
        run: |
          docker run --rm \
            -v "$PWD/monitoring/prometheus:/etc/prometheus:ro" \
            --entrypoint promtool \
            prom/prometheus:v3.5.0 \
            check config /etc/prometheus/prometheus.yml
      - name: Validate Alertmanager configuration
        run: |
          docker run --rm \
            -v "$PWD/monitoring/alertmanager:/etc/alertmanager:ro" \
            --entrypoint amtool \
            prom/alertmanager:v0.28.1 \
            check-config /etc/alertmanager/alertmanager.yml
      - name: Validate Grafana dashboard JSON
        run: |
          for dashboard in monitoring/grafana/dashboards/*.json; do
            python -m json.tool "$dashboard" >/dev/null
          done
