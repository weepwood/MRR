name: 一次性清理旧分支

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-time-delete-stale-branches.yml

permissions:
  contents: write
  pull-requests: read

jobs:
  delete-stale-branches:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 删除已合并、已替代和旧工程分支
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail

          declare -A preserved=()
          declare -A open_pr_branches=()
          declare -A merged_pr_branches=()
          declare -A obsolete=()

          preserved[main]=1
          preserved[gh-pages]=1
          preserved[feat/archive-image-classification-phase1-20260716]=1
          preserved[feat/menu-visibility-settings-20260719]=1
          preserved[feat/observability-operations]=1
          preserved[feat/design-principles-20260717]=1

          obsolete[backup/issue-96-before-main-sync]=1
          obsolete[dev-aotu]=1
          obsolete[dev-bac]=1
          obsolete[dev-doc]=1
          obsolete[dev-f]=1
          obsolete[dev-no-login]=1
          obsolete[feat/archive-box-csv-import-20260717]=1
          obsolete[feat/data-exchange-center-20260716]=1
          obsolete[fix/oss-migration-reliability-20260715]=1
          obsolete[automation/release-v0.5.0-pr]=1
          obsolete[fix/archive-return-button-20260720]=1
          obsolete[revert-118-fix/issue-117-auth-storage-healing]=1
          obsolete[fix/chrome-109-compatibility]=1
          obsolete[refactor/unify-medical-record-types-20260716]=1
          obsolete[feat/art-design-shell-20260713]=1
          obsolete[feat/medical-design-system]=1
          obsolete[codex/implement-registration-for-frontend-and-backend]=1
          obsolete[codex/archive-search-url-sync]=1

          while IFS= read -r branch; do
            [[ -n "$branch" ]] && open_pr_branches["$branch"]=1
          done < <(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls?state=open&per_page=100" \
              --jq '.[].head.ref' | sort -u
          )

          while IFS= read -r branch; do
            [[ -n "$branch" ]] && merged_pr_branches["$branch"]=1
          done < <(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls?state=closed&per_page=100" \
              --jq '.[] | select(.merged_at != null) | .head.ref' | sort -u
          )

          mapfile -t remote_branches < <(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/branches?per_page=100" \
              --jq '.[].name' | sort -u
          )

          deleted=()
          skipped_preserved=()
          skipped_open=()
          retained=()
          failed=()

          for branch in "${remote_branches[@]}"; do
            if [[ -n "${preserved[$branch]:-}" ]]; then
              skipped_preserved+=("$branch")
              continue
            fi
            if [[ -n "${open_pr_branches[$branch]:-}" ]]; then
              skipped_open+=("$branch")
              continue
            fi
            if [[ -z "${merged_pr_branches[$branch]:-}" && -z "${obsolete[$branch]:-}" ]]; then
              retained+=("$branch")
              continue
            fi

            echo "删除分支：$branch"
            if gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}" >/dev/null; then
              deleted+=("$branch")
            else
              echo "删除失败：$branch" >&2
              failed+=("$branch")
            fi
          done

          print_group() {
            local title="$1"
            shift
            echo ""
            echo "## ${title}（$#）"
            if (($# == 0)); then
              echo "- 无"
            else
              printf -- '- %s\n' "$@"
            fi
          }

          {
            echo "# MRR 远程分支清理报告"
            print_group "已删除" "${deleted[@]}"
            print_group "强制保留" "${skipped_preserved[@]}"
            print_group "因开放 PR 保留" "${skipped_open[@]}"
            print_group "未满足删除条件而保留" "${retained[@]}"
            print_group "删除失败" "${failed[@]}"
          } | tee "$GITHUB_STEP_SUMMARY"

          echo "删除完成：${#deleted[@]} 个；失败：${#failed[@]} 个。"
          if ((${#failed[@]} > 0)); then
            exit 1
          fi
