name: oss-pr-backend-fix

on:
  push:
    branches:
      - feat/oss-migration-management-20260722

permissions:
  contents: write

jobs:
  backend-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/oss-migration-management-20260722
      - name: Apply mapper and test fixes
        shell: python
        run: |
          from pathlib import Path

          log_mapper = Path('backend-repo/src/main/resources/mapper/LogMapper.xml')
          text = log_mapper.read_text(encoding='utf-8')
          old = '''    <select id="getTopImageAuditUsers" resultType="com.zjcxph.imgapi.dto.resp.ImageAuditCountDTO">
                  SELECT username AS "label", COUNT(*) AS "count"
                  FROM access_log
                  <where><include refid="imageAuditFilters"/> AND NULLIF(TRIM(username), '') IS NOT NULL</where>
                  GROUP BY username
                  ORDER BY COUNT(*) DESC, username ASC
                  LIMIT 10
              </select>'''
          new = old.replace('LIMIT 10', 'LIMIT 5')
          if old not in text:
              raise SystemExit('Expected top users mapper fragment not found')
          log_mapper.write_text(text.replace(old, new, 1), encoding='utf-8')

          scan_test = Path('backend-repo/src/test/java/com/zjcxph/imgapi/integration/mapper/ScanMapperPostgresqlIT.java')
          text = scan_test.read_text(encoding='utf-8')
          old = '@MybatisTest(properties = "mybatis.mapper-locations=classpath*:mapper/*.xml")'
          new = '''@MybatisTest(properties = {
                  "mybatis.configuration.map-underscore-to-camel-case=true",
                  "mybatis.mapper-locations=classpath*:mapper/*.xml"
          })'''
          if old not in text:
              raise SystemExit('Expected ScanMapper test annotation not found')
          scan_test.write_text(text.replace(old, new, 1), encoding='utf-8')
      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend-repo/src/main/resources/mapper/LogMapper.xml backend-repo/src/test/java/com/zjcxph/imgapi/integration/mapper/ScanMapperPostgresqlIT.java
          git commit -m "fix(测试): 修复审计排行与扫描映射验证"
          git push origin HEAD:feat/oss-migration-management-20260722
