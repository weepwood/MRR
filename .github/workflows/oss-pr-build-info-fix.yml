name: oss-pr-build-info-fix

on:
  push:
    branches:
      - feat/oss-migration-management-20260722

permissions:
  contents: write

jobs:
  build-info-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/oss-migration-management-20260722

      - name: Fix Spring Boot build info execution
        shell: python
        run: |
          from pathlib import Path

          path = Path('backend-repo/pom.xml')
          text = path.read_text(encoding='utf-8')
          old = '''                    <execution>
                        <id>build-info</id>
                        <goals>
                            <goal>build-info</goal>
                        </goals>
                    </execution>'''
          new = '''                    <execution>
                        <id>generate-build-info</id>
                        <phase>generate-resources</phase>
                        <goals>
                            <goal>build-info</goal>
                        </goals>
                        <configuration>
                            <outputFile>${project.build.outputDirectory}/META-INF/build-info.properties</outputFile>
                        </configuration>
                    </execution>'''
          if old not in text:
              raise SystemExit('Expected Spring Boot build-info execution not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend-repo/pom.xml
          git commit -m "fix(构建): 确保后端生成构建身份信息"
          git push origin HEAD:feat/oss-migration-management-20260722
