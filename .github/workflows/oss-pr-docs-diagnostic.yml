name: oss-pr-docs-diagnostic

on:
  pull_request:
    branches:
      - dev-no-login
    paths:
      - vitepress-doc/**
      - VERSION
      - .github/workflows/oss-pr-docs-diagnostic.yml

permissions:
  contents: read

jobs:
  docs-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: vitepress-doc
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: vitepress-doc/package-lock.json

      - name: Capture documentation checks
        id: checks
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MRR_CHANGELOG_GITHUB: 'true'
          MRR_CHANGELOG_BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set +e
          : > docs-diagnostic.txt
          npm ci >> docs-diagnostic.txt 2>&1
          install_status=$?
          npm run docs:changelog:test >> docs-diagnostic.txt 2>&1
          changelog_status=$?
          npm run docs:build >> docs-diagnostic.txt 2>&1
          build_status=$?
          PRODUCT_VERSION="$(tr -d '\r\n' < ../VERSION)"
          grep -R --fixed-strings "v${PRODUCT_VERSION}" .vitepress/dist-user >> docs-diagnostic.txt 2>&1
          user_version_status=$?
          grep -R --fixed-strings "v${PRODUCT_VERSION}" .vitepress/dist-internal >> docs-diagnostic.txt 2>&1
          internal_version_status=$?
          {
            echo
            echo "install_status=${install_status}"
            echo "changelog_status=${changelog_status}"
            echo "build_status=${build_status}"
            echo "user_version_status=${user_version_status}"
            echo "internal_version_status=${internal_version_status}"
          } >> docs-diagnostic.txt
          exit 0

      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: oss-pr-docs-diagnostic
          path: vitepress-doc/docs-diagnostic.txt
          if-no-files-found: error
          retention-days: 1
