name: oss-pr-lint-diagnostic

on:
  pull_request:
    branches:
      - dev-no-login
    paths:
      - frontend-fantastic-admin/src/api/modules/oss.ts
      - frontend-fantastic-admin/src/api/types.ts
      - frontend-fantastic-admin/src/mock/oss-migration.ts
      - frontend-fantastic-admin/src/views/oss-migration/index.vue
      - .github/workflows/oss-pr-lint-diagnostic.yml

permissions:
  contents: read

jobs:
  lint-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend-fantastic-admin
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend-fantastic-admin/.node-version
          cache: pnpm
          cache-dependency-path: frontend-fantastic-admin/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Capture lint output
        id: lint
        shell: bash
        run: |
          set +e
          pnpm exec eslint \
            src/api/modules/oss.ts \
            src/api/types.ts \
            src/mock/oss-migration.ts \
            src/views/oss-migration/index.vue \
            > lint-output.txt 2>&1
          eslint_status=$?
          pnpm exec stylelint src/views/oss-migration/index.vue \
            >> lint-output.txt 2>&1
          stylelint_status=$?
          echo "eslint_status=${eslint_status}" >> "$GITHUB_OUTPUT"
          echo "stylelint_status=${stylelint_status}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload lint output
        uses: actions/upload-artifact@v4
        with:
          name: oss-pr-lint-output
          path: frontend-fantastic-admin/lint-output.txt
          if-no-files-found: error
          retention-days: 1

      - name: Preserve lint result
        shell: bash
        run: |
          if [[ "${{ steps.lint.outputs.eslint_status }}" != "0" || "${{ steps.lint.outputs.stylelint_status }}" != "0" ]]; then
            exit 1
          fi
