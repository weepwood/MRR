name: oss-pr-style-fix

on:
  push:
    branches:
      - feat/oss-migration-management-20260722

permissions:
  contents: write

jobs:
  style-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/oss-migration-management-20260722
      - name: Fix final property order
        shell: python
        run: |
          from pathlib import Path
          path = Path('frontend-fantastic-admin/src/views/oss-migration/index.vue')
          text = path.read_text(encoding='utf-8')
          old = '''.eyebrow {
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--el-color-primary);
            letter-spacing: 0.12em;
          }'''
          new = '''.eyebrow {
            font-size: 12px;
            font-weight: 700;
            color: var(--el-color-primary);
            text-transform: uppercase;
            letter-spacing: 0.12em;
          }'''
          if old not in text:
              raise SystemExit('Expected .eyebrow style fragment not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend-fantastic-admin/src/views/oss-migration/index.vue
          git commit -m "fix(OSS迁移): 修复最后一个样式排序错误"
          git push origin HEAD:feat/oss-migration-management-20260722
