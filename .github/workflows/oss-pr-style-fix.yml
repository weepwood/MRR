name: oss-pr-style-fix

on:
  push:
    branches:
      - feat/oss-migration-management-20260722

permissions:
  contents: write

jobs:
  style-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/oss-migration-management-20260722

      - name: Apply remaining style fixes
        shell: python
        run: |
          from pathlib import Path

          path = Path('frontend-fantastic-admin/src/views/oss-migration/index.vue')
          text = path.read_text(encoding='utf-8')
          replacements = {
              '''.eyebrow {
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: var(--el-color-primary);
          }''': '''.eyebrow {
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--el-color-primary);
            letter-spacing: 0.12em;
          }''',
              '''.check-item {
            display: flex;
            align-items: center;
            gap: 12px;
            justify-content: space-between;
            padding: 14px;
            background: var(--el-color-warning-light-9);
            border: 1px solid var(--el-color-warning-light-5);
            border-radius: var(--el-border-radius-base);
          }''': '''.check-item {
            display: flex;
            gap: 12px;
            align-items: center;
            justify-content: space-between;
            padding: 14px;
            background: var(--el-color-warning-light-9);
            border: 1px solid var(--el-color-warning-light-5);
            border-radius: var(--el-border-radius-base);
          }''',
          }

          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Expected style fragment not found:\n{old}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')

      - name: Commit style fixes
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend-fantastic-admin/src/views/oss-migration/index.vue
          git commit -m "fix(OSS迁移): 完成迁移控制台样式排序修复"
          git push origin HEAD:feat/oss-migration-management-20260722
