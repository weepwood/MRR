name: oss-pr-style-fix

on:
  push:
    branches:
      - feat/oss-migration-management-20260722

permissions:
  contents: write

jobs:
  style-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/oss-migration-management-20260722

      - name: Apply deterministic style fixes
        shell: python
        run: |
          from pathlib import Path

          path = Path('frontend-fantastic-admin/src/views/oss-migration/index.vue')
          text = path.read_text(encoding='utf-8')
          replacements = {
              '''.page-header,
          .card-header {
            justify-content: space-between;
            gap: 16px;
          }''': '''.page-header,
          .card-header {
            gap: 16px;
            justify-content: space-between;
          }''',
              '''.eyebrow {
            color: var(--el-color-primary);
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
          }''': '''.eyebrow {
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: var(--el-color-primary);
          }''',
              '''.metric-card {
            display: grid;
            gap: 8px;
            padding: 18px;
            border: 1px solid var(--el-border-color-lighter);
            border-radius: var(--el-border-radius-base);
            background: var(--el-bg-color);
          }''': '''.metric-card {
            display: grid;
            gap: 8px;
            padding: 18px;
            background: var(--el-bg-color);
            border: 1px solid var(--el-border-color-lighter);
            border-radius: var(--el-border-radius-base);
          }''',
              '''.check-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 14px;
            border: 1px solid var(--el-color-warning-light-5);
            border-radius: var(--el-border-radius-base);
            background: var(--el-color-warning-light-9);
          }''': '''.check-item {
            display: flex;
            align-items: center;
            gap: 12px;
            justify-content: space-between;
            padding: 14px;
            background: var(--el-color-warning-light-9);
            border: 1px solid var(--el-color-warning-light-5);
            border-radius: var(--el-border-radius-base);
          }''',
              '''.check-item.ok {
            border-color: var(--el-color-success-light-5);
            background: var(--el-color-success-light-9);
          }''': '''.check-item.ok {
            background: var(--el-color-success-light-9);
            border-color: var(--el-color-success-light-5);
          }''',
              '''.warning-list {
            display: grid;
            gap: 6px;
            margin: 14px 0 0;
            padding-left: 20px;
            color: var(--el-color-warning-dark-2);
          }''': '''.warning-list {
            display: grid;
            gap: 6px;
            padding-left: 20px;
            margin: 14px 0 0;
            color: var(--el-color-warning-dark-2);
          }''',
              '''.manual-bah {
            justify-content: flex-end;
            margin-top: 14px;
            padding-top: 14px;
            border-top: 1px solid var(--el-border-color-lighter);
          }''': '''.manual-bah {
            justify-content: flex-end;
            padding-top: 14px;
            margin-top: 14px;
            border-top: 1px solid var(--el-border-color-lighter);
          }''',
              '@media (max-width: 1100px)': '@media (width <= 1100px)',
              '@media (max-width: 720px)': '@media (width <= 720px)',
              '''  .page-header,
            .card-header {
              align-items: flex-start;
              flex-direction: column;
            }''': '''  .page-header,
            .card-header {
              flex-direction: column;
              align-items: flex-start;
            }''',
          }

          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Expected style fragment not found:\n{old}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')

      - name: Commit style fixes
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend-fantastic-admin/src/views/oss-migration/index.vue
          git commit -m "fix(OSS迁移): 修复迁移控制台样式检查"
          git push origin HEAD:feat/oss-migration-management-20260722
