name: 患者管理评审修复

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: 检出分支
        uses: actions/checkout@v4
        with:
          ref: feat/patient-frontend-import-20260722
          fetch-depth: 0

      - name: 应用评审修复
        shell: bash
        run: |
          python .github/scripts/patient_review_fix.py
          rm .github/workflows/patient-review-fix.yml
          rm .github/scripts/patient_review_fix.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "修复：完善患者导入导出边界"
          git push origin HEAD:feat/patient-frontend-import-20260722
