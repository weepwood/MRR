name: patient-style-fix-once

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: patient-style-fix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fix-style:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Fix patient analytics style once
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('frontend-fantastic-admin/src/views/patients/components/PatientAnalyticsPanel.vue')
          content = path.read_text(encoding='utf-8')
          old = """  overflow: hidden;\n  text-overflow: ellipsis;\n  white-space: nowrap;\n  color: var(--el-text-color-placeholder);"""
          new = """  overflow: hidden;\n  text-overflow: ellipsis;\n  color: var(--el-text-color-placeholder);\n  white-space: nowrap;"""
          if old in content:
              path.write_text(content.replace(old, new, 1), encoding='utf-8')
          PY

          if git diff --quiet -- frontend-fantastic-admin/src/views/patients/components/PatientAnalyticsPanel.vue; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend-fantastic-admin/src/views/patients/components/PatientAnalyticsPanel.vue
          git commit -m '修复：调整患者统计文本样式顺序'
          git push origin "HEAD:${HEAD_BRANCH}"
