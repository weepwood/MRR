name: prepare-release-0.6.1-once

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/prepare-release-0.6.1-once.yml'

permissions:
  contents: write

jobs:
  prepare:
    if: github.head_ref == 'release/0.6.1'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Update version and release documents
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str) -> None:
              file = Path(path)
              content = file.read_text(encoding='utf-8')
              if old not in content:
                  raise SystemExit(f'{path}: expected content not found: {old!r}')
              file.write_text(content.replace(old, new, 1), encoding='utf-8', newline='\n')

          version_file = Path('VERSION')
          if version_file.read_text(encoding='utf-8').strip() != '0.6.0':
              raise SystemExit('VERSION is not 0.6.0')
          version_file.write_text('0.6.1\n', encoding='utf-8', newline='\n')

          replace_exact(
              'backend-repo/pom.xml',
              '<revision>0.6.0</revision>',
              '<revision>0.6.1</revision>',
          )

          baseline_path = Path('release-baseline.json')
          baseline = json.loads(baseline_path.read_text(encoding='utf-8'))
          if baseline['database']['maximumCompatibleMigration'] != '20260722110500':
              raise SystemExit('Unexpected maximum compatible migration')
          baseline['applicationRollback']['allowed'] = False
          baseline['database']['backwardCompatibleWithPreviousApplication'] = False
          baseline['applicationRollback']['reason'] = (
              '0.6.1 包含新的认证、外部影像会话和开发者兼容模式边界；'
              '尚未完成 0.6.0 应用连接升级后数据库的兼容性演练，'
              '回滚前必须恢复发布前数据库备份并重新验证。'
          )
          baseline_path.write_text(
              json.dumps(baseline, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
              newline='\n',
          )

          changelog_path = Path('CHANGELOG.md')
          changelog = changelog_path.read_text(encoding='utf-8')
          start = changelog.index('## [Unreleased]')
          end = changelog.index('## [0.1.1]')
          release_section = '''## [Unreleased]

## [0.6.1] - 2026-07-22

### 新增

- 建立根目录 `VERSION` 唯一产品版本源，后端、前端、文档和 Windows 发布包统一读取产品版本。
- 增加 `release-baseline.json`、发布清单生成和构建身份校验，明确数据库迁移兼容范围与应用回滚限制。
- 前端系统信息面板展示产品版本、Git Commit、构建时间、数据库兼容范围和配置结构版本。
- 增加 `main` 分支活跃引用检查，并解压检查 Draw.io 页面 XML，防止旧分支和错误认证说明重新进入活跃文档。

### 变更

- `main` 成为唯一正式主分支；5 个正式 GitHub Actions、贡献流程、安装文档和内部开发说明统一面向 `main`。
- 外部 Ticket 调阅复用现有影像档案袋，不再维护独立外部查看页面；外部会话每次进入都由后端 Context 验证。
- 旧影像档案袋兼容模式默认关闭，并限制为可信代理、客户端 IP/CIDR 白名单、只读接口白名单和访问审计。
- E2E 测试统一使用 Chromium，并完善真实 Mock 认证会话、匿名会话和 Chrome 109 兼容基线。
- Windows 发布工作流统一校验产品版本、源提交、后端构建身份、文档和离线包 SHA256 清单。

### 修复

- 修复外部影像会话可能从浏览器存储恢复并回退到内部查询的问题。
- 修复匿名 `/api/v1/img/{bah}` 绕过用户标识、来源 IP 和访问审计的问题。
- 修复档案访问模式不是响应式状态，导致路由复用后搜索卡片和历史记录状态过期的问题。
- 修复后端集成测试中的 MyBatis XML 装载、PostgreSQL `search_path`、测试建表和字段映射问题。
- 修复 Windows 发布身份校验对 Spring Boot 4 JAR 路径和 PR 临时合并提交的错误假设。
- 修复架构 SVG 与压缩 Draw.io 中错误的“main 绕过 JWT”说明。

### 安全

- 管理端继续使用真实 JWT、账号状态、密码版本和 RBAC 校验，不允许无条件 `dev/ADMIN` 会话进入生产逻辑。
- 开发者兼容白名单只要包含非法规则即整体失败关闭；仅病案号匿名患者查询限制为 1000 万以下业务范围。
- 外部 Session 只保存在内存并由 HttpOnly Cookie/后端 Context 决定授权范围，URL 或浏览器存储不能扩大权限。

### 发布与兼容性

- 数据库兼容范围：`20260715113552` 至 `20260722110500`。
- 配置结构版本：`1`。
- 未完成 0.6.0 应用连接升级后数据库的兼容性演练，不允许只回滚应用文件；升级前必须备份数据库和配置。

'''
          changelog = changelog[:start] + release_section + changelog[end:]
          changelog = changelog.replace(
              '[Unreleased]: https://github.com/weepwood/MRR/compare/v0.1.1...HEAD',
              '[Unreleased]: https://github.com/weepwood/MRR/compare/v0.6.1...HEAD\n'
              '[0.6.1]: https://github.com/weepwood/MRR/releases/tag/v0.6.1',
          )
          changelog_path.write_text(changelog, encoding='utf-8', newline='\n')

          notes = '''# MRR 0.6.1

发布日期：2026-07-22

## 本次发布重点

### 外部影像调阅与开发者兼容模式

- 外部系统 Ticket 调阅统一复用现有影像档案袋，减少重复页面和权限分叉。
- 外部会话由后端 Context 持续验证，浏览器存储和 URL 参数不能扩大授权范围。
- 旧档案袋兼容模式默认关闭，只允许可信代理、客户端 IP/CIDR 白名单和只读接口，并完整记录访问审计。
- 取消匿名病案详情查询绕过审计的入口，下载、PDF 导出、图片类型修改和后台管理继续要求正式权限。

### main 主分支与工程治理

- `main` 正式成为唯一主分支，Actions、贡献流程、安装文档、Agent 指令和架构图全部完成迁移。
- 增加自动检查，阻止活跃文件重新引用旧 `dev-no-login`，并检查压缩 Draw.io 中隐藏的错误认证说明。
- GitHub Actions 已覆盖后端完整 `verify`、前端 TypeScript/Lint/Vitest/Chromium E2E、监控配置、文档和 Windows 离线包。

### 发布可靠性

- 发布包统一包含后端 JAR、前端、用户/内部文档、Windows 运维脚本、`manifest.json`、`release-baseline.json` 和 `SHA256SUMS`。
- 后端、前端和文档都写入同一产品版本与 Git Commit，Windows 工作流会验证构建身份。

## 数据库与回滚

- 最低兼容迁移：`20260715113552`。
- 最高兼容迁移：`20260722110500`。
- 配置结构版本：`1`。
- 本版本不允许只替换回 0.6.0 应用文件。升级前必须备份数据库与配置；需要回滚时先恢复发布前数据库备份并重新验证。

## 升级后核对

1. 检查 `/actuator/info` 中的版本和 Git Commit。
2. 检查前端系统信息面板、用户手册和内部文档均显示 `v0.6.1`。
3. 校验发布包内 `SHA256SUMS` 和 `manifest.json`。
4. 验证登录、权限、病案查询、影像访问、外部 Ticket、审计、系统设置和状态页。
'''
          Path('release-notes/0.6.1.md').write_text(notes, encoding='utf-8', newline='\n')
          PY

      - name: Validate release baseline
        run: |
          python scripts/release_baseline.py validate
          python scripts/check_main_branch_references.py

      - name: Commit release preparation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add VERSION backend-repo/pom.xml release-baseline.json CHANGELOG.md release-notes/0.6.1.md
          git commit -m '发布：准备 0.6.1 版本'
          git push origin HEAD:release/0.6.1
