name: 一次性发布 MRR 0.7.0

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-0.7.0-once.yml

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RELEASE_VERSION: 0.7.0
      RELEASE_TAG: v0.7.0
      RELEASE_SHA: d1e54a7c1770042496a6d553a38cb91d046d8265
      SOURCE_RUN_ID: '29995383338'
      SOURCE_ARTIFACT: MRR-v0.7.0-d1e54a7c.zip
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Validate release identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(tr -d '\r\n' < VERSION)" = "$RELEASE_VERSION"
          test -f "release-notes/${RELEASE_VERSION}.md"
          git merge-base --is-ancestor "$RELEASE_SHA" HEAD
          if git ls-remote --exit-code --tags origin "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "标签 ${RELEASE_TAG} 已存在" >&2
            exit 1
          fi
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release ${RELEASE_TAG} 已存在" >&2
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Download tested Windows artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p release-artifact
          gh run download "$SOURCE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$SOURCE_ARTIFACT" \
            --dir release-artifact
          mapfile -t packages < <(find release-artifact -type f -name "MRR-v${RELEASE_VERSION}.zip" -print)
          if [ "${#packages[@]}" -ne 1 ]; then
            echo "应找到一个正式发布包，实际为 ${#packages[@]} 个" >&2
            find release-artifact -maxdepth 3 -type f -print >&2
            exit 1
          fi
          printf '%s\n' "${packages[0]}" > /tmp/release-package-path

      - name: Verify manifest and embedded frontend
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE="$(cat /tmp/release-package-path)"
          python3 - "$PACKAGE" "$RELEASE_VERSION" "$RELEASE_SHA" <<'PY'
          import json
          import sys
          import tempfile
          from pathlib import Path
          from zipfile import ZipFile

          package = Path(sys.argv[1])
          version = sys.argv[2]
          expected_sha = sys.argv[3]

          with ZipFile(package) as archive:
              names = archive.namelist()
              manifest_names = [name for name in names if name == 'manifest.json' or name.endswith('/manifest.json')]
              version_names = [name for name in names if name == 'VERSION' or name.endswith('/VERSION')]
              checksum_names = [name for name in names if name == 'SHA256SUMS' or name.endswith('/SHA256SUMS')]
              jar_names = [name for name in names if name.lower().endswith('.jar') and '/backend/' in f'/{name}']
              if len(manifest_names) != 1 or len(version_names) != 1 or len(checksum_names) != 1 or len(jar_names) != 1:
                  raise SystemExit(
                      f'发布包结构异常: manifest={manifest_names}, VERSION={version_names}, '
                      f'SHA256SUMS={checksum_names}, jars={jar_names}'
                  )
              manifest = json.loads(archive.read(manifest_names[0]).decode('utf-8-sig'))
              packaged_version = archive.read(version_names[0]).decode('utf-8-sig').strip()
              if manifest.get('productVersion') != version or packaged_version != version:
                  raise SystemExit(f'版本不一致: manifest={manifest.get("productVersion")}, VERSION={packaged_version}')
              if manifest.get('gitCommit') != expected_sha:
                  raise SystemExit(f'构建提交不一致: {manifest.get("gitCommit")} != {expected_sha}')
              with tempfile.TemporaryDirectory() as temp_dir:
                  jar_path = Path(temp_dir) / 'mrr.jar'
                  with archive.open(jar_names[0]) as source, jar_path.open('wb') as target:
                      while chunk := source.read(1024 * 1024):
                          target.write(chunk)
                  with ZipFile(jar_path) as jar:
                      jar_entries = jar.namelist()
                      index_name = 'BOOT-INF/classes/static/index.html'
                      asset_prefix = 'BOOT-INF/classes/static/assets/'
                      if jar_entries.count(index_name) != 1:
                          raise SystemExit('后端 JAR 未包含唯一的内嵌前端 index.html')
                      if not any(name.startswith(asset_prefix) and not name.endswith('/') for name in jar_entries):
                          raise SystemExit('后端 JAR 未包含内嵌前端 assets')

          print(f'Validated {package.name}: version={version}, commit={expected_sha}')
          PY

      - name: Remove one-time workflow from main
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/publish-0.7.0-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "发布：清理 0.7.0 一次性发布任务"
          git push origin main

      - name: Create tag and GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PACKAGE="$(cat /tmp/release-package-path)"
          git tag -a "$RELEASE_TAG" "$RELEASE_SHA" -m "MRR ${RELEASE_VERSION}"
          git push origin "refs/tags/${RELEASE_TAG}"
          gh release create "$RELEASE_TAG" "$PACKAGE#MRR-v${RELEASE_VERSION}.zip" \
            --repo "$GITHUB_REPOSITORY" \
            --title "MRR ${RELEASE_VERSION}" \
            --notes-file "release-notes/${RELEASE_VERSION}.md" \
            --verify-tag

      - name: Verify published Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json tagName,name,isDraft,isPrerelease,targetCommitish,assets \
            --jq '
              if .tagName != env.RELEASE_TAG then error("tag mismatch")
              elif .name != ("MRR " + env.RELEASE_VERSION) then error("name mismatch")
              elif .isDraft or .isPrerelease then error("release is draft or prerelease")
              elif ([.assets[].name] | index("MRR-v" + env.RELEASE_VERSION + ".zip")) == null then error("asset missing")
              else . end'
