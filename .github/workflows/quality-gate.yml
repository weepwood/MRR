name: quality-gate

on:
  pull_request:
  push:
    branches:
      - dev-no-login
      - main
      - master

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend-fantastic-admin
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend-fantastic-admin/.node-version
          cache: pnpm
          cache-dependency-path: frontend-fantastic-admin/pnpm-lock.yaml

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Type Check
        run: pnpm lint:tsc

      - name: Lint Changed Files
        id: lint
        continue-on-error: true
        env:
          LINT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          LINT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/lint-changed.mjs 2>&1 | tee lint-output.txt

      - name: Upload lint diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-lint-output
          path: frontend-fantastic-admin/lint-output.txt
          if-no-files-found: ignore

      - name: Fail on lint errors
        if: steps.lint.outcome == 'failure'
        run: exit 1

      - name: Build
        id: build
        continue-on-error: true
        run: pnpm build 2>&1 | tee build-output.txt

      - name: Collect build size report
        if: always()
        run: |
          {
            echo
            echo "=== dist total ==="
            du -sh dist 2>/dev/null || true
            echo
            echo "=== largest uncompressed assets ==="
            find dist/assets -maxdepth 1 -type f ! -name '*.gz' ! -name '*.br' -printf '%s %f\n' 2>/dev/null | sort -nr | head -30 || true
          } >> build-output.txt

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-build-output
          path: frontend-fantastic-admin/build-output.txt
          if-no-files-found: ignore

      - name: Fail on build errors
        if: steps.build.outcome == 'failure'
        run: exit 1

      - name: Validate Nginx configuration
        run: docker run --rm --add-host backend:127.0.0.1 -v "$PWD/nginx.conf:/etc/nginx/conf.d/default.conf:ro" nginx:1.27-alpine nginx -t

      - name: Test
        run: pnpm test:run

  backend-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend-repo
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Test
        run: mvn -B -ntp test

      - name: Package
        run: mvn -B -ntp -DskipTests package
