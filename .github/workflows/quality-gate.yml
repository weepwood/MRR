name: quality-gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: quality-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      frontend: ${{ steps.scope.outputs.frontend }}
      backend: ${{ steps.scope.outputs.backend }}
      integration: ${{ steps.scope.outputs.integration }}
      build: ${{ steps.scope.outputs.build }}
      postgres: ${{ steps.scope.outputs.postgres }}
      live: ${{ steps.scope.outputs.live }}
      windows: ${{ steps.scope.outputs.windows }}
      recovery: ${{ steps.scope.outputs.recovery }}
      release: ${{ steps.scope.outputs.release }}
      development: ${{ steps.scope.outputs.development }}
      integration_frontend: ${{ steps.scope.outputs.integration_frontend }}
      base: ${{ steps.scope.outputs.base }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Read last successful main quality gate
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/quality-gate.yml/runs?branch=main&event=push&status=success&per_page=20" > main-runs.json
      - name: Select checks once for the complete change
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = pull_request ]; then
            python -m scripts.ci_gate scope --mode pr --base "${BASE_SHA}" --output "${GITHUB_OUTPUT}"
          elif [ "${GITHUB_EVENT_NAME}" = push ]; then
            python -m scripts.ci_gate scope --mode main --runs main-runs.json --output "${GITHUB_OUTPUT}"
          else
            # Explicit manual checks must not inherit a lightweight main-push baseline.
            python -m scripts.ci_gate scope --mode integration --output "${GITHUB_OUTPUT}"
          fi
      - name: Repository invariants
        run: |
          python scripts/release_baseline.py validate
          python scripts/test_inventory.py --fail-on-focused
          python scripts/check_main_branch_references.py
          python scripts/check_engineering_docs.py
          python -c "from pathlib import Path; from scripts.engineering_preflight import configuration_problems; p=configuration_problems(Path('.')); print('\n'.join(p)); raise SystemExit(bool(p))"
      - name: Validate external archive integration and proxy documentation
        # Security-sensitive proxy examples must be checked even for documentation-only PRs.
        # Uses Node's built-in test runner; no package install is required.
        run: node --test vitepress-doc/scripts/external-archive-integration.test.mjs

      - name: Test CI and repository tooling when affected
        if: steps.scope.outputs.tooling == 'true'
        run: python -m unittest discover -s scripts/tests -p 'test_*.py' -v

  frontend:
    needs: scope
    if: needs.scope.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend-fantastic-admin
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend-fantastic-admin/.node-version
          cache: pnpm
          cache-dependency-path: frontend-fantastic-admin/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Lint changed sources
        env:
          LINT_BASE_SHA: ${{ needs.scope.outputs.base }}
          LINT_HEAD_SHA: ${{ github.sha }}
        run: node scripts/lint-changed.mjs
      - name: Type check and unit tests without coverage collection
        # 类型检查与单测互不依赖，同时运行以缩短关键路径；两者任一失败都会使本步骤失败。
        shell: bash
        run: |
          set +e
          tsc_log="${RUNNER_TEMP}/vue-tsc.log"
          pnpm lint:tsc > "${tsc_log}" 2>&1 &
          tsc_pid=$!
          pnpm test:run
          test_status=$?
          wait "${tsc_pid}"
          tsc_status=$?
          echo "::group::Type check output (vue-tsc)"
          cat "${tsc_log}"
          echo "::endgroup::"
          if [ "${tsc_status}" -ne 0 ]; then echo "::error::Type check failed with exit code ${tsc_status}."; fi
          if [ "${test_status}" -ne 0 ]; then echo "::error::Unit tests failed with exit code ${test_status}."; fi
          [ "${tsc_status}" -eq 0 ] && [ "${test_status}" -eq 0 ]
      - name: Production build and Chrome 86 compatibility
        if: needs.scope.outputs.build == 'true'
        run: |
          pnpm build
          pnpm test:compat:chrome86

  backend:
    needs: scope
    if: needs.scope.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: ${{ needs.scope.outputs.postgres == 'true' && 'postgres:16-alpine' || '' }}
        env:
          POSTGRES_DB: imgapi
          POSTGRES_USER: imgapi
          POSTGRES_PASSWORD: imgapi
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U imgapi -d imgapi"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      MRR_TEST_POSTGRES_URL: jdbc:postgresql://localhost:5432/imgapi
      MRR_TEST_POSTGRES_USERNAME: imgapi
      MRR_TEST_POSTGRES_PASSWORD: imgapi
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # PR 与 main 集成不比较覆盖率（只在完整发布验收中阻断回退），这里关闭 JaCoCo 插桩以节省时间。
      - name: Unit tests
        if: needs.scope.outputs.postgres != 'true'
        run: bash backend-repo/mvnw -B -ntp -f backend-repo/pom.xml test -Dlocal.config.exclude=true -Djacoco.skip=true
      - name: Unit and actual PostgreSQL tests
        if: needs.scope.outputs.postgres == 'true'
        run: |
          bash backend-repo/mvnw -B -ntp -f backend-repo/pom.xml verify -Dlocal.config.exclude=true -Djacoco.skip=true
          python scripts/check_test_execution.py --reports backend-repo/target/failsafe-reports
      - name: Package compiled classes for selected real checks
        if: needs.scope.outputs.postgres != 'true' && needs.scope.outputs.recovery == 'true'
        run: bash backend-repo/mvnw -B -ntp -f backend-repo/pom.xml package -DskipTests -Dlocal.config.exclude=true -Djacoco.skip=true
      - name: Share the same backend JAR
        if: needs.scope.outputs.recovery == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: backend-${{ github.run_id }}-${{ github.sha }}
          path: backend-repo/target/*.jar
          retention-days: 1
          if-no-files-found: error
      - name: Failed test diagnostics
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: backend-failure-${{ github.run_id }}
          path: |
            backend-repo/target/surefire-reports
            backend-repo/target/failsafe-reports
          retention-days: 3
          if-no-files-found: ignore

  integration:
    needs: scope
    if: needs.scope.outputs.integration == 'true'
    uses: ./.github/workflows/windows-release-package.yml
    with:
      full: false
      # PRs keep database/build checks but defer browser flows to main/release.
      live_checks: ${{ github.event_name != 'pull_request' }}
      # 只改后端的 PR 不使用嵌入前端的 JAR，跳过未改动前端的重复检查与构建。
      frontend_checks: ${{ github.event_name != 'pull_request' || needs.scope.outputs.integration_frontend == 'true' }}

  windows:
    needs: scope
    if: needs.scope.outputs.windows == 'true'
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m unittest scripts.tests.test_windows_one_click_manager -v
      - run: python -m unittest scripts.tests.test_dev -v
      - name: Parse development entry with PowerShell 5.1
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'scripts/dev.ps1'), [ref]$tokens, [ref]$errors)
          if ($errors.Count) { throw 'Development entry has PowerShell syntax errors.' }
      - name: Parse deployment scripts with PowerShell 5.1
        shell: powershell
        run: |
          $failed = $false
          Get-ChildItem deploy/windows -Filter *.ps1 -Recurse | ForEach-Object {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) { $failed = $true; Write-Error "PowerShell syntax error: $($_.Name)" }
          }
          if ($failed) { exit 1 }
          .\deploy\windows\mrr-manager.ps1 -SelfTest -Root $PWD

  recovery:
    needs: [scope, backend]
    if: needs.scope.outputs.recovery == 'true'
    uses: ./.github/workflows/windows-database-recovery.yml
    with:
      backend_artifact: backend-${{ github.run_id }}-${{ github.sha }}

  release:
    needs: scope
    if: needs.scope.outputs.release == 'true'
    uses: ./.github/workflows/release-validation.yml

  development:
    needs: scope
    if: needs.scope.outputs.development == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Build clean development images and verify startup and refusal
        run: python -m scripts.smoke_dev

  pr-gate:
    needs: [scope, frontend, backend, integration, windows, recovery, release, development]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Reject failed, cancelled, missing or unexpectedly skipped checks
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          printf '%s' "${NEEDS_JSON}" > needs.json
          python -m scripts.ci_gate check needs.json
