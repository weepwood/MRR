name: quality-gate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - 'v*'
      - '*.*.*'

permissions:
  contents: write

concurrency:
  group: quality-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare-release-0-6-2:
    if: github.event_name == 'pull_request' && github.head_ref == 'release/0.6.2'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Prepare 0.6.2 release files
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          version = Path('VERSION').read_text(encoding='utf-8').strip()
          if version != '0.6.2':
              raise SystemExit(f'Unexpected VERSION: {version}')

          pom_path = Path('backend-repo/pom.xml')
          pom = pom_path.read_text(encoding='utf-8')
          old_revision = '<revision>0.6.1</revision>'
          new_revision = '<revision>0.6.2</revision>'
          if new_revision not in pom:
              if old_revision not in pom:
                  raise SystemExit('Maven revision is neither 0.6.1 nor 0.6.2')
              pom = pom.replace(old_revision, new_revision, 1)
              pom_path.write_text(pom, encoding='utf-8', newline='\n')

          baseline_path = Path('release-baseline.json')
          baseline = json.loads(baseline_path.read_text(encoding='utf-8'))
          baseline['applicationRollback']['allowed'] = False
          baseline['database']['backwardCompatibleWithPreviousApplication'] = False
          baseline['applicationRollback']['reason'] = (
              '0.6.2 调整 Windows 离线包运行时、Nginx 服务注册和运维控制脚本；'
              '尚未完成 0.6.1 应用连接升级后环境的完整回滚演练，'
              '回滚前必须恢复发布前数据库与配置备份并重新验证。'
          )
          baseline_path.write_text(
              json.dumps(baseline, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
              newline='\n',
          )

          changelog_path = Path('CHANGELOG.md')
          changelog = changelog_path.read_text(encoding='utf-8')
          if '## [0.6.2] - 2026-07-22' not in changelog:
              marker = '## [Unreleased]\n'
              if marker not in changelog:
                  raise SystemExit('CHANGELOG Unreleased marker not found')
              section = '''## [Unreleased]

## [0.6.2] - 2026-07-22

### 新增

- Windows 离线包内置 Nginx for Windows `1.31.3` 与 WinSW `2.12.0`，无需在内网服务器额外下载。
- 新增 `nginxctl.ps1`，支持 `status/start/stop/restart/reload/test/pause/resume`。
- 新增可双击运行并自动请求管理员权限的 `nginx-control.cmd` 中文控制菜单。
- 发布包增加 `runtime/versions.json` 与独立运行时 `SHA256SUMS`。

### 变更

- `install.ps1` 默认读取发布包内运行时，并继续允许显式覆盖 Nginx 与 WinSW 路径。
- 安装时根据 `-Root` 自动生成 Nginx 配置并注册 `MRR-Gateway` Windows 服务。
- `pause` 统一表示 503 维护模式，Nginx 与后端进程保持运行；`resume` 平滑恢复流量。
- Windows 发布工作流固定下载运行时版本，并将其纳入顶层发布包 SHA-256 清单。

### 修复

- 修复安装脚本依赖外部 Nginx/WinSW 路径，导致离线部署步骤不完整的问题。
- 修复发布包直接解压到目标根目录且使用 `-Force` 时可能删除源 Nginx 运行时的问题。
- 修复 Nginx 启停、重载、配置检查和维护模式缺少独立可视化入口的问题。

### 安全与完整性

- 安装前逐项验证包内 Nginx、WinSW、许可和版本文件的 SHA-256。
- 校验清单中的路径必须位于运行时目录内，路径越界、文件缺失或摘要不一致时拒绝安装。

### 发布与兼容性

- 数据库兼容范围保持 `20260715113552` 至 `20260722110500`，本版本不新增 Flyway 迁移。
- 配置结构版本保持 `1`。
- 未完成 0.6.1 应用连接升级后环境的完整回滚演练，不允许只替换回旧应用文件。

'''
              changelog = changelog.replace(marker, section, 1)
              changelog = changelog.replace(
                  '[Unreleased]: https://github.com/weepwood/MRR/compare/v0.6.1...HEAD',
                  '[Unreleased]: https://github.com/weepwood/MRR/compare/v0.6.2...HEAD\n'
                  '[0.6.2]: https://github.com/weepwood/MRR/compare/v0.6.1...v0.6.2',
                  1,
              )
              changelog_path.write_text(changelog, encoding='utf-8', newline='\n')

          notes = '''# MRR 0.6.2

发布日期：2026-07-22

## 发布重点

### Windows 离线包内置 Nginx

- 正式安装包包含 Nginx for Windows 1.31.3 和 WinSW 2.12.0。
- 内网服务器只需要预装 PostgreSQL 16 与 JDK 21，不再单独准备 Nginx 和 WinSW。
- 包内包含运行时版本来源、许可文件和两级 SHA-256 校验清单。

### Nginx 控制中心

安装后可双击：

```text
C:\\MRR\\ops\\nginx-control.cmd
```

也可使用 PowerShell：

```powershell
$nginx = 'C:\\MRR\\ops\\nginxctl.ps1'
& $nginx status
& $nginx start
& $nginx stop
& $nginx restart
& $nginx test
& $nginx reload
& $nginx pause
& $nginx resume
```

`pause` 不会挂起进程，而是开启 503 维护模式；`resume` 会在配置检查通过后恢复访问。

## 首次安装

```powershell
.\\deploy\\windows\\install.ps1 `
  -Root C:\\MRR `
  -JavaHome 'C:\\Program Files\\Java\\jdk-21'
```

安装脚本会验证包内运行时、生成 Nginx 配置、安装 `MRR-Backend` 与 `MRR-Gateway` 服务，并执行 `nginx -t`。

## 数据库与回滚

- 最低兼容迁移：`20260715113552`。
- 最高兼容迁移：`20260722110500`。
- 本版本不新增数据库迁移。
- 配置结构版本：`1`。
- 不允许仅替换回 0.6.1 应用文件；回滚前必须恢复发布前数据库与配置备份并重新验证。

## 升级后核对

1. 运行 `C:\\MRR\\ops\\nginx-control.cmd` 检查 Nginx 状态和配置。
2. 检查 `C:\\MRR\\runtime\\versions.json` 中的运行时版本。
3. 校验发布包顶层 `SHA256SUMS` 和 `runtime\\SHA256SUMS`。
4. 验证登录、病案查询、影像访问、外部 Ticket、审计、维护模式和恢复访问。
'''
          notes_path = Path('release-notes/0.6.2.md')
          notes_path.parent.mkdir(parents=True, exist_ok=True)
          notes_path.write_text(notes, encoding='utf-8', newline='\n')
          PY

      - name: Validate release files
        run: |
          python scripts/release_baseline.py validate
          python scripts/check_main_branch_references.py
          python -m unittest scripts.tests.test_windows_bundled_nginx -v

      - name: Commit release preparation
        shell: bash
        run: |
          if git diff --quiet -- backend-repo/pom.xml release-baseline.json CHANGELOG.md release-notes/0.6.2.md; then
            echo 'Release files already committed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend-repo/pom.xml release-baseline.json CHANGELOG.md release-notes/0.6.2.md
          git commit -m '发布：准备 0.6.2 版本'
          git push origin HEAD:release/0.6.2

  release-baseline-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test release baseline tooling
        run: python -m unittest discover -s scripts/tests -p 'test_*.py' -v

      - name: Validate repository release baseline
        run: python scripts/release_baseline.py validate

      - name: Validate main branch references
        run: python scripts/check_main_branch_references.py

  frontend-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend-fantastic-admin
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend-fantastic-admin/.node-version
          cache: pnpm
          cache-dependency-path: frontend-fantastic-admin/pnpm-lock.yaml

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Type Check
        run: pnpm lint:tsc

      - name: Lint Changed Files
        env:
          LINT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          LINT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -o pipefail
          node scripts/lint-changed.mjs 2>&1 | tee lint-changed.log

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-lint-report
          path: frontend-fantastic-admin/lint-changed.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Build
        run: pnpm build

      - name: Unit Test
        run: pnpm test:run

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-End Test
        timeout-minutes: 15
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend-fantastic-admin/playwright-report
            frontend-fantastic-admin/test-results
          if-no-files-found: ignore
          retention-days: 7

  backend-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend-repo
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Docker
        run: docker info

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Unit and integration tests
        run: mvn -B -ntp verify

      - name: Upload backend test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            backend-repo/target/surefire-reports
            backend-repo/target/failsafe-reports
            backend-repo/target/site/jacoco
          if-no-files-found: ignore
          retention-days: 7
