name: quality-gate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - 'v*'
      - '*.*.*'

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-baseline-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test release baseline tooling
        run: python -m unittest discover -s scripts/tests -p 'test_*.py' -v

      - name: Validate repository release baseline
        run: python scripts/release_baseline.py validate

      - name: Validate main branch references
        run: python scripts/check_main_branch_references.py

  windows-management-gate:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate script encoding contract
        run: python -m unittest scripts.tests.test_windows_one_click_manager -v

      - name: Parse scripts with Windows PowerShell 5.1
        shell: powershell
        run: |
          $failed = $false
          Get-ChildItem deploy/windows -Filter *.ps1 -Recurse | ForEach-Object {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              $failed = $true
              Write-Error "Windows PowerShell 5.1 syntax error in $($_.FullName): $($errors -join '; ')"
            }
          }
          if ($failed) { exit 1 }

      - name: Run manager self-test with Windows PowerShell 5.1
        shell: powershell
        run: .\deploy\windows\mrr-manager.ps1 -SelfTest -Root $PWD

      - name: Run CMD launcher self-test
        shell: powershell
        run: |
          $root = $PWD.Path
          & .\deploy\windows\MRR-Manager.cmd -SelfTest -Root $root
          if ($LASTEXITCODE -ne 0) { throw 'CMD 管理入口自检失败。' }

  frontend-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend-fantastic-admin
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend-fantastic-admin/.node-version
          cache: pnpm
          cache-dependency-path: frontend-fantastic-admin/pnpm-lock.yaml

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Type Check
        run: pnpm lint:tsc

      - name: Lint Changed Files
        env:
          LINT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          LINT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -o pipefail
          node scripts/lint-changed.mjs 2>&1 | tee lint-changed.log

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-lint-report
          path: frontend-fantastic-admin/lint-changed.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Build
        run: pnpm build

      - name: Unit Test
        run: pnpm test:run

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-End Test
        timeout-minutes: 15
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend-fantastic-admin/playwright-report
            frontend-fantastic-admin/test-results
          if-no-files-found: ignore
          retention-days: 7

  backend-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend-repo
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Docker
        run: docker info

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Unit and integration tests
        run: mvn -B -ntp verify

      - name: Upload backend test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            backend-repo/target/surefire-reports
            backend-repo/target/failsafe-reports
            backend-repo/target/site/jacoco
          if-no-files-found: ignore
          retention-days: 7
