name: quality-gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: quality-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      frontend: ${{ steps.scope.outputs.frontend }}
      backend: ${{ steps.scope.outputs.backend }}
      integration: ${{ steps.scope.outputs.integration }}
      build: ${{ steps.scope.outputs.build }}
      e2e: ${{ steps.scope.outputs.e2e }}
      postgres: ${{ steps.scope.outputs.postgres }}
      live: ${{ steps.scope.outputs.live }}
      windows: ${{ steps.scope.outputs.windows }}
      recovery: ${{ steps.scope.outputs.recovery }}
      release: ${{ steps.scope.outputs.release }}
      base: ${{ steps.scope.outputs.base }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Read last successful main integration
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/quality-gate.yml/runs?branch=main&event=push&status=success&per_page=20" > main-runs.json
      - name: Select checks once for the complete change
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = pull_request ]; then
            python -m scripts.ci_gate scope --mode pr --base "${BASE_SHA}" --output "${GITHUB_OUTPUT}"
          else
            python -m scripts.ci_gate scope --mode integration --runs main-runs.json --output "${GITHUB_OUTPUT}"
          fi
      - name: Repository invariants
        run: |
          python scripts/release_baseline.py validate
          python scripts/test_inventory.py --fail-on-focused
          python scripts/check_main_branch_references.py
      - name: Test CI and repository tooling when affected
        if: steps.scope.outputs.tooling == 'true'
        run: python -m unittest discover -s scripts/tests -p 'test_*.py' -v

  frontend:
    needs: scope
    if: needs.scope.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend-fantastic-admin
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend-fantastic-admin/.node-version
          cache: pnpm
          cache-dependency-path: frontend-fantastic-admin/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint:tsc
      - name: Lint changed sources
        env:
          LINT_BASE_SHA: ${{ needs.scope.outputs.base }}
          LINT_HEAD_SHA: ${{ github.sha }}
        run: node scripts/lint-changed.mjs
      - name: Unit tests without coverage collection
        run: pnpm test:run
      - name: Production build and Chrome 86 compatibility
        if: needs.scope.outputs.build == 'true'
        run: |
          pnpm build
          pnpm test:compat:chrome86
      - name: Browser tests only for critical flows or browser test changes
        if: needs.scope.outputs.e2e == 'true'
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm test:e2e

  backend:
    needs: scope
    if: needs.scope.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: ${{ needs.scope.outputs.postgres == 'true' && 'postgres:16-alpine' || '' }}
        env:
          POSTGRES_DB: imgapi
          POSTGRES_USER: imgapi
          POSTGRES_PASSWORD: imgapi
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U imgapi -d imgapi"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      MRR_TEST_POSTGRES_URL: jdbc:postgresql://localhost:5432/imgapi
      MRR_TEST_POSTGRES_USERNAME: imgapi
      MRR_TEST_POSTGRES_PASSWORD: imgapi
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Unit tests
        if: needs.scope.outputs.postgres != 'true'
        run: bash backend-repo/mvnw -B -ntp -f backend-repo/pom.xml test -Dlocal.config.exclude=true
      - name: Unit and actual PostgreSQL tests
        if: needs.scope.outputs.postgres == 'true'
        run: |
          bash backend-repo/mvnw -B -ntp -f backend-repo/pom.xml verify -Dlocal.config.exclude=true
          python scripts/check_test_execution.py --reports backend-repo/target/failsafe-reports
      - name: Package compiled classes for selected real checks
        if: needs.scope.outputs.postgres != 'true' && needs.scope.outputs.recovery == 'true'
        run: bash backend-repo/mvnw -B -ntp -f backend-repo/pom.xml package -DskipTests -Dlocal.config.exclude=true
      - name: Share the same backend JAR
        if: needs.scope.outputs.recovery == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: backend-${{ github.run_id }}-${{ github.sha }}
          path: backend-repo/target/*.jar
          retention-days: 1
          if-no-files-found: error
      - name: Failed test diagnostics
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: backend-failure-${{ github.run_id }}
          path: |
            backend-repo/target/surefire-reports
            backend-repo/target/failsafe-reports
          retention-days: 3
          if-no-files-found: ignore

  integration:
    needs: scope
    if: needs.scope.outputs.integration == 'true'
    uses: ./.github/workflows/windows-release-package.yml
    with:
      full: false
      browser_tests: ${{ needs.scope.outputs.e2e == 'true' }}

  windows:
    needs: scope
    if: needs.scope.outputs.windows == 'true'
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m unittest scripts.tests.test_windows_one_click_manager -v
      - name: Parse deployment scripts with PowerShell 5.1
        shell: powershell
        run: |
          $failed = $false
          Get-ChildItem deploy/windows -Filter *.ps1 -Recurse | ForEach-Object {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) { $failed = $true; Write-Error "PowerShell syntax error: $($_.Name)" }
          }
          if ($failed) { exit 1 }
          .\deploy\windows\mrr-manager.ps1 -SelfTest -Root $PWD

  recovery:
    needs: [scope, backend]
    if: needs.scope.outputs.recovery == 'true'
    uses: ./.github/workflows/windows-database-recovery.yml
    with:
      backend_artifact: backend-${{ github.run_id }}-${{ github.sha }}

  release:
    needs: scope
    if: needs.scope.outputs.release == 'true'
    uses: ./.github/workflows/release-validation.yml

  pr-gate:
    needs: [scope, frontend, backend, integration, windows, recovery, release]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Reject failed, cancelled, missing or unexpectedly skipped checks
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          printf '%s' "${NEEDS_JSON}" > needs.json
          python -m scripts.ci_gate check needs.json
