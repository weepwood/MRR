name: quality-gate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - 'v*'
      - '*.*.*'

permissions:
  contents: write

concurrency:
  group: quality-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare-release-0-6-1:
    if: github.event_name == 'pull_request' && github.head_ref == 'release/0.6.1'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Execute release preparation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/prepare-release-0.6.1-once.yml').read_text(encoding='utf-8')
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n"
          script = workflow.split(start_marker, 1)[1].split(end_marker, 1)[0]
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in script.splitlines())
          version = Path('VERSION').read_text(encoding='utf-8').strip()
          if version == '0.6.1':
              print('0.6.1 release files are already prepared.')
          elif version == '0.6.0':
              exec(compile(script, 'prepare-release-0.6.1-once.yml', 'exec'))
          else:
              raise SystemExit(f'Unexpected VERSION: {version}')
          PY

      - name: Validate prepared release
        run: |
          python scripts/release_baseline.py validate
          python scripts/check_main_branch_references.py

      - name: Commit release preparation
        shell: bash
        run: |
          if git diff --quiet -- VERSION backend-repo/pom.xml release-baseline.json CHANGELOG.md release-notes/0.6.1.md; then
            echo 'Release files already committed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add VERSION backend-repo/pom.xml release-baseline.json CHANGELOG.md release-notes/0.6.1.md
          git commit -m '发布：准备 0.6.1 版本'
          git push origin HEAD:release/0.6.1

  release-baseline-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test release baseline tooling
        run: python -m unittest discover -s scripts/tests -p 'test_*.py' -v

      - name: Validate repository release baseline
        run: python scripts/release_baseline.py validate

      - name: Validate main branch references
        run: python scripts/check_main_branch_references.py

  frontend-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend-fantastic-admin
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend-fantastic-admin/.node-version
          cache: pnpm
          cache-dependency-path: frontend-fantastic-admin/pnpm-lock.yaml

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Type Check
        run: pnpm lint:tsc

      - name: Lint Changed Files
        env:
          LINT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          LINT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -o pipefail
          node scripts/lint-changed.mjs 2>&1 | tee lint-changed.log

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-lint-report
          path: frontend-fantastic-admin/lint-changed.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Build
        run: pnpm build

      - name: Unit Test
        run: pnpm test:run

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-End Test
        timeout-minutes: 15
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend-fantastic-admin/playwright-report
            frontend-fantastic-admin/test-results
          if-no-files-found: ignore
          retention-days: 7

  backend-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend-repo
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Docker
        run: docker info

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Unit and integration tests
        run: mvn -B -ntp verify

      - name: Upload backend test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            backend-repo/target/surefire-reports
            backend-repo/target/failsafe-reports
            backend-repo/target/site/jacoco
          if-no-files-found: ignore
          retention-days: 7
