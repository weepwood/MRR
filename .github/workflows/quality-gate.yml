name: quality-gate

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  frontend-gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-fantastic-admin
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend-fantastic-admin/pnpm-lock.yaml

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test:run

  backend-gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-repo
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      - name: Test
        run: mvn -B -ntp test

      - name: Package
        run: mvn -B -ntp -DskipTests package
