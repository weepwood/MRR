name: quality-gate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - 'v*'
      - '*.*.*'

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-baseline-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test repository tooling
        run: python -m unittest discover -s scripts/tests -p 'test_*.py' -v

      - name: Generate test inventory
        run: |
          python scripts/test_inventory.py \
            --fail-on-focused \
            --output test-inventory.md \
            --github-summary "${GITHUB_STEP_SUMMARY}"

      - name: Upload test inventory
        uses: actions/upload-artifact@v4
        with:
          name: test-inventory
          path: test-inventory.md
          retention-days: 30

      - name: Validate repository release baseline
        run: python scripts/release_baseline.py validate

      - name: Validate main branch references
        run: python scripts/check_main_branch_references.py

  windows-management-gate:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate script encoding and CMD entry
        run: python -m unittest scripts.tests.test_windows_one_click_manager -v

      - name: Parse scripts with Windows PowerShell 5.1
        shell: powershell
        run: |
          $failed = $false
          Get-ChildItem deploy/windows -Filter *.ps1 -Recurse | ForEach-Object {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              $failed = $true
              Write-Error "Windows PowerShell 5.1 syntax error in $($_.FullName): $($errors -join '; ')"
            }
          }
          if ($failed) { exit 1 }

      - name: Run manager self-test with Windows PowerShell 5.1
        shell: powershell
        run: .\deploy\windows\mrr-manager.ps1 -SelfTest -Root $PWD

  frontend-scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      frontend_changed: ${{ steps.scope.outputs.frontend_changed }}
      e2e_changed: ${{ steps.scope.outputs.e2e_changed }}
      reason: ${{ steps.scope.outputs.reason }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect frontend test scope
        id: scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" != 'pull_request' ]; then
            {
              echo 'frontend_changed=true'
              echo 'e2e_changed=true'
              echo 'reason=push-or-tag'
            } >> "${GITHUB_OUTPUT}"
            echo 'Push/tag execution: run the complete frontend verification.'
            exit 0
          fi

          git diff --name-only "${BASE_SHA}" "${HEAD_SHA}" > changed-files.txt
          echo 'Changed files:'
          cat changed-files.txt
          python scripts/frontend_test_scope.py \
            --github-output "${GITHUB_OUTPUT}" \
            changed-files.txt

  frontend-tests:
    needs: frontend-scope
    if: needs.frontend-scope.outputs.frontend_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend-fantastic-admin
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend-fantastic-admin/.node-version
          cache: pnpm
          cache-dependency-path: frontend-fantastic-admin/pnpm-lock.yaml

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Type Check
        run: pnpm lint:tsc

      - name: Lint Changed Files
        env:
          LINT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          LINT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -o pipefail
          node scripts/lint-changed.mjs 2>&1 | tee lint-changed.log

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-lint-report
          path: frontend-fantastic-admin/lint-changed.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Build
        run: pnpm build

      - name: Unit Test
        run: pnpm test:run

      - name: Install Chromium
        if: needs.frontend-scope.outputs.e2e_changed == 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-End Test
        if: needs.frontend-scope.outputs.e2e_changed == 'true'
        timeout-minutes: 15
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: ${{ always() && needs.frontend-scope.outputs.e2e_changed == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend-fantastic-admin/playwright-report
            frontend-fantastic-admin/test-results
          if-no-files-found: ignore
          retention-days: 7

  frontend-gate:
    needs:
      - frontend-scope
      - frontend-tests
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate selected frontend gate
        shell: bash
        env:
          SCOPE_RESULT: ${{ needs.frontend-scope.result }}
          FRONTEND_CHANGED: ${{ needs.frontend-scope.outputs.frontend_changed }}
          E2E_CHANGED: ${{ needs.frontend-scope.outputs.e2e_changed }}
          SCOPE_REASON: ${{ needs.frontend-scope.outputs.reason }}
          TEST_RESULT: ${{ needs.frontend-tests.result }}
        run: |
          set -euo pipefail
          echo "scope=${SCOPE_RESULT} frontend=${FRONTEND_CHANGED} e2e=${E2E_CHANGED} reason=${SCOPE_REASON}"
          echo "frontend_tests=${TEST_RESULT}"

          if [ "${SCOPE_RESULT}" != 'success' ]; then
            echo 'Frontend test scope detection failed.' >&2
            exit 1
          fi

          if [ "${FRONTEND_CHANGED}" != 'true' ]; then
            echo 'No frontend-related files changed; frontend tests were intentionally skipped.'
            exit 0
          fi

          test "${TEST_RESULT}" = 'success'

  backend-scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend_changed: ${{ steps.scope.outputs.backend_changed }}
      integration_changed: ${{ steps.scope.outputs.integration_changed }}
      reason: ${{ steps.scope.outputs.reason }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect backend test scope
        id: scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" != 'pull_request' ]; then
            {
              echo 'backend_changed=true'
              echo 'integration_changed=true'
              echo 'reason=push-or-tag'
            } >> "${GITHUB_OUTPUT}"
            echo 'Push/tag execution: run the complete backend verification.'
            exit 0
          fi

          git diff --name-only "${BASE_SHA}" "${HEAD_SHA}" > changed-files.txt
          echo 'Changed files:'
          cat changed-files.txt
          python scripts/backend_test_scope.py \
            --github-output "${GITHUB_OUTPUT}" \
            changed-files.txt

  backend-unit-tests:
    needs: backend-scope
    if: >-
      needs.backend-scope.outputs.backend_changed == 'true' &&
      needs.backend-scope.outputs.integration_changed != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend-repo
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Unit tests
        run: mvn -B -ntp test

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-unit-test-reports
          path: |
            backend-repo/target/surefire-reports
            backend-repo/target/site/jacoco
          if-no-files-found: ignore
          retention-days: 7

  backend-integration-tests:
    needs: backend-scope
    if: needs.backend-scope.outputs.integration_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: imgapi
          POSTGRES_USER: imgapi
          POSTGRES_PASSWORD: imgapi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U imgapi -d imgapi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      MRR_TEST_POSTGRES_URL: jdbc:postgresql://localhost:5432/imgapi
      MRR_TEST_POSTGRES_USERNAME: imgapi
      MRR_TEST_POSTGRES_PASSWORD: imgapi
    defaults:
      run:
        working-directory: backend-repo
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Unit and PostgreSQL integration tests
        run: mvn -B -ntp verify

      - name: Upload backend test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-integration-test-reports
          path: |
            backend-repo/target/surefire-reports
            backend-repo/target/failsafe-reports
            backend-repo/target/site/jacoco
          if-no-files-found: ignore
          retention-days: 7

  backend-gate:
    needs:
      - backend-scope
      - backend-unit-tests
      - backend-integration-tests
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate selected backend gate
        shell: bash
        env:
          SCOPE_RESULT: ${{ needs.backend-scope.result }}
          BACKEND_CHANGED: ${{ needs.backend-scope.outputs.backend_changed }}
          INTEGRATION_CHANGED: ${{ needs.backend-scope.outputs.integration_changed }}
          SCOPE_REASON: ${{ needs.backend-scope.outputs.reason }}
          UNIT_RESULT: ${{ needs.backend-unit-tests.result }}
          INTEGRATION_RESULT: ${{ needs.backend-integration-tests.result }}
        run: |
          set -euo pipefail
          echo "scope=${SCOPE_RESULT} backend=${BACKEND_CHANGED} integration=${INTEGRATION_CHANGED} reason=${SCOPE_REASON}"
          echo "unit=${UNIT_RESULT} integration_job=${INTEGRATION_RESULT}"

          if [ "${SCOPE_RESULT}" != 'success' ]; then
            echo 'Backend test scope detection failed.' >&2
            exit 1
          fi

          if [ "${BACKEND_CHANGED}" != 'true' ]; then
            echo 'No backend-related files changed; backend tests were intentionally skipped.'
            exit 0
          fi

          if [ "${INTEGRATION_CHANGED}" = 'true' ]; then
            test "${INTEGRATION_RESULT}" = 'success'
            exit 0
          fi

          test "${UNIT_RESULT}" = 'success'
