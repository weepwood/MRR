name: quality-gate

on:
  pull_request:
  push:
    branches:
      - dev-no-login
      - main
      - master

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend-fantastic-admin
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend-fantastic-admin/.node-version
          cache: pnpm
          cache-dependency-path: frontend-fantastic-admin/pnpm-lock.yaml

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Type Check
        run: pnpm lint:tsc

      - name: ESLint
        id: eslint
        continue-on-error: true
        run: pnpm exec eslint . --format json --output-file eslint-report.json

      - name: Upload ESLint report
        if: steps.eslint.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: eslint-report
          path: frontend-fantastic-admin/eslint-report.json
          if-no-files-found: error

      - name: Stylelint
        id: stylelint
        continue-on-error: true
        run: pnpm exec stylelint "src/**/*.{css,scss,vue}" --formatter json > stylelint-report.json

      - name: Upload Stylelint report
        if: steps.stylelint.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: stylelint-report
          path: frontend-fantastic-admin/stylelint-report.json
          if-no-files-found: error

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test:run

      - name: Enforce lint results
        if: always()
        env:
          ESLINT_OUTCOME: ${{ steps.eslint.outcome }}
          STYLELINT_OUTCOME: ${{ steps.stylelint.outcome }}
        run: |
          if [ "$ESLINT_OUTCOME" != "success" ] || [ "$STYLELINT_OUTCOME" != "success" ]; then
            echo "Lint checks failed. Download the uploaded reports for details."
            exit 1
          fi

  backend-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend-repo
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Test
        run: mvn -B -ntp test

      - name: Package
        run: mvn -B -ntp -DskipTests package
