name: 一次性恢复 MRR 0.7.2 单体 JAR 资产

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/recover-release-0.7.2-standalone-once.yml

permissions:
  actions: write
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOURCE_RUN_ID: '30024766775'
      RELEASE_TAG: v0.7.2
      ZIP_NAME: MRR-v0.7.2.zip
      JAR_NAME: MRR-v0.7.2-standalone.jar
      SHA_NAME: MRR-v0.7.2-standalone.jar.sha256
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Download tested standalone artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p build/release-assets
          gh run download "$SOURCE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$JAR_NAME" \
            --dir build/release-assets

          test -s "build/release-assets/$JAR_NAME"
          test -s "build/release-assets/$SHA_NAME"
          (
            cd build/release-assets
            sha256sum -c "$SHA_NAME"
          )
          python scripts/build_standalone_jar.py verify \
            --jar "build/release-assets/$JAR_NAME" \
            --default-port 8002

      - name: Upload standalone assets with explicit repository
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json tagName,isDraft,isPrerelease >/dev/null
          gh release upload "$RELEASE_TAG" \
            "build/release-assets/$JAR_NAME" \
            "build/release-assets/$SHA_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

      - name: Download and verify all formal assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p build/formal-release
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir build/formal-release \
            --pattern "$ZIP_NAME" \
            --pattern "$JAR_NAME" \
            --pattern "$SHA_NAME"

          cd build/formal-release
          test -s "$ZIP_NAME"
          test -s "$JAR_NAME"
          test -s "$SHA_NAME"
          sha256sum -c "$SHA_NAME"
          unzip -t "$ZIP_NAME" >/dev/null
          cd ../..

          python scripts/build_standalone_jar.py verify \
            --jar "build/formal-release/$JAR_NAME" \
            --default-port 8002

          python3 <<'PY'
          import json
          from pathlib import Path
          from zipfile import ZipFile

          package = Path("build/formal-release/MRR-v0.7.2.zip")
          with ZipFile(package) as archive:
              names = set(archive.namelist())
              required = {"VERSION", "manifest.json", "SHA256SUMS", "backend/mrr-backend.jar"}
              missing = required - names
              if missing:
                  raise SystemExit(f"Windows ZIP missing: {sorted(missing)}")
              if archive.read("VERSION").decode("utf-8-sig").strip() != "0.7.2":
                  raise SystemExit("Windows ZIP VERSION mismatch")
              manifest = json.loads(archive.read("manifest.json").decode("utf-8-sig"))
              if manifest.get("productVersion") != "0.7.2":
                  raise SystemExit("Windows ZIP manifest version mismatch")
          PY

      - name: Cancel superseded waiting jobs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for workflow in \
            verify-release-0.7.2-once.yml \
            ensure-release-0.7.2-assets-once.yml; do
            gh run list --repo "$GITHUB_REPOSITORY" --workflow "$workflow" \
              --status in_progress --limit 10 --json databaseId --jq '.[].databaseId' \
              | while read -r run_id; do
                  test -z "$run_id" || gh run cancel "$run_id" --repo "$GITHUB_REPOSITORY" || true
                done
          done

      - name: Remove temporary release workflows
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            .github/workflows/recover-release-0.7.2-standalone-once.yml \
            .github/workflows/verify-release-0.7.2-once.yml \
            .github/workflows/ensure-release-0.7.2-assets-once.yml; do
            if [ -f "$file" ]; then
              git rm "$file"
            fi
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "发布：确认 MRR 0.7.2 正式资产并修复单体 JAR 发布"
          git push origin main
