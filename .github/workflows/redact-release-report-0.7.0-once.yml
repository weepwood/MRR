name: 一次性完善 0.7.0 诊断报告脱敏

on:
  push:
    branches:
      - release/0.7.0
    paths:
      - .github/workflows/redact-release-report-0.7.0-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/0.7.0

      - name: 修复嵌套审计与异常文本脱敏
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          service_path = Path('backend-repo/src/main/java/com/zjcxph/imgapi/service/OperationsCenterService.java')
          service = service_path.read_text(encoding='utf-8')
          service = service.replace(
              '        result.put("overview", overview());\n',
              '        result.put("overview", redactOverviewForReport(overview()));\n',
              1,
          )
          service = service.replace(
              '        result.put("integrity", integrityDiagnosticsService.getSnapshot());\n',
              '        result.put("integrity", redactIntegrityForReport(integrityDiagnosticsService.getSnapshot()));\n',
              1,
          )
          anchor = '''    static Map<String, Object> redactOperationForReport(Map<String, Object> source) {
          '''
          helpers = '''    static Map<String, Object> redactOverviewForReport(Map<String, Object> source) {
              Map<String, Object> result = new LinkedHashMap<>(source);
              Object latestOperation = source.get("latestOperation");
              if (latestOperation instanceof Map<?, ?> latestMap && !latestMap.isEmpty()) {
                  Map<String, Object> normalized = new LinkedHashMap<>();
                  latestMap.forEach((key, value) -> normalized.put(String.valueOf(key), value));
                  result.put("latestOperation", redactOperationForReport(normalized));
              }
              return Map.copyOf(result);
          }

              static Map<String, Object> redactIntegrityForReport(Map<String, Object> source) {
              Map<String, Object> result = new LinkedHashMap<>(source);
              Object lastError = source.get("lastError");
              if (lastError != null && !String.valueOf(lastError).isBlank()) {
                  result.put("lastError", "[REDACTED]");
              }
              return Map.copyOf(result);
          }

          '''.replace('\n          ', '\n')
          if service.count(anchor) != 1:
              raise RuntimeError('无法定位诊断报告脱敏方法插入点')
          service = service.replace(anchor, helpers + anchor, 1)
          service_path.write_text(service, encoding='utf-8')

          test_path = Path('backend-repo/src/test/java/com/zjcxph/imgapi/service/OperationsCenterServiceRedactionTest.java')
          test = test_path.read_text(encoding='utf-8')
          old = '''        assertThat(result.toString()).doesNotContain("3301", "secret", "administrator", "10.0.0.8");
              }
          }
          '''.replace('\n          ', '\n')
          new = '''        assertThat(result.toString()).doesNotContain("3301", "secret", "administrator", "10.0.0.8");
              }

              @Test
              void redactsNestedLatestOperationAndIntegrityError() {
                  Map<String, Object> operation = new LinkedHashMap<>();
                  operation.put("username", "administrator");
                  operation.put("client_ip", "10.0.0.8");
                  operation.put("request_uri", "/api/v1/operations/diagnostics/run?token=secret");
                  operation.put("error_message", "database password leaked");

                  Map<String, Object> overview = OperationsCenterService.redactOverviewForReport(
                          Map.of("mode", "READ_WRITE", "latestOperation", operation)
                  );
                  Map<String, Object> integrity = OperationsCenterService.redactIntegrityForReport(
                          Map.of("status", "ERROR", "lastError", "jdbc:postgresql://internal?password=secret")
                  );

                  assertThat(overview.toString())
                          .contains("[REDACTED]")
                          .doesNotContain("administrator", "10.0.0.8", "token=secret", "password leaked");
                  assertThat(integrity.get("lastError")).isEqualTo("[REDACTED]");
                  assertThat(integrity.toString()).doesNotContain("postgresql", "password=secret");
              }
          }
          '''.replace('\n          ', '\n')
          if test.count(old) != 1:
              raise RuntimeError('无法定位诊断报告脱敏测试插入点')
          test_path.write_text(test.replace(old, new, 1), encoding='utf-8')
          PY

          git diff --check
          git rm .github/workflows/redact-release-report-0.7.0-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend-repo/src/main/java/com/zjcxph/imgapi/service/OperationsCenterService.java \
            backend-repo/src/test/java/com/zjcxph/imgapi/service/OperationsCenterServiceRedactionTest.java
          git commit -m "修复：完整脱敏 0.7.0 诊断报告"
          git push origin release/0.7.0
