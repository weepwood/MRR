name: release-0.6.1-once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/release-0.6.1-once.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: release-0.6.1
  cancel-in-progress: false

jobs:
  verify-release-and-cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RELEASE_TAG: v0.6.1
      RELEASE_SHA: 6d9d9aed4943600ee8f11276ae1ccec83284944c
      RELEASE_ASSET: MRR-v0.6.1.zip
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0

      - name: Validate immutable release reference
        shell: bash
        run: |
          set -euo pipefail
          test "$(tr -d '\r\n' < VERSION)" = '0.6.1'
          grep -F '<revision>0.6.1</revision>' backend-repo/pom.xml
          test -f release-notes/0.6.1.md
          python scripts/release_baseline.py validate
          python scripts/check_main_branch_references.py

          git fetch --force origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          tag_commit="$(git rev-list -n 1 "${RELEASE_TAG}")"
          test "${tag_commit}" = "${RELEASE_SHA}"

      - name: Ensure formal Windows release exists
        shell: bash
        run: |
          set -euo pipefail

          asset_count='0'
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            asset_count="$(gh release view "${RELEASE_TAG}" \
              --json assets \
              --jq "[.assets[] | select(.name == env.RELEASE_ASSET)] | length")"
          fi

          if [ "${asset_count}" != '1' ]; then
            run_id="$(gh run list \
              --workflow windows-release-package.yml \
              --event workflow_dispatch \
              --limit 30 \
              --json databaseId,headSha,status,conclusion,createdAt \
              --jq '.[] | select(.headSha == env.RELEASE_SHA and (.status == "queued" or .status == "in_progress")) | .databaseId' \
              | head -n 1)"

            if [ -z "${run_id}" ]; then
              gh workflow run windows-release-package.yml --ref "${RELEASE_TAG}"
              for attempt in $(seq 1 30); do
                run_id="$(gh run list \
                  --workflow windows-release-package.yml \
                  --event workflow_dispatch \
                  --limit 30 \
                  --json databaseId,headSha,status,createdAt \
                  --jq '.[] | select(.headSha == env.RELEASE_SHA) | .databaseId' \
                  | head -n 1)"
                if [ -n "${run_id}" ]; then
                  break
                fi
                sleep 2
              done
            fi

            if [ -z "${run_id}" ]; then
              echo 'Unable to locate the formal Windows release workflow run.' >&2
              exit 1
            fi

            gh run watch "${run_id}" --exit-status
          fi

      - name: Publish notes and verify release package
        shell: bash
        run: |
          set -euo pipefail
          gh release edit "${RELEASE_TAG}" \
            --title 'MRR v0.6.1' \
            --notes-file release-notes/0.6.1.md

          asset_count="$(gh release view "${RELEASE_TAG}" \
            --json assets \
            --jq "[.assets[] | select(.name == env.RELEASE_ASSET)] | length")"
          test "${asset_count}" = '1'

          rm -rf /tmp/mrr-release-check
          mkdir -p /tmp/mrr-release-check
          gh release download "${RELEASE_TAG}" \
            --pattern "${RELEASE_ASSET}" \
            --dir /tmp/mrr-release-check
          test -s "/tmp/mrr-release-check/${RELEASE_ASSET}"
          unzip -l "/tmp/mrr-release-check/${RELEASE_ASSET}" | grep -F 'backend/mrr-backend.jar'
          unzip -l "/tmp/mrr-release-check/${RELEASE_ASSET}" | grep -F 'frontend/'
          unzip -l "/tmp/mrr-release-check/${RELEASE_ASSET}" | grep -F 'docs/user/'
          unzip -l "/tmp/mrr-release-check/${RELEASE_ASSET}" | grep -F 'docs/internal/'
          unzip -l "/tmp/mrr-release-check/${RELEASE_ASSET}" | grep -F 'manifest.json'
          unzip -l "/tmp/mrr-release-check/${RELEASE_ASSET}" | grep -F 'SHA256SUMS'

          unzip -p "/tmp/mrr-release-check/${RELEASE_ASSET}" VERSION | tr -d '\r\n' | grep -Fx '0.6.1'
          unzip -p "/tmp/mrr-release-check/${RELEASE_ASSET}" manifest.json \
            | python -c 'import json,sys; data=json.load(sys.stdin); assert data["productVersion"] == "0.6.1"; assert data["gitCommit"] == "6d9d9aed4943600ee8f11276ae1ccec83284944c"'

      - name: Remove one-time release workflow
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          workflow_sha="$(gh api \
            "repos/${REPOSITORY}/contents/.github/workflows/release-0.6.1-once.yml?ref=main" \
            --jq '.sha')"
          gh api \
            --method DELETE \
            "repos/${REPOSITORY}/contents/.github/workflows/release-0.6.1-once.yml" \
            -f message='发布：验证 v0.6.1 并删除一次性任务' \
            -f sha="${workflow_sha}" \
            -f branch='main'
