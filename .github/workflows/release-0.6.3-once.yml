name: release-0.6.3-once

on:
  push:
    branches:
      - main
    paths:
      - 'VERSION'
      - 'backend-repo/pom.xml'
      - 'release-baseline.json'
      - 'CHANGELOG.md'
      - 'release-notes/0.6.3.md'
      - '.github/workflows/release-0.6.3-once.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: release-0.6.3
  cancel-in-progress: false

jobs:
  tag-build-verify-and-cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RELEASE_TAG: v0.6.3
      RELEASE_ASSET: MRR-v0.6.3.zip
      SOURCE_SHA: ${{ github.sha }}
      GH_TOKEN: ${{ github.token }}
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Validate release commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(tr -d '\r\n' < VERSION)" = '0.6.3'
          grep -F '<revision>0.6.3</revision>' backend-repo/pom.xml
          test -f release-notes/0.6.3.md
          python scripts/release_baseline.py validate
          python scripts/check_main_branch_references.py
          python -m unittest scripts.tests.test_windows_one_click_manager -v
          python - <<'PY'
          import json
          from pathlib import Path
          baseline = json.loads(Path('release-baseline.json').read_text(encoding='utf-8'))
          assert baseline['database']['maximumCompatibleMigration'] == '20260722221000'
          PY

      - name: Create immutable release tag
        shell: bash
        run: |
          set -euo pipefail
          remote_tag="$(git ls-remote --tags origin "refs/tags/${RELEASE_TAG}^{}" | awk '{print $1}')"
          if [ -z "${remote_tag}" ]; then
            remote_tag="$(git ls-remote --tags origin "refs/tags/${RELEASE_TAG}" | awk '{print $1}')"
          fi
          if [ -n "${remote_tag}" ]; then
            if [ "${remote_tag}" != "${SOURCE_SHA}" ]; then
              echo "Tag ${RELEASE_TAG} already points to ${remote_tag}; refusing to move it." >&2
              exit 1
            fi
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "${RELEASE_TAG}" "${SOURCE_SHA}" -m 'MRR 0.6.3'
          git push origin "refs/tags/${RELEASE_TAG}"

      - name: Ensure formal Windows release build
        shell: bash
        run: |
          set -euo pipefail
          asset_count='0'
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            asset_count="$(gh release view "${RELEASE_TAG}" --json assets --jq "[.assets[] | select(.name == env.RELEASE_ASSET)] | length")"
          fi
          if [ "${asset_count}" = '1' ]; then
            exit 0
          fi

          run_id="$(gh run list --workflow windows-release-package.yml --event workflow_dispatch --limit 30 --json databaseId,headSha,status --jq '.[] | select(.headSha == env.SOURCE_SHA and (.status == "queued" or .status == "in_progress")) | .databaseId' | head -n 1)"
          if [ -z "${run_id}" ]; then
            gh workflow run windows-release-package.yml --ref "${RELEASE_TAG}"
            for attempt in $(seq 1 30); do
              run_id="$(gh run list --workflow windows-release-package.yml --event workflow_dispatch --limit 30 --json databaseId,headSha,status,createdAt --jq '.[] | select(.headSha == env.SOURCE_SHA) | .databaseId' | head -n 1)"
              if [ -n "${run_id}" ]; then break; fi
              sleep 2
            done
          fi
          if [ -z "${run_id}" ]; then
            echo 'Unable to locate formal Windows release workflow.' >&2
            exit 1
          fi
          gh run watch "${run_id}" --exit-status

      - name: Publish notes and verify formal asset
        shell: bash
        run: |
          set -euo pipefail
          gh release edit "${RELEASE_TAG}" --title 'MRR v0.6.3' --notes-file release-notes/0.6.3.md
          asset_count="$(gh release view "${RELEASE_TAG}" --json assets --jq "[.assets[] | select(.name == env.RELEASE_ASSET)] | length")"
          test "${asset_count}" = '1'

          rm -rf /tmp/mrr-release-check
          mkdir -p /tmp/mrr-release-check/package
          gh release download "${RELEASE_TAG}" --pattern "${RELEASE_ASSET}" --dir /tmp/mrr-release-check
          unzip -q "/tmp/mrr-release-check/${RELEASE_ASSET}" -d /tmp/mrr-release-check/package
          package=/tmp/mrr-release-check/package

          test "$(tr -d '\r\n' < "${package}/VERSION")" = '0.6.3'
          test -f "${package}/backend/mrr-backend.jar"
          test -f "${package}/frontend/index.html"
          test -f "${package}/runtime/nginx/nginx.exe"
          test -f "${package}/runtime/winsw/WinSW-x64.exe"
          test -f "${package}/deploy/windows/mrr-manager.ps1"
          test -f "${package}/deploy/windows/MRR-Manager.cmd"
          test -f "${package}/deploy/windows/install.ps1"
          test -f "${package}/deploy/windows/mrrctl.ps1"
          test -f "${package}/deploy/windows/nginxctl.ps1"

          python - <<'PY'
          import hashlib
          import json
          import re
          from pathlib import Path

          root = Path('/tmp/mrr-release-check/package')
          bom = b'\xef\xbb\xbf'
          scripts = sorted((root / 'deploy/windows').rglob('*.ps1'))
          launchers = sorted((root / 'deploy/windows').glob('*.cmd'))
          assert len(scripts) >= 4
          assert len(launchers) >= 2
          for path in scripts:
              raw = path.read_bytes()
              assert raw.startswith(bom), f'missing UTF-8 BOM: {path}'
              raw.decode('utf-8-sig')
          for path in launchers:
              raw = path.read_bytes()
              assert not raw.startswith(bom), f'CMD must not contain BOM: {path}'
              text = raw.decode('utf-8')
              assert text.lstrip().lower().startswith('@echo off')
              assert 'chcp 65001' in text.lower()

          manifest = json.loads((root / 'manifest.json').read_text(encoding='utf-8'))
          assert manifest['productVersion'] == '0.6.3'
          assert manifest['gitCommit'] == '${{ github.sha }}'
          assert manifest['database']['maximumCompatibleMigration'] == '20260722221000'

          for checksum_root in (root, root / 'runtime'):
              count = 0
              for line in (checksum_root / 'SHA256SUMS').read_text(encoding='utf-8').splitlines():
                  match = re.match(r'^([0-9a-fA-F]{64})\s+\*?(.+)$', line)
                  assert match, line
                  file_path = checksum_root / match.group(2)
                  assert file_path.is_file(), file_path
                  actual = hashlib.sha256(file_path.read_bytes()).hexdigest()
                  assert actual.lower() == match.group(1).lower(), file_path
                  count += 1
              assert count > 0
          PY

      - name: Remove one-time release workflow
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          workflow_sha="$(gh api "repos/${REPOSITORY}/contents/.github/workflows/release-0.6.3-once.yml?ref=main" --jq '.sha')"
          gh api --method DELETE "repos/${REPOSITORY}/contents/.github/workflows/release-0.6.3-once.yml" \
            -f message='发布：验证 v0.6.3 并删除一次性任务' \
            -f sha="${workflow_sha}" \
            -f branch='main'
