name: release-0.6.5-once

on:
  push:
    branches:
      - main
    paths:
      - 'VERSION'
      - 'backend-repo/pom.xml'
      - 'release-baseline.json'
      - 'CHANGELOG.md'
      - 'release-notes/0.6.5.md'
      - 'vitepress-doc/user-guide/release-notes.md'
      - '.github/workflows/release-0.6.5-once.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: release-0.6.5
  cancel-in-progress: false

jobs:
  tag-build-verify-and-cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      RELEASE_TAG: v0.6.5
      RELEASE_ASSET: MRR-v0.6.5.zip
      GH_TOKEN: ${{ github.token }}
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Validate release metadata
        shell: bash
        run: |
          set -euo pipefail
          test "$(tr -d '\r\n' < VERSION)" = '0.6.5'
          grep -F '<revision>0.6.5</revision>' backend-repo/pom.xml
          test -f release-notes/0.6.5.md
          python scripts/release_baseline.py validate
          python scripts/check_main_branch_references.py
          python -m unittest scripts.tests.test_windows_one_click_manager -v
          python - <<'PY'
          import json
          from pathlib import Path
          baseline = json.loads(Path('release-baseline.json').read_text(encoding='utf-8'))
          assert baseline['database']['minimumCompatibleMigration'] == '20260715113552'
          assert baseline['database']['maximumCompatibleMigration'] == '20260723090000'
          assert baseline['configuration']['schemaVersion'] == 1
          assert baseline['applicationRollback']['allowed'] is False
          PY

      - name: Finalize main release commit
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('README.md')
          text = path.read_text(encoding='utf-8')
          old_current = '当前主分支产品版本为 **0.6.3**'
          old_permission = 'v0.6.3 的图片类型修改接口当前也继承此权限'
          if text.count(old_current) != 1 or text.count(old_permission) != 1:
              raise SystemExit('README version markers are missing or duplicated')
          text = text.replace(old_current, '当前主分支产品版本为 **0.6.5**', 1)
          text = text.replace(old_permission, 'v0.6.5 的图片类型修改接口当前也继承此权限', 1)
          path.write_text(text, encoding='utf-8')
          PY

          rm .github/workflows/release-0.6.5-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md .github/workflows/release-0.6.5-once.yml
          git commit -m '发布：定稿 MRR 0.6.5 并清理一次性任务'
          git push origin HEAD:main
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "${GITHUB_ENV}"

      - name: Create immutable release tag
        shell: bash
        run: |
          set -euo pipefail
          remote_tag="$(git ls-remote --tags origin "refs/tags/${RELEASE_TAG}^{}" | awk '{print $1}')"
          if [ -z "${remote_tag}" ]; then
            remote_tag="$(git ls-remote --tags origin "refs/tags/${RELEASE_TAG}" | awk '{print $1}')"
          fi
          if [ -n "${remote_tag}" ]; then
            if [ "${remote_tag}" != "${SOURCE_SHA}" ]; then
              echo "Tag ${RELEASE_TAG} already points to ${remote_tag}; refusing to move it." >&2
              exit 1
            fi
            exit 0
          fi
          git tag -a "${RELEASE_TAG}" "${SOURCE_SHA}" -m 'MRR 0.6.5'
          git push origin "refs/tags/${RELEASE_TAG}"

      - name: Wait for formal Windows release build
        shell: bash
        run: |
          set -euo pipefail
          run_id=''
          for attempt in $(seq 1 60); do
            run_id="$(gh run list --workflow windows-release-package.yml --event push --limit 50 \
              --json databaseId,headSha,headBranch,status,createdAt \
              --jq '.[] | select(.headSha == env.SOURCE_SHA and .headBranch == env.RELEASE_TAG) | .databaseId' \
              | head -n 1)"
            if [ -n "${run_id}" ]; then break; fi
            sleep 3
          done
          if [ -z "${run_id}" ]; then
            echo 'Unable to locate formal Windows tag build.' >&2
            exit 1
          fi
          gh run watch "${run_id}" --exit-status

      - name: Publish notes and verify formal asset
        shell: bash
        run: |
          set -euo pipefail
          gh release edit "${RELEASE_TAG}" --title 'MRR v0.6.5' --notes-file release-notes/0.6.5.md
          asset_count="$(gh release view "${RELEASE_TAG}" --json assets --jq "[.assets[] | select(.name == env.RELEASE_ASSET)] | length")"
          test "${asset_count}" = '1'

          rm -rf /tmp/mrr-release-check
          mkdir -p /tmp/mrr-release-check/package
          gh release download "${RELEASE_TAG}" --pattern "${RELEASE_ASSET}" --dir /tmp/mrr-release-check
          unzip -q "/tmp/mrr-release-check/${RELEASE_ASSET}" -d /tmp/mrr-release-check/package
          package=/tmp/mrr-release-check/package

          test "$(tr -d '\r\n' < "${package}/VERSION")" = '0.6.5'
          test -f "${package}/backend/mrr-backend.jar"
          test -f "${package}/frontend/index.html"
          test -f "${package}/runtime/nginx/nginx.exe"
          test -f "${package}/runtime/winsw/WinSW-x64.exe"
          test -f "${package}/deploy/windows/mrr-manager.ps1"
          test -f "${package}/deploy/windows/MRR-Manager.cmd"
          test -f "${package}/deploy/windows/install.ps1"
          test -f "${package}/deploy/windows/mrrctl.ps1"
          test -f "${package}/deploy/windows/nginxctl.ps1"
          test -f "${package}/deploy/windows/nginx-control.cmd"

          python - <<'PY'
          import hashlib
          import json
          import re
          from pathlib import Path

          root = Path('/tmp/mrr-release-check/package')
          bom = b'\xef\xbb\xbf'
          scripts = sorted((root / 'deploy/windows').rglob('*.ps1'))
          launchers = sorted((root / 'deploy/windows').glob('*.cmd'))
          assert len(scripts) >= 4
          assert len(launchers) >= 2
          for path in scripts:
              raw = path.read_bytes()
              assert raw.startswith(bom), f'missing UTF-8 BOM: {path}'
              raw.decode('utf-8-sig')
          for path in launchers:
              raw = path.read_bytes()
              assert not raw.startswith(bom), f'CMD must not contain BOM: {path}'
              text = raw.decode('utf-8')
              assert text.lstrip().lower().startswith('@echo off')
              assert 'chcp 65001' in text.lower()

          manifest = json.loads((root / 'manifest.json').read_text(encoding='utf-8'))
          assert manifest['productVersion'] == '0.6.5'
          assert manifest['gitCommit'] == '${{ env.SOURCE_SHA }}'
          assert manifest['database']['minimumCompatibleMigration'] == '20260715113552'
          assert manifest['database']['maximumCompatibleMigration'] == '20260723090000'
          assert manifest['configuration']['schemaVersion'] == 1

          for checksum_root in (root, root / 'runtime'):
              count = 0
              for line in (checksum_root / 'SHA256SUMS').read_text(encoding='utf-8').splitlines():
                  match = re.match(r'^([0-9a-fA-F]{64})\s+\*?(.+)$', line)
                  assert match, line
                  file_path = checksum_root / match.group(2)
                  assert file_path.is_file(), file_path
                  actual = hashlib.sha256(file_path.read_bytes()).hexdigest()
                  assert actual.lower() == match.group(1).lower(), file_path
                  count += 1
              assert count > 0
          PY
