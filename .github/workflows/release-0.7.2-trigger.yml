name: 合并后发布 MRR 0.7.2

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release-0.7.2-trigger.yml
      - scripts/release_0_7_2.py

permissions:
  contents: write
  actions: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RELEASE_VERSION: 0.7.2
      RELEASE_TAG: v0.7.2
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Validate release does not exist
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "标签 ${RELEASE_TAG} 已存在" >&2
            exit 1
          fi
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release ${RELEASE_TAG} 已存在" >&2
            exit 1
          fi

      - name: Prepare release state
        shell: bash
        run: |
          set -euo pipefail
          python scripts/release_0_7_2.py
          python scripts/release_baseline.py validate

      - name: Commit release and remove temporary tasks
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/release-0.7.2-once.yml
          git rm .github/workflows/release-0.7.2-trigger.yml
          git rm scripts/release_0_7_2.py
          git add VERSION backend-repo/pom.xml release-baseline.json CHANGELOG.md README.md \
            vitepress-doc/internal/index.md vitepress-doc/user-guide/release-notes.md \
            release-notes/0.7.2.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "发布：MRR 0.7.2"
          git push origin main

      - name: Create immutable release tag
        shell: bash
        run: |
          set -euo pipefail
          target_sha="$(git rev-parse HEAD)"
          git tag -a "$RELEASE_TAG" "$target_sha" -m "MRR ${RELEASE_VERSION}"
          git push origin "refs/tags/${RELEASE_TAG}"
          echo "已创建标签 ${RELEASE_TAG} -> ${target_sha}"

      - name: Dispatch official release workflows
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run windows-release-package.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$RELEASE_TAG"
          gh workflow run standalone-jar-release.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$RELEASE_TAG"
          echo "已调度 Windows ZIP 与单体 JAR 正式构建，ref=${RELEASE_TAG}"
