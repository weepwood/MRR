name: 一次性发布 MRR 0.7.3

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release-0.7.3-once.yml
      - scripts/release_0_7_3.py

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RELEASE_VERSION: 0.7.3
      RELEASE_TAG: v0.7.3
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Validate release does not exist
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "标签 ${RELEASE_TAG} 已存在" >&2
            exit 1
          fi
          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release ${RELEASE_TAG} 已存在" >&2
            exit 1
          fi

      - name: Update version baseline and documentation
        shell: bash
        run: |
          set -euo pipefail
          python scripts/release_0_7_3.py
          python scripts/release_baseline.py validate
          grep -F '当前值为 **0.7.3**' README.md
          grep -F '单体 JAR 已包含管理端、用户手册、内部文档' README.md

      - name: Commit release state and remove one-time files
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/release-0.7.3-once.yml scripts/release_0_7_3.py
          git add VERSION backend-repo/pom.xml release-baseline.json CHANGELOG.md README.md \
            vitepress-doc/internal/index.md vitepress-doc/user-guide/release-notes.md \
            release-notes/0.7.3.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "发布：MRR 0.7.3"
          git push origin main

      - name: Create immutable release tag
        shell: bash
        run: |
          set -euo pipefail
          target_sha="$(git rev-parse HEAD)"
          git tag -a "${RELEASE_TAG}" "${target_sha}" -m "MRR ${RELEASE_VERSION}"
          git push origin "refs/tags/${RELEASE_TAG}"

      - name: Wait for formal release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          expected_assets=(
            "MRR-v${RELEASE_VERSION}.zip"
            "MRR-v${RELEASE_VERSION}-standalone.jar"
            "MRR-v${RELEASE_VERSION}-standalone.jar.sha256"
          )

          for attempt in $(seq 1 120); do
            if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
              assets="$(gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --json assets --jq '.assets[].name')"
              missing=0
              for asset in "${expected_assets[@]}"; do
                if ! grep -Fxq "${asset}" <<< "${assets}"; then
                  missing=1
                fi
              done
              if [[ "${missing}" -eq 0 ]]; then
                gh release edit "${RELEASE_TAG}" \
                  --repo "${GITHUB_REPOSITORY}" \
                  --title "MRR ${RELEASE_TAG}" \
                  --notes-file release-notes/0.7.3.md
                printf '%s\n' "${assets}"
                exit 0
              fi
            fi
            echo "等待 ${RELEASE_TAG} 正式资产 (${attempt}/120)..."
            sleep 15
          done

          echo "${RELEASE_TAG} 正式资产未在规定时间内完整生成" >&2
          exit 1
