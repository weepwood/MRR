name: Release on version bump

on:
  push:
    branches:
      - main
    paths:
      - 'VERSION'

permissions:
  contents: write
  actions: write

concurrency:
  group: release-on-version-bump
  cancel-in-progress: false

jobs:
  create-tag-and-dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate release identity
        id: release
        shell: bash
        run: |
          set -euo pipefail
          python scripts/release_baseline.py validate

          VERSION_VALUE="$(tr -d '\r\n' < VERSION)"
          if ! [[ "${VERSION_VALUE}" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid VERSION: ${VERSION_VALUE}" >&2
            exit 1
          fi

          test -f "release-notes/${VERSION_VALUE}.md"
          TAG_NAME="v${VERSION_VALUE}"
          echo "version=${VERSION_VALUE}" >> "${GITHUB_OUTPUT}"
          echo "tag=${TAG_NAME}" >> "${GITHUB_OUTPUT}"

          if git ls-remote --exit-code --tags origin "refs/tags/${TAG_NAME}" >/dev/null 2>&1; then
            echo "exists=true" >> "${GITHUB_OUTPUT}"
          else
            echo "exists=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Create release tag
        if: steps.release.outputs.exists != 'true'
        env:
          TAG_NAME: ${{ steps.release.outputs.tag }}
          VERSION_VALUE: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG_NAME}" "${GITHUB_SHA}" -m "MRR ${VERSION_VALUE}"
          git push origin "${TAG_NAME}"

      - name: Dispatch Windows release package
        if: steps.release.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.release.outputs.tag }}
        run: gh workflow run windows-release-package.yml --ref "${TAG_NAME}"

      - name: Dispatch standalone JAR release
        if: steps.release.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.release.outputs.tag }}
        run: gh workflow run standalone-jar-release.yml --ref "${TAG_NAME}"

      - name: Release summary
        shell: bash
        run: |
          {
            echo "## MRR ${{ steps.release.outputs.version }}"
            echo
            if [[ "${{ steps.release.outputs.exists }}" == 'true' ]]; then
              echo "Tag ${{ steps.release.outputs.tag }} already exists; release dispatch was skipped."
            else
              echo "Created tag ${{ steps.release.outputs.tag }} and dispatched both release workflows."
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
