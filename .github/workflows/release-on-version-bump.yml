name: Release

# Updating VERSION no longer creates a tag. Validation always precedes publication.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate everything without creating a tag or Release
        type: boolean
        required: true
        default: true

permissions:
  contents: read
  actions: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  identity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Freeze source and check release admission
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          python scripts/release_baseline.py validate
          python -m scripts.release_candidate preflight --dry-run "${DRY_RUN}"

  qualify:
    needs: identity
    uses: ./.github/workflows/release-validation.yml
    with:
      retain_candidate: ${{ !inputs.dry_run }}

  publish:
    needs: [identity, qualify]
    if: inputs.dry_run == false && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.qualify.outputs.artifact }}
          path: release-assets
      - name: Verify exact files, create immutable tag, upload draft and publish
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_ATTEMPT: ${{ needs.qualify.outputs.attempt }}
        run: python -m scripts.release_candidate publish --directory release-assets --attempt "${BUILD_ATTEMPT}"

  summary:
    needs: [identity, qualify, publish]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Record the exact result
        env:
          IDENTITY: ${{ needs.identity.result }}
          QUALIFY: ${{ needs.qualify.result }}
          PUBLISH: ${{ needs.publish.result }}
          DRY_RUN: ${{ inputs.dry_run }}
          CANDIDATE: ${{ needs.qualify.outputs.artifact }}
        run: |
          {
            echo "Source commit: ${GITHUB_SHA}"
            echo "Dry run: ${DRY_RUN}"
            echo "Identity: ${IDENTITY}; full validation: ${QUALIFY}; publish: ${PUBLISH}"
            echo "Candidate: ${CANDIDATE}"
          } >> "${GITHUB_STEP_SUMMARY}"
          test "${IDENTITY}" = success
          test "${QUALIFY}" = success
          if [ "${DRY_RUN}" = false ]; then test "${PUBLISH}" = success; fi
