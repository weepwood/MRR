name: runtime-dependencies-refresh

on:
  push:
    branches:
      - chore/dependabot-frontend-runtime-20260728

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend-fantastic-admin/.node-version
          cache: pnpm
          cache-dependency-path: frontend-fantastic-admin/pnpm-lock.yaml

      - name: Apply runtime dependency versions
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('frontend-fantastic-admin/package.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          dependencies = data['dependencies']
          updates = {
              '@vueuse/components': '^14.3.0',
              '@vueuse/core': '^14.3.0',
              '@vueuse/integrations': '^14.3.0',
              'dayjs': '^1.11.21',
              'defu': '^6.1.7',
              'element-plus': '^2.14.3',
              'filesize': '^11.0.22',
              'hotkeys-js': '^4.0.4',
              'path-to-regexp': '^8.4.2',
              'qs': '^6.15.3',
              'vue': '^3.5.40',
          }
          for name, version in updates.items():
              dependencies[name] = version
          data['devDependencies']['@types/qs'] = '^6.15.1'
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Refresh lockfile
        working-directory: frontend-fantastic-admin
        run: pnpm install --lockfile-only --no-frozen-lockfile --ignore-scripts

      - name: Commit updates and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend-fantastic-admin/package.json frontend-fantastic-admin/pnpm-lock.yaml
          git rm .github/workflows/runtime-dependencies-refresh.yml
          git commit -m "依赖：基于最新主分支整合前端运行时升级"
          git push
