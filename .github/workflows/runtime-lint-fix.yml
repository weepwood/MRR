name: runtime-lint-fix

on:
  push:
    branches:
      - chore/dependabot-frontend-runtime-20260728

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - name: Fix import order
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('frontend-fantastic-admin/src/views/statistics/index.vue')
          text = path.read_text(encoding='utf-8')
          old = "import { computed, onMounted, ref } from 'vue'\nimport { MrrChartCard, MrrDualAxisChart } from '@/components/charts'\nimport {\n  exportStatisticsCsv,\n  getStatisticsDateSummary,\n  getStatisticsList,\n  getStatisticsSummary,\n} from '@/api/modules/statistics'\n"
          new = "import { computed, onMounted, ref } from 'vue'\nimport {\n  exportStatisticsCsv,\n  getStatisticsDateSummary,\n  getStatisticsList,\n  getStatisticsSummary,\n} from '@/api/modules/statistics'\nimport { MrrChartCard, MrrDualAxisChart } from '@/components/charts'\n"
          if old not in text:
              raise SystemExit('Expected statistics import block not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit fix and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/runtime-lint-fix.yml
          git add frontend-fantastic-admin/src/views/statistics/index.vue
          git commit -m "修复：整理统计页面依赖导入顺序"
          git push
