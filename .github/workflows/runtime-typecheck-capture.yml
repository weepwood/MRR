name: runtime-typecheck-capture

on:
  push:
    branches:
      - chore/dependabot-frontend-runtime-20260728

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend-fantastic-admin/.node-version
          cache: pnpm
          cache-dependency-path: frontend-fantastic-admin/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend-fantastic-admin
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Capture and commit typecheck output
        shell: bash
        run: |
          set +e
          cd frontend-fantastic-admin
          pnpm lint:tsc > ../runtime-typecheck.log 2>&1
          status=$?
          cd ..
          echo "exit_code=$status" >> runtime-typecheck.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f runtime-typecheck.log
          git rm .github/workflows/runtime-typecheck-capture.yml
          git commit -m "工程：记录运行时依赖类型检查结果"
          git push
