name: Standalone JAR release

on:
  pull_request:
    branches:
      - main
    paths:
      - 'VERSION'
      - 'release-baseline.json'
      - 'scripts/release_baseline.py'
      - 'scripts/embed_frontend_in_jar.py'
      - 'scripts/build_standalone_jar.py'
      - 'scripts/tests/test_embed_frontend_in_jar.py'
      - 'scripts/tests/test_documentation_packaging_policy.py'
      - 'scripts/tests/test_build_standalone_jar.py'
      - 'backend-repo/**'
      - 'frontend-fantastic-admin/**'
      - '.github/workflows/standalone-jar-release.yml'
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      jar_name: ${{ steps.standalone.outputs.jar_name }}
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: frontend-fantastic-admin/.node-version

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@10.33.0 --activate

      - name: Validate release identity
        shell: bash
        run: |
          set -euo pipefail
          python scripts/release_baseline.py validate

          PRODUCT_VERSION="$(tr -d '\r\n' < VERSION)"
          BUILD_TIME="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          if [[ "${GITHUB_REF}" == refs/tags/* ]] && [[ "${GITHUB_REF_NAME}" != "v${PRODUCT_VERSION}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match VERSION v${PRODUCT_VERSION}" >&2
            exit 1
          fi

          echo "PRODUCT_VERSION=${PRODUCT_VERSION}" >> "${GITHUB_ENV}"
          echo "MRR_GIT_COMMIT=${SOURCE_SHA}" >> "${GITHUB_ENV}"
          echo "MRR_BUILD_TIME=${BUILD_TIME}" >> "${GITHUB_ENV}"

      - name: Test frontend JAR packaging policy
        run: |
          python -m unittest \
            scripts.tests.test_embed_frontend_in_jar \
            scripts.tests.test_documentation_packaging_policy

      - name: Test and package backend
        working-directory: backend-repo
        run: mvn -B -Drevision="${PRODUCT_VERSION}" test package

      - name: Locate backend JAR
        shell: bash
        run: |
          set -euo pipefail
          BACKEND_JAR="$(find backend-repo/target -maxdepth 1 -type f -name '*.jar' ! -name '*.original' | head -n 1)"
          test -n "${BACKEND_JAR}"
          echo "BACKEND_JAR=${BACKEND_JAR}" >> "${GITHUB_ENV}"

      - name: Test, build and embed frontend
        working-directory: frontend-fantastic-admin
        run: |
          pnpm install --frozen-lockfile
          pnpm lint:tsc
          pnpm test:run
          pnpm build
          grep -R --fixed-strings "${PRODUCT_VERSION}" dist >/dev/null
          grep -R --fixed-strings "${SOURCE_SHA}" dist >/dev/null
          python ../scripts/embed_frontend_in_jar.py embed \
            --jar "../${BACKEND_JAR}" \
            --dist dist
          python ../scripts/embed_frontend_in_jar.py verify \
            --jar "../${BACKEND_JAR}"

      - name: Build standalone JAR
        id: standalone
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest scripts.tests.test_build_standalone_jar

          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            JAR_NAME="MRR-v${PRODUCT_VERSION}-standalone.jar"
          else
            JAR_NAME="MRR-v${PRODUCT_VERSION}-${SOURCE_SHA:0:8}-standalone.jar"
          fi
          JAR_PATH="build/${JAR_NAME}"

          python scripts/build_standalone_jar.py build \
            --source "${BACKEND_JAR}" \
            --output "${JAR_PATH}" \
            --default-port 8002
          python scripts/build_standalone_jar.py verify \
            --jar "${JAR_PATH}" \
            --default-port 8002
          python scripts/embed_frontend_in_jar.py verify \
            --jar "${JAR_PATH}"

          unzip -p "${JAR_PATH}" BOOT-INF/classes/application.properties \
            | grep -F 'server.port=${SERVER_PORT:8002}'
          unzip -p "${JAR_PATH}" META-INF/build-info.properties \
            | grep -F "build.version=${PRODUCT_VERSION}"

          GIT_INFO="$(unzip -p "${JAR_PATH}" BOOT-INF/classes/git.properties || true)"
          if ! grep -F "${SOURCE_SHA}" <<< "${GIT_INFO}" \
            && ! grep -F "${SOURCE_SHA:0:7}" <<< "${GIT_INFO}"; then
            echo "Standalone JAR git.properties does not contain ${SOURCE_SHA}" >&2
            printf '%s\n' "${GIT_INFO}" >&2
            exit 1
          fi

          (
            cd build
            sha256sum "${JAR_NAME}" > "${JAR_NAME}.sha256"
          )
          echo "jar=${JAR_PATH}" >> "${GITHUB_OUTPUT}"
          echo "jar_name=${JAR_NAME}" >> "${GITHUB_OUTPUT}"

      - name: Upload standalone JAR artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.standalone.outputs.jar_name }}
          path: |
            ${{ steps.standalone.outputs.jar }}
            ${{ steps.standalone.outputs.jar }}.sha256
          if-no-files-found: error
          retention-days: 30

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download standalone JAR artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.jar_name }}
          path: build/release-assets

      - name: Upload JAR to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          JAR_PATH="$(find build/release-assets -maxdepth 1 -type f -name '*.jar' | head -n 1)"
          test -n "${JAR_PATH}"
          test -f "${JAR_PATH}.sha256"

          for attempt in $(seq 1 80); do
            if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
              gh release upload "${GITHUB_REF_NAME}" \
                "${JAR_PATH}" \
                "${JAR_PATH}.sha256" \
                --repo "${GITHUB_REPOSITORY}" \
                --clobber
              exit 0
            fi
            echo "Waiting for GitHub Release ${GITHUB_REF_NAME} (${attempt}/80)..."
            sleep 15
          done

          echo "GitHub Release ${GITHUB_REF_NAME} was not created by the Windows release workflow" >&2
          exit 1
