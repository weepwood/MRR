name: Sync PR 194 with main

on:
  push:
    branches:
      - sync/pr194-main-20260723

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sync branch
        uses: actions/checkout@v4
        with:
          ref: sync/pr194-main-20260723
          fetch-depth: 0

      - name: Replay reviewed PR files
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_BRANCH='feat/core-table-data-exchange-20260722'
          TARGET_BRANCH='sync/pr194-main-20260723'
          SOURCE_HEAD='45637e37f14c794b269a40bd7c731b94137b2bda'

          git fetch origin "${SOURCE_BRANCH}" main
          test "$(git rev-parse "origin/${SOURCE_BRANCH}")" = "${SOURCE_HEAD}"

          git checkout "origin/${SOURCE_BRANCH}" -- \
            backend-repo/src/main/java/com/zjcxph/imgapi/controller/DataExchangeController.java \
            backend-repo/src/main/java/com/zjcxph/imgapi/dto/resp/DataExchangeImportError.java \
            backend-repo/src/main/java/com/zjcxph/imgapi/dto/resp/DataExchangeImportResult.java \
            backend-repo/src/main/java/com/zjcxph/imgapi/service/ArchiveBoxDataExchangeService.java \
            backend-repo/src/main/java/com/zjcxph/imgapi/service/DataExchangeExportService.java \
            backend-repo/src/main/java/com/zjcxph/imgapi/service/ScanDataExchangeService.java \
            backend-repo/src/main/java/com/zjcxph/imgapi/service/StatisticsDataExchangeService.java \
            backend-repo/src/main/java/com/zjcxph/imgapi/service/importer/DataExchangeImportSupport.java \
            backend-repo/src/main/java/com/zjcxph/imgapi/service/importer/TabularImportFileReader.java \
            backend-repo/src/main/resources/application.properties \
            backend-repo/src/main/resources/db/migration/V20260723010000__defer_archive_statistics_source_fk.sql \
            backend-repo/src/main/resources/db/migration/V20260723011000__index_scan_path_for_data_exchange.sql \
            backend-repo/src/main/resources/db/migration/V20260723011000__index_scan_path_for_data_exchange.sql.conf \
            backend-repo/src/test/java/com/zjcxph/imgapi/integration/service/CoreDataExchangePostgresqlIT.java \
            backend-repo/src/test/java/com/zjcxph/imgapi/unit/service/ScanDataExchangeServiceTest.java \
            backend-repo/src/test/java/com/zjcxph/imgapi/unit/service/importer/DataExchangeSpreadsheetSafetyTest.java \
            frontend-fantastic-admin/src/api/modules/data-exchange.ts \
            frontend-fantastic-admin/src/views/data-exchange/components/DatasetImportPanel.vue \
            frontend-fantastic-admin/src/views/data-exchange/index.vue \
            frontend-fantastic-admin/src/views/patients/index.vue \
            release-baseline.json \
            vitepress-doc/user-guide/data-exchange-checklist.md \
            vitepress-doc/user-guide/data-exchange.md

          rm -f .github/workflows/sync-pr194-with-main.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m '合并：同步最新主线并解决患者页面冲突'
          git push origin "HEAD:${TARGET_BRANCH}"
          git push --force-with-lease="refs/heads/${SOURCE_BRANCH}:${SOURCE_HEAD}" origin "HEAD:refs/heads/${SOURCE_BRANCH}"
