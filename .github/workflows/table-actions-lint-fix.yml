name: table-actions-lint-fix

on:
  pull_request:
    paths:
      - '.github/workflows/table-actions-lint-fix.yml'
      - 'scripts/fix-table-actions-lint.py'

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply format fixes
        run: python scripts/fix-table-actions-lint.py

      - name: Commit fixes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No format fixes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            frontend-fantastic-admin/src/views/data-relations/index.vue \
            frontend-fantastic-admin/src/views/oss-migration/index.vue \
            frontend-fantastic-admin/src/views/statistics-detail/ArchiveDetailContent.vue
          git commit -m "修复：规范表格操作列相关页面格式"
          git push origin HEAD:${{ github.head_ref }}
