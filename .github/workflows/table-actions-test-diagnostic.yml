name: table-actions-test-diagnostic

on:
  pull_request:
    paths:
      - '.github/workflows/table-actions-test-diagnostic.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend-fantastic-admin/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend-fantastic-admin
        run: pnpm install --frozen-lockfile

      - name: Run unit tests with verbose log
        id: tests
        working-directory: frontend-fantastic-admin
        shell: bash
        run: |
          set +e
          pnpm test:run -- --reporter=verbose > unit-test.log 2>&1
          status=$?
          cat unit-test.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload unit test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: table-actions-unit-test-log
          path: frontend-fantastic-admin/unit-test.log
          retention-days: 1

      - name: Fail when tests fail
        if: steps.tests.outputs.status != '0'
        run: exit 1
