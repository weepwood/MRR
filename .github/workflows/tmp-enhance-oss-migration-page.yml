name: 临时完善 OSS 迁移管理页面

on:
  push:
    branches:
      - feat/oss-migration-management-20260722
    paths:
      - '.github/workflows/tmp-enhance-oss-migration-page.yml'

concurrency:
  group: enhance-oss-migration-page
  cancel-in-progress: true

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/oss-migration-management-20260722

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend-fantastic-admin/pnpm-lock.yaml

      - name: Apply implementation
        run: python3 scripts/tmp_apply_oss_migration_page.py

      - name: Backend verify
        working-directory: backend-repo
        run: mvn -B verify

      - name: Frontend verify
        working-directory: frontend-fantastic-admin
        run: |
          pnpm install --frozen-lockfile
          pnpm lint
          pnpm test:run
          pnpm build
          pnpm build:mock

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend-repo frontend-fantastic-admin
          git commit -m "功能：完善 OSS 迁移管理页面与管理查询"
          git push origin HEAD:feat/oss-migration-management-20260722

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${GITHUB_REPOSITORY}/issues/182/comments \
            -f body="OSS 迁移管理页面完善流程失败，请查看工作流‘临时完善 OSS 迁移管理页面’的失败步骤和日志。"
