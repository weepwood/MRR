name: 临时修复 OSS 页面样式顺序

on:
  push:
    branches:
      - feat/oss-migration-management-20260722
    paths:
      - '.github/workflows/tmp-fix-oss-page-style.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/oss-migration-management-20260722
          fetch-depth: 0
      - name: Fix property order
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('frontend-fantastic-admin/src/views/oss-migration/index.vue')
          text = path.read_text(encoding='utf-8')
          old = '''.check-item {
            display: flex;
            align-items: center;
            gap: 12px;
            justify-content: space-between;
          '''
          new = '''.check-item {
            display: flex;
            gap: 12px;
            align-items: center;
            justify-content: space-between;
          '''
          if old not in text:
              raise SystemExit('未找到待修复样式片段')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend-fantastic-admin/src/views/oss-migration/index.vue
          git commit -m "修复：调整 OSS 页面 Flex 属性顺序"
          git push origin HEAD:feat/oss-migration-management-20260722

# second-push trigger
