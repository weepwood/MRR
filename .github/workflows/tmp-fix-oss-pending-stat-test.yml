name: 临时修复 OSS 待迁移统计测试

on:
  push:
    branches:
      - feat/oss-migration-management-20260722
    paths:
      - '.github/workflows/tmp-fix-oss-pending-stat-test.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/oss-migration-management-20260722

      - name: Fix pending assertion
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('backend-repo/src/test/java/com/zjcxph/imgapi/integration/mapper/ScanMapperPostgresqlIT.java')
          text = path.read_text(encoding='utf-8')
          old = '        assertThat(((Number) stats.get("pending")).longValue()).isEqualTo(1);'
          new = '        assertThat(((Number) stats.get("pending")).longValue()).isEqualTo(2);'
          if text.count(old) != 1:
              raise SystemExit('未唯一定位 pending 统计断言')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend-repo/src/test/java/com/zjcxph/imgapi/integration/mapper/ScanMapperPostgresqlIT.java
          git commit -m "测试：校正到期重试的待迁移统计"
          git push origin HEAD:feat/oss-migration-management-20260722
