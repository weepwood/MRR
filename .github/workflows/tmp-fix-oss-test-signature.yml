name: 临时修复 OSS 测试签名

on:
  push:
    branches:
      - feat/oss-migration-management-20260722
    paths:
      - '.github/workflows/tmp-fix-oss-test-signature.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/oss-migration-management-20260722

      - name: Fix test signature
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('backend-repo/src/test/java/com/zjcxph/imgapi/unit/service/MigrationServiceImplTest.java')
          text = path.read_text(encoding='utf-8')
          old = '    void missingSjhWaitsWithoutClaimingOrRetrying() {'
          new = '    void missingSjhWaitsWithoutClaimingOrRetrying() throws Exception {'
          if text.count(old) != 1:
              raise SystemExit('未唯一定位等待上架号测试方法')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend-repo/src/test/java/com/zjcxph/imgapi/unit/service/MigrationServiceImplTest.java
          git commit -m "测试：修正等待上架号用例异常声明"
          git push origin HEAD:feat/oss-migration-management-20260722
