name: 临时集成 OSS 文件资源管理器

on:
  push:
    branches:
      - feat/oss-migration-management-20260722
    paths:
      - '.github/workflows/tmp-integrate-oss-browser.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/oss-migration-management-20260722
          fetch-depth: 0
      - name: Apply browser integration fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          page_path = Path('frontend-fantastic-admin/src/views/oss-migration/index.vue')
          page_text = page_path.read_text(encoding='utf-8')
          import_marker = "} from '@/api/modules/oss'\n\ndefineOptions({ name: 'OssMigrationPage' })"
          import_replacement = "} from '@/api/modules/oss'\nimport OssFileExplorer from './components/OssFileExplorer.vue'\n\ndefineOptions({ name: 'OssMigrationPage' })"
          if "import OssFileExplorer from './components/OssFileExplorer.vue'" not in page_text:
              if import_marker not in page_text:
                  raise SystemExit('未找到 OSS 页面导入位置')
              page_text = page_text.replace(import_marker, import_replacement, 1)

          component_marker = '''      </div>
          <el-button
            type="primary"
            :icon="UploadFilled"
            :disabled="!selectedPendingIds.length || hasActiveJob"
            :loading="loading.manual"
            @click="handleManualUpload"
          >
            手工上传 {{ selectedPendingIds.length }} 条
          </el-button>
        </div>
      </el-card>

      <el-card shadow="never">
        <template #header>
          <div class="card-header">
            <div>
              <strong>迁移任务历史</strong>'''
          component_replacement = '''      </div>
          <el-button
            type="primary"
            :icon="UploadFilled"
            :disabled="!selectedPendingIds.length || hasActiveJob"
            :loading="loading.manual"
            @click="handleManualUpload"
          >
            手工上传 {{ selectedPendingIds.length }} 条
          </el-button>
        </div>
      </el-card>

      <OssFileExplorer />

      <el-card shadow="never">
        <template #header>
          <div class="card-header">
            <div>
              <strong>迁移任务历史</strong>'''
          if '<OssFileExplorer />' not in page_text:
              if component_marker not in page_text:
                  raise SystemExit('未找到 OSS 浏览器组件插入位置')
              page_text = page_text.replace(component_marker, component_replacement, 1)
          page_path.write_text(page_text, encoding='utf-8')

          test_path = Path('backend-repo/src/test/java/com/zjcxph/imgapi/unit/service/OssServiceImplTest.java')
          test_text = test_path.read_text(encoding='utf-8')
          test_text = test_text.replace(
              '        when(ossProperties.getEndpoint()).thenReturn("oss.example.com");\n'
              '        when(ossProperties.getRegion()).thenReturn("test-region");\n',
              '',
          )
          test_text = test_text.replace(
              '    void browseObjectsUsesVirtualDirectoryPagination() {\n',
              '    void browseObjectsUsesVirtualDirectoryPagination() {\n'
              '        when(ossProperties.getEndpoint()).thenReturn("oss.example.com");\n'
              '        when(ossProperties.getRegion()).thenReturn("test-region");\n',
              1,
          )
          test_text = test_text.replace(
              '        listing.setObjectSummaries(List.of(file));',
              '        listing.getObjectSummaries().add(file);',
              1,
          )
          test_path.write_text(test_text, encoding='utf-8')

          component_path = Path('frontend-fantastic-admin/src/views/oss-migration/components/OssFileExplorer.vue')
          component_text = component_path.read_text(encoding='utf-8')
          replacements = {
              "            <dd>{{ selectedEntry.directory ? '文件夹' : (fileExtension(selectedEntry).toUpperCase() || '文件') }}</dd>": "            <dd>\n              {{ selectedEntry.directory ? '文件夹' : (fileExtension(selectedEntry).toUpperCase() || '文件') }}\n            </dd>",
              "            <dd>{{ selectedEntry.directory ? '-' : formatFileSize(selectedEntry.size) }}</dd>": "            <dd>\n              {{ selectedEntry.directory ? '-' : formatFileSize(selectedEntry.size) }}\n            </dd>",
              "            <dd>{{ formatDate(selectedEntry.lastModified) }}</dd>": "            <dd>\n              {{ formatDate(selectedEntry.lastModified) }}\n            </dd>",
              "            <dd>{{ selectedEntry.storageClass || '-' }}</dd>": "            <dd>\n              {{ selectedEntry.storageClass || '-' }}\n            </dd>",
              "            <dd class=\"break-text\">{{ selectedEntry.etag || '-' }}</dd>": "            <dd class=\"break-text\">\n              {{ selectedEntry.etag || '-' }}\n            </dd>",
              "            <dd class=\"break-text\">{{ selectedEntry.key }}</dd>": "            <dd class=\"break-text\">\n              {{ selectedEntry.key }}\n            </dd>",
              "  color: var(--el-text-color-secondary);\n  font-size: 12px;": "  font-size: 12px;\n  color: var(--el-text-color-secondary);",
              "  background: transparent;\n  border: 0;\n  cursor: pointer;": "  background: transparent;\n  cursor: pointer;\n  border: 0;",
              "  gap: 10px;\n  align-content: start;\n  flex: 1;": "  gap: 10px;\n  flex: 1;\n  align-content: start;",
              "  overflow: hidden;\n  text-align: center;\n  text-overflow: ellipsis;": "  overflow: hidden;\n  text-overflow: ellipsis;\n  text-align: center;",
              "  margin: 8px 0 18px;\n  overflow-wrap: anywhere;\n  text-align: center;": "  margin: 8px 0 18px;\n  text-align: center;\n  overflow-wrap: anywhere;",
              "@media (max-width: 1280px)": "@media (width <= 1280px)",
              "@media (max-width: 860px)": "@media (width <= 860px)",
              "    align-items: flex-start;\n    flex-direction: column;": "    flex-direction: column;\n    align-items: flex-start;",
          }
          for old, new in replacements.items():
              component_text = component_text.replace(old, new)
          component_path.write_text(component_text, encoding='utf-8')
          PY
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend-repo/src/test/java/com/zjcxph/imgapi/unit/service/OssServiceImplTest.java \
            frontend-fantastic-admin/src/views/oss-migration/index.vue \
            frontend-fantastic-admin/src/views/oss-migration/components/OssFileExplorer.vue
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "修复：完善 OSS 文件浏览器集成与测试"
          git push origin HEAD:feat/oss-migration-management-20260722

# trigger-fixes
