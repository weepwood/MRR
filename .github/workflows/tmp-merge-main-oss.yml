name: 临时合并 main 到 OSS 分支

on:
  push:
    branches:
      - feat/oss-migration-management-20260722
    paths:
      - '.github/workflows/tmp-merge-main-oss.yml'

concurrency:
  group: merge-main-into-oss
  cancel-in-progress: true

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/oss-migration-management-20260722

      - name: Merge latest main
        id: merge
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main

          set +e
          git merge --no-commit --no-ff origin/main
          merge_status=$?
          set -e

          conflicts="$(git diff --name-only --diff-filter=U)"
          printf '%s\n' "$conflicts" > /tmp/merge-conflicts.txt

          allowed_conflicts="
          .github/workflows/windows-release-package.yml
          backend-repo/src/main/resources/mapper/LogMapper.xml
          backend-repo/src/test/java/com/zjcxph/imgapi/integration/mapper/LogMapperIT.java
          backend-repo/src/test/java/com/zjcxph/imgapi/integration/mapper/ScanMapperPostgresqlIT.java
          release-baseline.json
          vitepress-doc/internal/release.md
          "

          for path in $conflicts; do
            if ! grep -Fxq "$path" <<< "$allowed_conflicts"; then
              echo "发现未预期冲突：$path" >&2
              exit 1
            fi
          done

          for path in \
            .github/workflows/windows-release-package.yml \
            backend-repo/src/main/resources/mapper/LogMapper.xml \
            backend-repo/src/test/java/com/zjcxph/imgapi/integration/mapper/LogMapperIT.java \
            release-baseline.json \
            vitepress-doc/internal/release.md; do
            if grep -Fxq "$path" <<< "$conflicts"; then
              git checkout --theirs -- "$path"
              git add "$path"
            fi
          done

          path=backend-repo/src/test/java/com/zjcxph/imgapi/integration/mapper/ScanMapperPostgresqlIT.java
          if grep -Fxq "$path" <<< "$conflicts"; then
            git checkout --ours -- "$path"
            git add "$path"
          fi

          remaining="$(git diff --name-only --diff-filter=U)"
          if [ -n "$remaining" ]; then
            echo "仍有未解决冲突：" >&2
            printf '%s\n' "$remaining" >&2
            exit 1
          fi

          if [ $merge_status -ne 0 ] && [ -z "$conflicts" ]; then
            echo "合并失败但未返回冲突文件" >&2
            exit 1
          fi

          git commit -m "合并：同步 main 的 0.6.1 与 Windows Nginx 发布更新"
          git push origin HEAD:feat/oss-migration-management-20260722

      - name: Report merge failure
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '合并最新 main 失败。冲突文件：'
            echo
            echo '```text'
            if [ -f /tmp/merge-conflicts.txt ]; then
              cat /tmp/merge-conflicts.txt
            else
              echo '合并步骤启动前失败。'
            fi
            echo '```'
          } > /tmp/comment.md
          gh api repos/${GITHUB_REPOSITORY}/issues/182/comments -f body="$(cat /tmp/comment.md)"
