name: 临时提交 OSS 上架号迁移实现

on:
  push:
    branches:
      - feat/oss-migration-management-20260722
    paths:
      - '.github/workflows/tmp-oss-route-implementation-v2.yml'

concurrency:
  group: oss-route-implementation
  cancel-in-progress: true

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/oss-migration-management-20260722

      - name: Extract implementation scripts
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          source = Path('.github/workflows/tmp-oss-route-implementation.yml').read_text(encoding='utf-8')

          def strip_workflow_indent(body: str) -> str:
              result = []
              inside_triple = False
              for line in body.splitlines():
                  normalized = line
                  if not inside_triple:
                      if normalized.startswith('          '):
                          normalized = normalized[10:]
                      if normalized.count("'''") % 2 == 1:
                          inside_triple = True
                  else:
                      if "'''" in normalized:
                          if normalized.startswith('          '):
                              normalized = normalized[10:]
                          if normalized.count("'''") % 2 == 1:
                              inside_triple = False
                  result.append(normalized)
              return '\n'.join(result) + '\n'

          def extract(start_name: str, end_name: str) -> str:
              pattern = re.compile(
                  rf"      - name: {re.escape(start_name)}\n"
                  rf"        shell: bash\n"
                  rf"        run: \|\n"
                  rf"(?P<body>.*?)(?=\n      - name: {re.escape(end_name)}\n)",
                  re.S,
              )
              match = pattern.search(source)
              if not match:
                  raise SystemExit(f'未找到原实施流程步骤：{start_name}')
              return strip_workflow_indent(match.group('body'))

          Path('/tmp/write-tests.sh').write_text(
              extract('写入新路线测试', '验证测试先失败'),
              encoding='utf-8',
          )
          Path('/tmp/implement.sh').write_text(
              extract('实施 Nginx 与上架号迁移路线', '后端完整验证'),
              encoding='utf-8',
          )
          PY

      - name: Apply tests and implementation
        id: apply
        shell: bash
        run: |
          set +e
          bash /tmp/write-tests.sh > /tmp/oss-route-apply.log 2>&1
          test_status=$?
          if [ $test_status -eq 0 ]; then
            bash /tmp/implement.sh >> /tmp/oss-route-apply.log 2>&1
            impl_status=$?
          else
            impl_status=1
          fi
          cat /tmp/oss-route-apply.log
          if [ $test_status -ne 0 ] || [ $impl_status -ne 0 ]; then
            exit 1
          fi

      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend-repo frontend-fantastic-admin vitepress-doc
          git commit -m "功能：按上架号实施 Nginx 到 OSS 迁移路线"
          git push origin HEAD:feat/oss-migration-management-20260722

      - name: Report failure
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo 'OSS 新迁移路线自动实施失败。最后日志：'
            echo
            echo '```text'
            if [ -f /tmp/oss-route-apply.log ]; then
              tail -n 120 /tmp/oss-route-apply.log
            else
              echo '实施脚本尚未生成日志，请检查脚本提取步骤。'
            fi
            echo '```'
          } > /tmp/comment.md
          gh api repos/${GITHUB_REPOSITORY}/issues/182/comments -f body="$(cat /tmp/comment.md)"
