name: Temporary statistics ECharts validation

on:
  push:
    branches:
      - feat/statistics-echarts-pages-20260715
  pull_request:
    branches:
      - dev-no-login

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend-fantastic-admin/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend-fantastic-admin
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: frontend-fantastic-admin
        run: pnpm lint:tsc

      - name: ESLint changed pages
        working-directory: frontend-fantastic-admin
        run: pnpm exec eslint src/views/statistics/index.vue src/views/records-statistics/index.vue --no-cache

      - name: Stylelint changed pages
        working-directory: frontend-fantastic-admin
        run: pnpm exec stylelint "src/views/{statistics,records-statistics}/index.vue" --no-cache

      - name: Build
        working-directory: frontend-fantastic-admin
        run: pnpm build
