name: 临时同步 main 0.6.2 到 OSS 页面分支

on:
  push:
    branches:
      - feat/oss-migration-management-20260722
    paths:
      - '.github/workflows/tmp-sync-main-062-oss-page.yml'

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/oss-migration-management-20260722
          fetch-depth: 0
      - name: Merge main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          set +e
          git merge --no-ff origin/main -m "合并：同步 main 0.6.2 到 OSS 迁移管理分支"
          status=$?
          set -e
          if [ $status -ne 0 ]; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            allowed='^(CHANGELOG.md|VERSION|backend-repo/pom.xml|release-baseline.json|release-notes/0\.6\.2\.md)$'
            for file in "${conflicts[@]}"; do
              if [[ ! "$file" =~ $allowed ]]; then
                echo "发现未知冲突：$file" >&2
                exit 1
              fi
              git checkout --theirs -- "$file"
              git add "$file"
            done
            git commit -m "合并：同步 main 0.6.2 到 OSS 迁移管理分支"
          fi
          git push origin HEAD:feat/oss-migration-management-20260722
