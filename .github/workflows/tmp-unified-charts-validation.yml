name: Temporary unified charts validation

on:
  push:
    branches:
      - feat/unified-echarts-system-20260714
  pull_request:
    branches:
      - dev-no-login

permissions:
  contents: write

jobs:
  validate-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/unified-echarts-system-20260714
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend-fantastic-admin/pnpm-lock.yaml

      - name: Extract unified chart sources
        run: |
          cat scripts/tmp-unified-charts-src.part-* | base64 --decode > /tmp/unified-charts-src.tar.gz
          tar -xzf /tmp/unified-charts-src.tar.gz -C .

      - name: Apply chart validation fixes
        run: |
          python <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              file = Path(path)
              content = file.read_text()
              if old not in content:
                  raise RuntimeError(f'Expected text was not found in {path}')
              file.write_text(content.replace(old, new))

          chart_path = 'frontend-fantastic-admin/src/components/charts/MrrChart.vue'
          replace(chart_path, '      ref="chartRef"\n', '      :ref="setChartRef"\n')
          replace(
              chart_path,
              "const { chartRef } = useMrrChart(\n  () => props.option,\n  () => props.loading,\n  { renderer: props.renderer },\n)\n",
              "const { chartRef } = useMrrChart(\n  () => props.option,\n  () => props.loading,\n  { renderer: props.renderer },\n)\n\nfunction setChartRef(element: unknown) {\n  chartRef.value = element instanceof HTMLElement ? element : null\n}\n",
          )
          replace(
              'frontend-fantastic-admin/src/composables/useMrrChart.ts',
              "import type { MaybeRefOrGetter } from 'vue'\nimport type { ECOption, EChartsType } from '@/plugins/echarts'\nimport type { UseMrrChartOptions } from '@/types/chart'\nimport {\n  nextTick,\n  onActivated,\n  onBeforeUnmount,\n  onDeactivated,\n  onMounted,\n  shallowRef,\n  toValue,\n  watch,\n} from 'vue'\nimport { useDebounceFn, useResizeObserver } from '@vueuse/core'\n",
              "import type { MaybeRefOrGetter } from 'vue'\nimport type { EChartsType, ECOption } from '@/plugins/echarts'\nimport type { UseMrrChartOptions } from '@/types/chart'\nimport { useDebounceFn, useResizeObserver } from '@vueuse/core'\nimport {\n  nextTick,\n  onActivated,\n  onBeforeUnmount,\n  onDeactivated,\n  onMounted,\n  shallowRef,\n  toValue,\n  watch,\n} from 'vue'\n",
          )
          replace(
              'frontend-fantastic-admin/src/plugins/echarts.ts',
              '  DataZoomComponentOption,\n  DatasetComponentOption,',
              '  DatasetComponentOption,\n  DataZoomComponentOption,',
          )
          replace(
              'frontend-fantastic-admin/src/plugins/echarts.ts',
              '  DataZoomComponent,\n  DatasetComponent,',
              '  DatasetComponent,\n  DataZoomComponent,',
          )
          replace(
              'frontend-fantastic-admin/src/components/charts/MrrChartCard.vue',
              '  overflow: hidden;\n  font-size: 12px;\n  color: var(--el-text-color-secondary);\n  text-overflow: ellipsis;',
              '  overflow: hidden;\n  text-overflow: ellipsis;\n  font-size: 12px;\n  color: var(--el-text-color-secondary);',
          )
          replace(
              'frontend-fantastic-admin/src/components/charts/MrrChartCard.vue',
              '  display: grid;\n  gap: 8px;\n  min-height: 220px;\n  place-content: center;\n  justify-items: center;',
              '  display: grid;\n  gap: 8px;\n  place-content: center;\n  justify-items: center;\n  min-height: 220px;',
          )
          replace(
              'frontend-fantastic-admin/src/views/audit-images/components/AuditAnalytics.vue',
              '  background: linear-gradient(\n    90deg,\n    var(--el-fill-color-light) 25%,\n    var(--el-fill-color-lighter) 37%,\n    var(--el-fill-color-light) 63%\n  );',
              '  background:\n    linear-gradient(\n      90deg,\n      var(--el-fill-color-light) 25%,\n      var(--el-fill-color-lighter) 37%,\n      var(--el-fill-color-light) 63%\n    );',
          )
          replace(
              'frontend-fantastic-admin/src/views/audit-images/components/AuditAnalytics.vue',
              '  display: grid;\n  gap: 8px;\n  min-height: 280px;\n  place-content: center;\n  justify-items: center;',
              '  display: grid;\n  gap: 8px;\n  place-content: center;\n  justify-items: center;\n  min-height: 280px;',
          )
          PY

      - name: Add ECharts dependency
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises'
          const path = 'frontend-fantastic-admin/package.json'
          const pkg = JSON.parse(await readFile(path, 'utf8'))
          pkg.dependencies = Object.fromEntries(
            Object.entries({ ...pkg.dependencies, echarts: '^6.0.0' })
              .sort(([left], [right]) => left.localeCompare(right)),
          )
          await writeFile(path, `${JSON.stringify(pkg, null, 2)}\n`, 'utf8')
          NODE

      - name: Install dependencies and update lockfile
        working-directory: frontend-fantastic-admin
        run: pnpm install --no-frozen-lockfile

      - name: Validate source and build
        id: validation
        shell: bash
        working-directory: frontend-fantastic-admin
        run: |
          set +e
          pnpm lint:tsc 2>&1 | tee /tmp/chart-tsc.log
          tsc_status=${PIPESTATUS[0]}
          pnpm exec eslint \
            src/plugins/echarts.ts \
            src/config/chart-theme.ts \
            src/composables/useMrrChart.ts \
            src/types/chart.ts \
            src/components/charts \
            src/views/response-analysis/components/ResponseTrendChart.vue \
            src/views/audit-images/components/AuditAnalytics.vue \
            --no-cache 2>&1 | tee /tmp/chart-eslint.log
          eslint_status=${PIPESTATUS[0]}
          pnpm exec stylelint \
            "src/components/charts/*.vue" \
            "src/views/response-analysis/components/ResponseTrendChart.vue" \
            "src/views/audit-images/components/AuditAnalytics.vue" \
            --no-cache 2>&1 | tee /tmp/chart-stylelint.log
          stylelint_status=${PIPESTATUS[0]}
          pnpm build 2>&1 | tee /tmp/chart-build.log
          build_status=${PIPESTATUS[0]}
          {
            echo "tsc_status=${tsc_status}"
            echo "eslint_status=${eslint_status}"
            echo "stylelint_status=${stylelint_status}"
            echo "build_status=${build_status}"
            echo
            echo "===== TSC ====="
            cat /tmp/chart-tsc.log
            echo
            echo "===== ESLINT ====="
            cat /tmp/chart-eslint.log
            echo
            echo "===== STYLELINT ====="
            cat /tmp/chart-stylelint.log
            echo
            echo "===== BUILD ====="
            cat /tmp/chart-build.log
          } > ../scripts/tmp-unified-charts-validation.log
          if (( tsc_status || eslint_status || stylelint_status || build_status )); then
            exit 1
          fi

      - name: Upload validation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unified-charts-validation
          path: scripts/tmp-unified-charts-validation.log
          if-no-files-found: error
          retention-days: 1

      - name: Verify patch whitespace
        if: success()
        run: git diff --check

      - name: Commit generated implementation
        if: success()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f scripts/tmp-unified-charts-validation.log
          git add frontend-fantastic-admin/package.json \
            frontend-fantastic-admin/pnpm-lock.yaml \
            frontend-fantastic-admin/src/plugins/echarts.ts \
            frontend-fantastic-admin/src/config/chart-theme.ts \
            frontend-fantastic-admin/src/composables/useMrrChart.ts \
            frontend-fantastic-admin/src/types/chart.ts \
            frontend-fantastic-admin/src/components/charts \
            frontend-fantastic-admin/src/views/response-analysis/components/ResponseTrendChart.vue \
            frontend-fantastic-admin/src/views/audit-images/components/AuditAnalytics.vue
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "feat(charts): unify reusable ECharts visualizations [skip ci]"
          git push origin HEAD:feat/unified-echarts-system-20260714
