name: 一次性验证 MRR 0.7.0 正式资产

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/verify-release-0.7.0-once.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RELEASE_VERSION: 0.7.0
      RELEASE_TAG: v0.7.0
      RELEASE_SHA: ce6ffbc2e7877fd2499f611d0976501e2188dad9
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Wait for published Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --json isDraft,isPrerelease,assets \
              --jq 'select((.isDraft == false) and (.isPrerelease == false)) | [.assets[].name] | index("MRR-v0.7.0.zip")' \
              | grep -qx '[0-9]\+'; then
              echo "正式 Release 和 Windows 资产已经出现"
              exit 0
            fi
            echo "等待正式资产：${attempt}/60"
            sleep 10
          done
          echo "等待 MRR-v0.7.0.zip 超时" >&2
          exit 1

      - name: Download official asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p official-release
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "MRR-v${RELEASE_VERSION}.zip" \
            --dir official-release
          test -s "official-release/MRR-v${RELEASE_VERSION}.zip"

      - name: Verify version, commit and embedded frontend
        shell: bash
        run: |
          set -euo pipefail
          python3 - "official-release/MRR-v${RELEASE_VERSION}.zip" "$RELEASE_VERSION" "$RELEASE_SHA" <<'PY'
          import json
          import sys
          import tempfile
          from pathlib import Path
          from zipfile import ZipFile

          package = Path(sys.argv[1])
          version = sys.argv[2]
          expected_sha = sys.argv[3]
          if package.stat().st_size < 100_000_000:
              raise SystemExit(f'正式包大小异常: {package.stat().st_size}')

          with ZipFile(package) as archive:
              names = archive.namelist()
              def unique(suffix: str) -> str:
                  matches = [name for name in names if name == suffix or name.endswith('/' + suffix)]
                  if len(matches) != 1:
                      raise SystemExit(f'{suffix} 数量异常: {matches}')
                  return matches[0]

              manifest_name = unique('manifest.json')
              version_name = unique('VERSION')
              unique('release-baseline.json')
              unique('SHA256SUMS')
              manifest = json.loads(archive.read(manifest_name).decode('utf-8-sig'))
              packaged_version = archive.read(version_name).decode('utf-8-sig').strip()
              if manifest.get('productVersion') != version or packaged_version != version:
                  raise SystemExit(f'版本不一致: {manifest.get("productVersion")}, {packaged_version}')
              if manifest.get('gitCommit') != expected_sha:
                  raise SystemExit(f'提交不一致: {manifest.get("gitCommit")} != {expected_sha}')

              jars = [name for name in names if name.lower().endswith('.jar') and '/backend/' in f'/{name}']
              if len(jars) != 1:
                  raise SystemExit(f'后端 JAR 数量异常: {jars}')
              with tempfile.TemporaryDirectory() as temp_dir:
                  jar_path = Path(temp_dir) / 'mrr.jar'
                  with archive.open(jars[0]) as source, jar_path.open('wb') as target:
                      while chunk := source.read(1024 * 1024):
                          target.write(chunk)
                  with ZipFile(jar_path) as jar:
                      jar_names = jar.namelist()
                      if jar_names.count('BOOT-INF/classes/static/index.html') != 1:
                          raise SystemExit('JAR 内嵌前端 index.html 缺失或重复')
                      if not any(name.startswith('BOOT-INF/classes/static/assets/') and not name.endswith('/') for name in jar_names):
                          raise SystemExit('JAR 内嵌前端 assets 缺失')

          print(json.dumps({
              'version': version,
              'tag': f'v{version}',
              'commit': expected_sha,
              'size': package.stat().st_size,
              'verified': True,
          }, ensure_ascii=False))
          PY

      - name: Remove verification workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/verify-release-0.7.0-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "发布：完成 0.7.0 正式资产验证"
          git push origin main
