name: 一次性验收 MRR 0.7.3 正式资产

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/verify-release-0.7.3-once.yml

permissions:
  contents: write
  actions: write

jobs:
  verify-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RELEASE_TAG: v0.7.3
      RELEASE_VERSION: 0.7.3
      STATUS_FILE: release-notes/0.7.3-verification-status.txt
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Record current release state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_sha="$(git rev-list -n 1 "${RELEASE_TAG}")"
          {
            printf 'checked_at=%s\n' "$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            printf 'release_tag=%s\n' "${RELEASE_TAG}"
            printf 'release_sha=%s\n\n' "${release_sha}"

            echo '[release]'
            gh release view "${RELEASE_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --json tagName,name,isDraft,isPrerelease,publishedAt,assets,body \
              --jq '{tagName,name,isDraft,isPrerelease,publishedAt,assets:[.assets[] | {name,size,downloadCount}],body}' \
              || true

            echo
            echo '[windows-release-package]'
            gh run list \
              --repo "${GITHUB_REPOSITORY}" \
              --workflow windows-release-package.yml \
              --commit "${release_sha}" \
              --limit 5 \
              --json databaseId,workflowName,status,conclusion,event,headSha,createdAt,updatedAt,url \
              || true

            echo
            echo '[standalone-jar-release]'
            gh run list \
              --repo "${GITHUB_REPOSITORY}" \
              --workflow standalone-jar-release.yml \
              --commit "${release_sha}" \
              --limit 5 \
              --json databaseId,workflowName,status,conclusion,event,headSha,createdAt,updatedAt,url \
              || true
          } > "${STATUS_FILE}"

          git add "${STATUS_FILE}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "诊断：记录 MRR 0.7.3 发布状态"
          git push origin main

      - name: Dispatch formal release builds
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_sha="$(git rev-list -n 1 "${RELEASE_TAG}")"

          dispatch_if_missing() {
            local workflow="$1"
            local active_or_successful
            active_or_successful="$(gh run list \
              --repo "${GITHUB_REPOSITORY}" \
              --workflow "${workflow}" \
              --commit "${release_sha}" \
              --limit 20 \
              --json status,conclusion \
              --jq '.[] | select(.status == "queued" or .status == "in_progress" or (.status == "completed" and .conclusion == "success")) | .status' \
              || true)"

            if [[ -z "${active_or_successful}" ]]; then
              echo "Dispatching ${workflow} at ${RELEASE_TAG}"
              gh workflow run "${workflow}" \
                --repo "${GITHUB_REPOSITORY}" \
                --ref "${RELEASE_TAG}"
            else
              echo "${workflow} already has an active or successful run for ${release_sha}"
            fi
          }

          dispatch_if_missing windows-release-package.yml
          dispatch_if_missing standalone-jar-release.yml

      - name: Recover and verify formal assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_sha="$(git rev-list -n 1 "${RELEASE_TAG}")"
          zip_name="MRR-v${RELEASE_VERSION}.zip"
          jar_name="MRR-v${RELEASE_VERSION}-standalone.jar"
          sha_name="${jar_name}.sha256"
          expected_assets=("${zip_name}" "${jar_name}" "${sha_name}")

          for attempt in $(seq 1 120); do
            if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
              assets="$(gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --json assets --jq '.assets[].name')"

              if ! grep -Fxq "${zip_name}" <<< "${assets}"; then
                run_id="$(gh run list \
                  --repo "${GITHUB_REPOSITORY}" \
                  --workflow windows-release-package.yml \
                  --commit "${release_sha}" \
                  --limit 10 \
                  --json databaseId,status \
                  --jq 'map(select(.status == "completed")) | .[0].databaseId // empty')"

                if [[ -n "${run_id}" ]]; then
                  rm -rf build/windows-asset-recovery
                  mkdir -p build/windows-asset-recovery
                  if gh run download "${run_id}" \
                    --repo "${GITHUB_REPOSITORY}" \
                    --name "${zip_name}" \
                    --dir build/windows-asset-recovery; then
                    zip_path="$(find build/windows-asset-recovery -type f -name "${zip_name}" | head -n 1)"
                    if [[ -n "${zip_path}" ]]; then
                      gh release upload "${RELEASE_TAG}" "${zip_path}" \
                        --repo "${GITHUB_REPOSITORY}" \
                        --clobber
                    fi
                  fi
                fi
              fi

              assets="$(gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --json assets --jq '.assets[].name')"
              missing=0
              for asset in "${expected_assets[@]}"; do
                if ! grep -Fxq "${asset}" <<< "${assets}"; then
                  missing=1
                fi
              done

              if [[ "${missing}" -eq 0 ]]; then
                body="$(gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --json body --jq '.body')"
                if ! grep -Fq 'MRR 0.7.3 发布说明' <<< "${body}"; then
                  gh release edit "${RELEASE_TAG}" \
                    --repo "${GITHUB_REPOSITORY}" \
                    --title "MRR ${RELEASE_TAG}" \
                    --notes-file release-notes/0.7.3.md
                  body="$(gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --json body --jq '.body')"
                fi
                grep -F 'MRR 0.7.3 发布说明' <<< "${body}"
                grep -F 'MRR-v0.7.3-standalone.jar' <<< "${body}"

                rm -rf build/release-verification
                mkdir -p build/release-verification
                gh release download "${RELEASE_TAG}" \
                  --repo "${GITHUB_REPOSITORY}" \
                  --pattern "${sha_name}" \
                  --dir build/release-verification
                grep -F "${jar_name}" "build/release-verification/${sha_name}"

                printf '%s\n' "${assets}"
                exit 0
              fi
            fi

            echo "等待 ${RELEASE_TAG} 正式资产 (${attempt}/120)..."
            sleep 15
          done

          echo "${RELEASE_TAG} 正式资产未在规定时间内完整生成" >&2
          exit 1

      - name: Remove verification task and diagnostic state
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/verify-release-0.7.3-once.yml "${STATUS_FILE}"
          git commit -m "发布：确认 MRR 0.7.3 正式资产"
          git push origin main
