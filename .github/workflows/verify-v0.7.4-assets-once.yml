name: 验收 MRR v0.7.4 正式资产（一次性）

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/verify-v0.7.4-assets-once.yml'

permissions:
  contents: write

concurrency:
  group: verify-mrr-v0.7.4-assets
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository == 'weepwood/MRR'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Wait for and verify Release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          REQUIRED=(
            'MRR-v0.7.4.zip'
            'MRR-v0.7.4-standalone.jar'
            'MRR-v0.7.4-standalone.jar.sha256'
          )

          verified='false'
          for attempt in $(seq 1 120); do
            if gh release view v0.7.4 --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
              ASSETS="$(gh release view v0.7.4 \
                --repo "${GITHUB_REPOSITORY}" \
                --json assets \
                --jq '.assets[].name')"
              missing='false'
              for asset in "${REQUIRED[@]}"; do
                if ! grep -Fx "${asset}" <<< "${ASSETS}" >/dev/null; then
                  missing='true'
                fi
              done
              if [[ "${missing}" == 'false' ]]; then
                verified='true'
                printf '%s\n' "${ASSETS}"
                break
              fi
            fi
            echo "Waiting for v0.7.4 assets (${attempt}/120)..."
            sleep 15
          done
          test "${verified}" = 'true'

          rm -rf build/release-verification
          mkdir -p build/release-verification
          gh release download v0.7.4 \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern 'MRR-v0.7.4-standalone.jar*' \
            --dir build/release-verification
          (
            cd build/release-verification
            sha256sum -c MRR-v0.7.4-standalone.jar.sha256
          )

          RELEASE_BODY="$(gh release view v0.7.4 \
            --repo "${GITHUB_REPOSITORY}" \
            --json body \
            --jq '.body')"
          grep -F '系统设置 → 帮助与文档' <<< "${RELEASE_BODY}" >/dev/null
          grep -F '单体 JAR 不再构建或内嵌 VitePress 文档' <<< "${RELEASE_BODY}" >/dev/null

      - name: Record successful verification and remove task
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git checkout -B main origin/main
          git rm .github/workflows/verify-v0.7.4-assets-once.yml
          git commit -m '发布：确认 MRR 0.7.4 正式资产'
          git push origin HEAD:main
