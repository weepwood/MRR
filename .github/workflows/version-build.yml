name: version-build

on:
  push:
    tags:
      - 'v*'
      - '*.*.*'
  release:
    types: [published]

# 确保持有上传 Release Assets 所需的写入权限
permissions:
  contents: write

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-fantastic-admin
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
        
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend-fantastic-admin/pnpm-lock.yaml
          
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
        
      - name: Build Frontend
        run: pnpm build
        
      - name: Upload Frontend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend-fantastic-admin/dist

  build-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-repo
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven
          
      - name: Build Backend
        run: mvn -B -ntp -DskipTests package
        
      - name: Upload Backend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend-repo/target/*.jar

  # --- 新增的上传 Assets 的 Job ---
  upload-release-assets:
    # 必须等待前端和后端编译成功后才执行
    needs: [build-frontend, build-backend]
    runs-on: ubuntu-latest
    # 仅在是由 tag 触发或者发布 release 时才运行
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download Frontend Artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend-dist # 下载到当前目录的 frontend-dist 文件夹下

      - name: Download Backend Artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: backend-jar # 下载到当前目录的 backend-jar 文件夹下

      - name: Zip Frontend Dist
        # Release Assets 最好是单文件压缩包，把前端的一堆静态文件打个 zip
        run: zip -r frontend-dist.zip frontend-dist/

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        # Action 会自动识别当前触发的 Tag 并关联到对应的 Release 上
        with:
          files: |
            frontend-dist.zip
            backend-jar/*.jar
        env:
          GITHUB_TOKEN: $ secrets.GITHUB_TOKEN 
