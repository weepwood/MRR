name: version-build

# Legacy manual diagnostics. Publishing is owned exclusively by Release.
on:
  workflow_dispatch:


permissions:
  contents: read

# 同一 ref 的重复触发只保留最新一次；tag 构建不互相取消，避免产出半成品。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend-fantastic-admin
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: frontend-fantastic-admin/.node-version
          cache: pnpm
          cache-dependency-path: frontend-fantastic-admin/pnpm-lock.yaml

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Frontend
        run: pnpm build

      # 该制品只用于同一次运行内跨 job 传递，1 天后自动回收：
      # 免费私有仓库的制品配额极小（500 MB），默认 90 天会把配额长期占满。
      - name: Upload Frontend Artifact
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend-fantastic-admin/dist
          retention-days: 1

  build-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend-repo
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build Backend
        run: bash ./mvnw -B -ntp -DskipTests package

      # 同上：仅跨 job 传递用，1 天回收。
      - name: Upload Backend Artifact
        uses: actions/upload-artifact@v7
        with:
          name: backend-jar
          path: backend-repo/target/*.jar
          retention-days: 1
