name: Windows release package

on:
  pull_request:
    branches:
      - main
    paths:
      - 'VERSION'
      - 'release-baseline.json'
      - 'scripts/release_baseline.py'
      - 'scripts/embed_frontend_in_jar.py'
      - 'scripts/tests/test_embed_frontend_in_jar.py'
      - 'backend-repo/**'
      - 'frontend-fantastic-admin/**'
      - 'vitepress-doc/**'
      - 'deploy/windows/**'
      - '.github/workflows/windows-release-package.yml'
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  issues: read
  pull-requests: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      NGINX_VERSION: 1.31.3
      WINSW_VERSION: 2.12.0

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: vitepress-doc/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@10.33.0 --activate

      - name: Validate release baseline
        shell: bash
        run: |
          set -euo pipefail
          python scripts/release_baseline.py validate

          PRODUCT_VERSION="$(tr -d '\r\n' < VERSION)"
          BUILD_TIME="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          if [[ "${GITHUB_REF}" == refs/tags/* ]] && [[ "${GITHUB_REF_NAME}" != "v${PRODUCT_VERSION}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match VERSION v${PRODUCT_VERSION}" >&2
            exit 1
          fi

          echo "PRODUCT_VERSION=${PRODUCT_VERSION}" >> "${GITHUB_ENV}"
          echo "MRR_GIT_COMMIT=${SOURCE_SHA}" >> "${GITHUB_ENV}"
          echo "MRR_BUILD_TIME=${BUILD_TIME}" >> "${GITHUB_ENV}"

      - name: Test static site JAR embedder
        run: python -m unittest scripts.tests.test_embed_frontend_in_jar

      - name: Validate deployment sources
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem deploy/windows -Filter *.ps1 -Recurse | ForEach-Object {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              $failed = $true
              Write-Error "PowerShell syntax error in $($_.FullName): $($errors -join '; ')"
            }
          }
          Get-ChildItem deploy/windows/services -Filter *.xml | ForEach-Object {
            try { [xml](Get-Content $_.FullName -Raw) | Out-Null }
            catch {
              $failed = $true
              Write-Error "Invalid XML in $($_.FullName): $($_.Exception.Message)"
            }
          }
          if ($failed) { exit 1 }

      - name: Download pinned Windows runtime
        shell: bash
        run: |
          set -euo pipefail
          RUNTIME_DIR="build/windows-runtime"
          DOWNLOAD_DIR="build/windows-runtime-download"
          NGINX_DISTRIBUTION="nginx/Windows-${NGINX_VERSION}"

          rm -rf "${RUNTIME_DIR}" "${DOWNLOAD_DIR}"
          mkdir -p "${RUNTIME_DIR}/nginx" "${RUNTIME_DIR}/winsw" "${DOWNLOAD_DIR}"

          curl --fail --location --retry 3 --proto '=https' --tlsv1.2 \
            "https://nginx.org/download/nginx-${NGINX_VERSION}.zip" \
            --output "${DOWNLOAD_DIR}/nginx.zip"
          unzip -q "${DOWNLOAD_DIR}/nginx.zip" -d "${DOWNLOAD_DIR}"
          cp -a "${DOWNLOAD_DIR}/nginx-${NGINX_VERSION}/." "${RUNTIME_DIR}/nginx/"

          curl --fail --location --retry 3 --proto '=https' --tlsv1.2 \
            "https://github.com/winsw/winsw/releases/download/v${WINSW_VERSION}/WinSW-x64.exe" \
            --output "${RUNTIME_DIR}/winsw/WinSW-x64.exe"
          curl --fail --location --retry 3 --proto '=https' --tlsv1.2 \
            "https://raw.githubusercontent.com/winsw/winsw/v${WINSW_VERSION}/LICENSE.txt" \
            --output "${RUNTIME_DIR}/winsw/LICENSE.txt"

          test -f "${RUNTIME_DIR}/nginx/nginx.exe"
          test -f "${RUNTIME_DIR}/nginx/conf/mime.types"
          test -f "${RUNTIME_DIR}/winsw/WinSW-x64.exe"

          cat > "${RUNTIME_DIR}/versions.json" <<EOF
          {
            "nginx": {
              "distribution": "${NGINX_DISTRIBUTION}",
              "version": "${NGINX_VERSION}",
              "source": "https://nginx.org/download/nginx-${NGINX_VERSION}.zip"
            },
            "winsw": {
              "version": "${WINSW_VERSION}",
              "source": "https://github.com/winsw/winsw/releases/download/v${WINSW_VERSION}/WinSW-x64.exe"
            }
          }
          EOF

          (
            cd "${RUNTIME_DIR}"
            find nginx winsw versions.json -type f -print0 \
              | sort -z \
              | xargs -0 sha256sum > SHA256SUMS
          )

      - name: Test and package backend
        working-directory: backend-repo
        run: mvn -B -Drevision="${PRODUCT_VERSION}" test package

      - name: Extract backend build identity
        shell: bash
        run: |
          set -euo pipefail
          BACKEND_JAR="$(find backend-repo/target -maxdepth 1 -type f -name '*.jar' ! -name '*.original' | head -n 1)"
          test -n "${BACKEND_JAR}"
          IDENTITY_DIR="build/backend-identity"
          mkdir -p "${IDENTITY_DIR}"
          unzip -l "${BACKEND_JAR}" > "${IDENTITY_DIR}/jar-entries.txt"
          unzip -p "${BACKEND_JAR}" META-INF/build-info.properties > "${IDENTITY_DIR}/build-info.properties" || true
          unzip -p "${BACKEND_JAR}" BOOT-INF/classes/git.properties > "${IDENTITY_DIR}/git.properties" || true
          printf 'source.sha=%s\njar.path=%s\n' "${SOURCE_SHA}" "${BACKEND_JAR}" > "${IDENTITY_DIR}/expected.properties"
          echo "BACKEND_JAR=${BACKEND_JAR}" >> "${GITHUB_ENV}"

      - name: Upload backend build identity
        uses: actions/upload-artifact@v4
        with:
          name: backend-build-identity
          path: build/backend-identity
          if-no-files-found: error
          retention-days: 7

      - name: Verify backend build identity
        shell: bash
        run: |
          set -euo pipefail
          BUILD_INFO="$(cat build/backend-identity/build-info.properties)"
          GIT_INFO="$(cat build/backend-identity/git.properties)"
          grep -F "build.version=${PRODUCT_VERSION}" <<< "${BUILD_INFO}"

          if grep -F "${SOURCE_SHA}" <<< "${GIT_INFO}"; then
            exit 0
          fi
          if grep -F "${SOURCE_SHA:0:7}" <<< "${GIT_INFO}"; then
            exit 0
          fi

          echo "Backend git.properties does not contain source commit ${SOURCE_SHA}" >&2
          printf '%s\n' "${GIT_INFO}" >&2
          exit 1

      - name: Test, build and embed frontend
        working-directory: frontend-fantastic-admin
        run: |
          pnpm install --frozen-lockfile
          pnpm lint:tsc
          pnpm test:run
          pnpm build
          grep -R --fixed-strings "${PRODUCT_VERSION}" dist >/dev/null
          grep -R --fixed-strings "${SOURCE_SHA}" dist >/dev/null
          python ../scripts/embed_frontend_in_jar.py embed \
            --jar "../${BACKEND_JAR}" \
            --dist dist
          python ../scripts/embed_frontend_in_jar.py verify \
            --jar "../${BACKEND_JAR}"

      - name: Build documentation
        shell: bash
        working-directory: vitepress-doc
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MRR_CHANGELOG_GITHUB: 'true'
          MRR_CHANGELOG_BASE_BRANCH: 'main'
        run: |
          set -euo pipefail
          {
            npm ci
            npm run docs:changelog:test
            npm run docs:build
            grep -R --fixed-strings "v${PRODUCT_VERSION}" .vitepress/dist-user >/dev/null
            grep -R --fixed-strings "v${PRODUCT_VERSION}" .vitepress/dist-internal >/dev/null
          } 2>&1 | tee docs-build.log

      - name: Embed documentation in backend JAR
        shell: bash
        run: |
          set -euo pipefail
          python scripts/embed_frontend_in_jar.py embed \
            --jar "${BACKEND_JAR}" \
            --dist vitepress-doc/.vitepress/dist-user \
            --mount docs
          python scripts/embed_frontend_in_jar.py embed \
            --jar "${BACKEND_JAR}" \
            --dist vitepress-doc/.vitepress/dist-internal \
            --mount docs/internal
          python scripts/embed_frontend_in_jar.py verify \
            --jar "${BACKEND_JAR}"
          python scripts/embed_frontend_in_jar.py verify \
            --jar "${BACKEND_JAR}" \
            --mount docs
          python scripts/embed_frontend_in_jar.py verify \
            --jar "${BACKEND_JAR}" \
            --mount docs/internal

      - name: Upload documentation build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: documentation-build-log
          path: vitepress-doc/docs-build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Assemble offline package
        id: package
        shell: bash
        run: |
          set -euo pipefail

          PACKAGE_DIR="build/windows-package"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            ARCHIVE="MRR-v${PRODUCT_VERSION}.zip"
          else
            ARCHIVE="MRR-v${PRODUCT_VERSION}-${SOURCE_SHA:0:8}.zip"
          fi

          rm -rf "${PACKAGE_DIR}"
          mkdir -p "${PACKAGE_DIR}/backend" "${PACKAGE_DIR}/frontend" \
                   "${PACKAGE_DIR}/docs/user" "${PACKAGE_DIR}/docs/internal" \
                   "${PACKAGE_DIR}/deploy/windows" "${PACKAGE_DIR}/runtime"

          cp "${BACKEND_JAR}" "${PACKAGE_DIR}/backend/mrr-backend.jar"
          cp -a frontend-fantastic-admin/dist/. "${PACKAGE_DIR}/frontend/"
          cp -a vitepress-doc/.vitepress/dist-user/. "${PACKAGE_DIR}/docs/user/"
          cp -a vitepress-doc/.vitepress/dist-internal/. "${PACKAGE_DIR}/docs/internal/"
          cp -a deploy/windows/. "${PACKAGE_DIR}/deploy/windows/"
          cp -a build/windows-runtime/. "${PACKAGE_DIR}/runtime/"
          cp VERSION release-baseline.json "${PACKAGE_DIR}/"

          test -f "${PACKAGE_DIR}/runtime/nginx/nginx.exe"
          test -f "${PACKAGE_DIR}/runtime/winsw/WinSW-x64.exe"
          test -f "${PACKAGE_DIR}/runtime/SHA256SUMS"
          test -f "${PACKAGE_DIR}/deploy/windows/nginxctl.ps1"
          test -f "${PACKAGE_DIR}/deploy/windows/nginx-control.cmd"
          python scripts/embed_frontend_in_jar.py verify \
            --jar "${PACKAGE_DIR}/backend/mrr-backend.jar"
          python scripts/embed_frontend_in_jar.py verify \
            --jar "${PACKAGE_DIR}/backend/mrr-backend.jar" \
            --mount docs
          python scripts/embed_frontend_in_jar.py verify \
            --jar "${PACKAGE_DIR}/backend/mrr-backend.jar" \
            --mount docs/internal

          python scripts/release_baseline.py manifest \
            --git-commit "${SOURCE_SHA}" \
            --build-time "${MRR_BUILD_TIME}" \
            --output "${PACKAGE_DIR}/manifest.json"

          if [ -f CHANGELOG.md ]; then
            cp CHANGELOG.md "${PACKAGE_DIR}/release-notes.md"
          else
            printf '# MRR v%s\n\nCommit: %s\n' "${PRODUCT_VERSION}" "${SOURCE_SHA}" > "${PACKAGE_DIR}/release-notes.md"
          fi

          (
            cd "${PACKAGE_DIR}"
            find backend frontend docs deploy runtime VERSION release-baseline.json manifest.json release-notes.md -type f -print0 \
              | sort -z \
              | xargs -0 sha256sum > SHA256SUMS
            zip -qr "../${ARCHIVE}" .
          )

          echo "archive=build/${ARCHIVE}" >> "${GITHUB_OUTPUT}"
          echo "archive_name=${ARCHIVE}" >> "${GITHUB_OUTPUT}"
          echo "version=${PRODUCT_VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.archive_name }}
          path: ${{ steps.package.outputs.archive }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "${{ steps.package.outputs.archive }}" \
            --title "MRR ${GITHUB_REF_NAME}" \
            --generate-notes
