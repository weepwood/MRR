name: Windows release package

on:
  pull_request:
    branches:
      - dev-no-login
    paths:
      - 'VERSION'
      - 'release-baseline.json'
      - 'scripts/release_baseline.py'
      - 'backend-repo/**'
      - 'frontend-fantastic-admin/**'
      - 'vitepress-doc/**'
      - 'deploy/windows/**'
      - '.github/workflows/windows-release-package.yml'
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  issues: read
  pull-requests: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: vitepress-doc/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@10.33.0 --activate

      - name: Validate release baseline
        shell: bash
        run: |
          set -euo pipefail
          python scripts/release_baseline.py validate

          PRODUCT_VERSION="$(tr -d '\r\n' < VERSION)"
          BUILD_TIME="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          if [[ "${GITHUB_REF}" == refs/tags/* ]] && [[ "${GITHUB_REF_NAME}" != "v${PRODUCT_VERSION}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match VERSION v${PRODUCT_VERSION}" >&2
            exit 1
          fi

          echo "PRODUCT_VERSION=${PRODUCT_VERSION}" >> "${GITHUB_ENV}"
          echo "MRR_GIT_COMMIT=${GITHUB_SHA}" >> "${GITHUB_ENV}"
          echo "MRR_BUILD_TIME=${BUILD_TIME}" >> "${GITHUB_ENV}"

      - name: Validate deployment sources
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem deploy/windows -Filter *.ps1 -Recurse | ForEach-Object {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              $failed = $true
              Write-Error "PowerShell syntax error in $($_.FullName): $($errors -join '; ')"
            }
          }
          Get-ChildItem deploy/windows/services -Filter *.xml | ForEach-Object {
            try { [xml](Get-Content $_.FullName -Raw) | Out-Null }
            catch {
              $failed = $true
              Write-Error "Invalid XML in $($_.FullName): $($_.Exception.Message)"
            }
          }
          if ($failed) { exit 1 }

      - name: Test and package backend
        working-directory: backend-repo
        run: mvn -B -Drevision="${PRODUCT_VERSION}" test package

      - name: Verify backend build identity
        shell: bash
        run: |
          set -euo pipefail
          BACKEND_JAR="$(find backend-repo/target -maxdepth 1 -type f -name '*.jar' ! -name '*.original' | head -n 1)"
          test -n "${BACKEND_JAR}"
          unzip -p "${BACKEND_JAR}" BOOT-INF/classes/META-INF/build-info.properties | grep -F "build.version=${PRODUCT_VERSION}"
          unzip -p "${BACKEND_JAR}" BOOT-INF/classes/git.properties | grep -F "git.commit.id=${GITHUB_SHA}"

      - name: Test and build frontend
        working-directory: frontend-fantastic-admin
        run: |
          pnpm install --frozen-lockfile
          pnpm lint:tsc
          pnpm test:run
          pnpm build
          grep -R --fixed-strings "${PRODUCT_VERSION}" dist >/dev/null
          grep -R --fixed-strings "${GITHUB_SHA}" dist >/dev/null

      - name: Build documentation
        working-directory: vitepress-doc
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MRR_CHANGELOG_GITHUB: 'true'
          MRR_CHANGELOG_BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          npm ci
          npm run docs:changelog:test
          npm run docs:build
          grep -R --fixed-strings "v${PRODUCT_VERSION}" .vitepress/dist-user >/dev/null
          grep -R --fixed-strings "v${PRODUCT_VERSION}" .vitepress/dist-internal >/dev/null

      - name: Assemble offline package
        id: package
        shell: bash
        run: |
          set -euo pipefail

          PACKAGE_DIR="build/windows-package"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            ARCHIVE="MRR-v${PRODUCT_VERSION}.zip"
          else
            ARCHIVE="MRR-v${PRODUCT_VERSION}-${GITHUB_SHA:0:8}.zip"
          fi

          rm -rf build
          mkdir -p "${PACKAGE_DIR}/backend" "${PACKAGE_DIR}/frontend" \
                   "${PACKAGE_DIR}/docs/user" "${PACKAGE_DIR}/docs/internal" \
                   "${PACKAGE_DIR}/deploy/windows"

          BACKEND_JAR="$(find backend-repo/target -maxdepth 1 -type f -name '*.jar' ! -name '*.original' | head -n 1)"
          test -n "${BACKEND_JAR}"
          cp "${BACKEND_JAR}" "${PACKAGE_DIR}/backend/mrr-backend.jar"
          cp -a frontend-fantastic-admin/dist/. "${PACKAGE_DIR}/frontend/"
          cp -a vitepress-doc/.vitepress/dist-user/. "${PACKAGE_DIR}/docs/user/"
          cp -a vitepress-doc/.vitepress/dist-internal/. "${PACKAGE_DIR}/docs/internal/"
          cp -a deploy/windows/. "${PACKAGE_DIR}/deploy/windows/"
          cp VERSION release-baseline.json "${PACKAGE_DIR}/"

          python scripts/release_baseline.py manifest \
            --git-commit "${GITHUB_SHA}" \
            --build-time "${MRR_BUILD_TIME}" \
            --output "${PACKAGE_DIR}/manifest.json"

          if [ -f CHANGELOG.md ]; then
            cp CHANGELOG.md "${PACKAGE_DIR}/release-notes.md"
          else
            printf '# MRR v%s\n\nCommit: %s\n' "${PRODUCT_VERSION}" "${GITHUB_SHA}" > "${PACKAGE_DIR}/release-notes.md"
          fi

          (
            cd "${PACKAGE_DIR}"
            find backend frontend docs deploy VERSION release-baseline.json manifest.json release-notes.md -type f -print0 \
              | sort -z \
              | xargs -0 sha256sum > SHA256SUMS
            zip -qr "../${ARCHIVE}" .
          )

          echo "archive=build/${ARCHIVE}" >> "${GITHUB_OUTPUT}"
          echo "archive_name=${ARCHIVE}" >> "${GITHUB_OUTPUT}"
          echo "version=${PRODUCT_VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.archive_name }}
          path: ${{ steps.package.outputs.archive }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "${{ steps.package.outputs.archive }}" \
            --title "MRR ${GITHUB_REF_NAME}" \
            --generate-notes
