name: Windows release package

on:
  pull_request:
    branches:
      - dev-no-login
    paths:
      - 'deploy/windows/**'
      - '.github/workflows/windows-release-package.yml'
      - 'backend-repo/src/main/resources/application.properties'
      - 'vitepress-doc/.vitepress/config.full.mts'
      - 'vitepress-doc/internal/windows-deployment.md'
  workflow_dispatch:
    inputs:
      version:
        description: Product version, for example v0.1.2
        required: true
        type: string
      database_schema_version:
        description: Flyway/database schema version
        required: true
        default: V0
        type: string
      database_backward_compatible:
        description: Whether the previous application version can use the upgraded database
        required: true
        default: true
        type: boolean
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows-sandbox:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test backup, verification, restore and runtime manifests
        shell: pwsh
        run: ./deploy/windows/tests/backup-restore-sandbox.ps1

  build:
    needs: windows-sandbox
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NGINX_VERSION: 1.30.4
      WINSW_VERSION: 2.12.0

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: vitepress-doc/package-lock.json

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@10.33.0 --activate

      - name: Validate deployment sources
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem deploy/windows -Filter *.ps1 -Recurse | ForEach-Object {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              $failed = $true
              Write-Error "PowerShell syntax error in $($_.FullName): $($errors -join '; ')"
            }
          }
          Get-ChildItem deploy/windows/services -Filter *.xml | ForEach-Object {
            try { [xml](Get-Content $_.FullName -Raw) | Out-Null }
            catch {
              $failed = $true
              Write-Error "Invalid XML in $($_.FullName): $($_.Exception.Message)"
            }
          }
          if ($failed) { exit 1 }

      - name: Test and package backend
        working-directory: backend-repo
        run: mvn -B test package

      - name: Test and build frontend
        working-directory: frontend-fantastic-admin
        run: |
          pnpm install --frozen-lockfile
          pnpm lint:tsc
          pnpm test:run
          pnpm build

      - name: Build documentation
        working-directory: vitepress-doc
        run: |
          npm install
          npm run docs:build

      - name: Download and verify offline Windows runtime
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          runtime="deploy/windows/runtime"
          work="${RUNNER_TEMP}/mrr-runtime"
          rm -rf "$work" "$runtime/jdk" "$runtime/nginx" "$runtime/winsw"
          mkdir -p "$work" "$runtime/jdk" "$runtime/nginx" "$runtime/winsw"

          echo 'Downloading Eclipse Temurin JDK 21...'
          curl -fsSL --retry 3 \
            'https://api.adoptium.net/v3/assets/latest/21/hotspot?architecture=x64&image_type=jdk&os=windows&vendor=eclipse' \
            -o "$work/temurin.json"
          java_url="$(jq -r '.[0].binary.package.link' "$work/temurin.json")"
          java_sha="$(jq -r '.[0].binary.package.checksum' "$work/temurin.json")"
          java_version="$(jq -r '.[0].version_data.semver' "$work/temurin.json")"
          test -n "$java_url" && test "$java_url" != null
          test -n "$java_sha" && test "$java_sha" != null
          curl -fsSL --retry 3 "$java_url" -o "$work/temurin.zip"
          echo "$java_sha  $work/temurin.zip" | sha256sum -c -
          unzip -q "$work/temurin.zip" -d "$work/temurin"
          java_root="$(find "$work/temurin" -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          test -n "$java_root"
          cp -a "$java_root/." "$runtime/jdk/"
          test -f "$runtime/jdk/bin/java.exe"
          test -f "$runtime/jdk/bin/jcmd.exe"

          echo "Downloading nginx/Windows ${NGINX_VERSION}..."
          nginx_url="https://nginx.org/download/nginx-${NGINX_VERSION}.zip"
          curl -fsSL --retry 3 "$nginx_url" -o "$work/nginx.zip"
          curl -fsSL --retry 3 "$nginx_url.asc" -o "$work/nginx.zip.asc"
          export GNUPGHOME="$work/gnupg"
          mkdir -m 700 -p "$GNUPGHOME"
          for key in arut pluknet sb thresh nginx_signing; do
            curl -fsSL --retry 3 "https://nginx.org/keys/${key}.key" -o "$work/${key}.key"
            gpg --batch --import "$work/${key}.key"
          done
          gpg --batch --verify "$work/nginx.zip.asc" "$work/nginx.zip"
          unzip -q "$work/nginx.zip" -d "$work/nginx"
          nginx_root="$(find "$work/nginx" -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          test -n "$nginx_root"
          cp -a "$nginx_root/." "$runtime/nginx/"
          test -f "$runtime/nginx/nginx.exe"
          test -f "$runtime/nginx/conf/mime.types"

          echo "Downloading WinSW ${WINSW_VERSION}..."
          curl -fsSL --retry 3 \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/winsw/winsw/releases/tags/v${WINSW_VERSION}" \
            -o "$work/winsw-release.json"
          winsw_url="$(jq -r '.assets[] | select(.name == "WinSW-x64.exe") | .browser_download_url' "$work/winsw-release.json")"
          winsw_digest="$(jq -r '.assets[] | select(.name == "WinSW-x64.exe") | .digest // empty' "$work/winsw-release.json")"
          test -n "$winsw_url"
          curl -fsSL --retry 3 "$winsw_url" -o "$runtime/winsw/WinSW-x64.exe"
          if [[ "$winsw_digest" == sha256:* ]]; then
            winsw_sha="${winsw_digest#sha256:}"
            echo "$winsw_sha  $runtime/winsw/WinSW-x64.exe" | sha256sum -c -
            winsw_verification='GitHub release asset SHA-256 digest'
          else
            winsw_sha="$(sha256sum "$runtime/winsw/WinSW-x64.exe" | awk '{print $1}')"
            winsw_verification='Pinned official GitHub release URL; digest recorded in package manifest'
          fi

          nginx_sha="$(sha256sum "$work/nginx.zip" | awk '{print $1}')"
          java_exe_sha="$(sha256sum "$runtime/jdk/bin/java.exe" | awk '{print $1}')"
          jcmd_exe_sha="$(sha256sum "$runtime/jdk/bin/jcmd.exe" | awk '{print $1}')"
          nginx_exe_sha="$(sha256sum "$runtime/nginx/nginx.exe" | awk '{print $1}')"
          mime_types_sha="$(sha256sum "$runtime/nginx/conf/mime.types" | awk '{print $1}')"
          cat > "$runtime/runtime-manifest.json" <<JSON
          {
            "generatedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "architecture": "windows-x64",
            "java": {
              "distribution": "Eclipse Temurin",
              "version": "$java_version",
              "sha256": "$java_sha",
              "verification": "Adoptium API checksum"
            },
            "nginx": {
              "version": "$NGINX_VERSION",
              "sha256": "$nginx_sha",
              "verification": "nginx.org detached PGP signature"
            },
            "winsw": {
              "version": "$WINSW_VERSION",
              "sha256": "$winsw_sha",
              "verification": "$winsw_verification"
            },
            "files": {
              "jdk/bin/java.exe": "$java_exe_sha",
              "jdk/bin/jcmd.exe": "$jcmd_exe_sha",
              "nginx/nginx.exe": "$nginx_exe_sha",
              "nginx/conf/mime.types": "$mime_types_sha",
              "winsw/WinSW-x64.exe": "$winsw_sha"
            }
          }
          JSON

          pwsh -NoProfile -File "$runtime/verify-runtime.ps1" -RuntimeRoot "$runtime"

      - name: Assemble offline package
        id: package
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_SCHEMA_VERSION: ${{ inputs.database_schema_version }}
          INPUT_DB_COMPATIBLE: ${{ inputs.database_backward_compatible }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          if [ -n "${INPUT_VERSION:-}" ]; then
            VERSION="${INPUT_VERSION}"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="pr-${PR_NUMBER:-manual}-${GITHUB_SHA:0:8}"
          fi
          SCHEMA_VERSION="${INPUT_SCHEMA_VERSION:-V0}"
          DB_COMPATIBLE="${INPUT_DB_COMPATIBLE:-true}"
          COMMIT="${GITHUB_SHA}"
          BUILD_TIME="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          PACKAGE_DIR="build/windows-package"
          ARCHIVE="MRR-${VERSION}.zip"

          rm -rf build
          mkdir -p "${PACKAGE_DIR}/backend" "${PACKAGE_DIR}/frontend" \
                   "${PACKAGE_DIR}/docs/user" "${PACKAGE_DIR}/docs/internal" \
                   "${PACKAGE_DIR}/deploy/windows"

          BACKEND_JAR="$(find backend-repo/target -maxdepth 1 -type f -name '*.jar' ! -name '*.original' | head -n 1)"
          test -n "${BACKEND_JAR}"
          cp "${BACKEND_JAR}" "${PACKAGE_DIR}/backend/mrr-backend.jar"
          cp -a frontend-fantastic-admin/dist/. "${PACKAGE_DIR}/frontend/"
          cp -a vitepress-doc/.vitepress/dist-user/. "${PACKAGE_DIR}/docs/user/"
          cp -a vitepress-doc/.vitepress/dist-internal/. "${PACKAGE_DIR}/docs/internal/"
          cp -a deploy/windows/. "${PACKAGE_DIR}/deploy/windows/"

          python - <<PY
          import json
          from pathlib import Path
          manifest = {
              "productVersion": "${VERSION}",
              "gitCommit": "${COMMIT}",
              "buildTime": "${BUILD_TIME}",
              "databaseSchemaVersion": "${SCHEMA_VERSION}",
              "databaseBackwardCompatible": "${DB_COMPATIBLE}".lower() == "true",
              "deploymentMode": "single-server",
              "bundledRuntime": True
          }
          Path("${PACKAGE_DIR}/manifest.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8"
          )
          PY

          if [ -f CHANGELOG.md ]; then
            cp CHANGELOG.md "${PACKAGE_DIR}/release-notes.md"
          else
            printf '# MRR %s\n\nCommit: %s\n\nWindows 单服务器离线包，已包含 Java 21、Nginx 和 WinSW。\n' \
              "${VERSION}" "${COMMIT}" > "${PACKAGE_DIR}/release-notes.md"
          fi

          (
            cd "${PACKAGE_DIR}"
            find backend frontend docs deploy manifest.json release-notes.md -type f -print0 \
              | sort -z \
              | xargs -0 sha256sum > SHA256SUMS
            zip -qr "../${ARCHIVE}" .
          )

          echo "archive=build/${ARCHIVE}" >> "${GITHUB_OUTPUT}"
          echo "archive_name=${ARCHIVE}" >> "${GITHUB_OUTPUT}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.archive_name }}
          path: ${{ steps.package.outputs.archive }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "${{ steps.package.outputs.archive }}" \
            --title "MRR ${GITHUB_REF_NAME}" \
            --generate-notes
