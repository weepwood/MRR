name: Windows release package

on:
  workflow_call:
    inputs:
      full:
        type: boolean
        default: true
      browser_tests:
        type: boolean
        default: false
      retain_candidate:
        type: boolean
        default: false
    outputs:
      artifact:
        value: ${{ jobs.build.outputs.artifact }}
      attempt:
        value: ${{ jobs.build.outputs.attempt }}
  workflow_dispatch:
    inputs:
      full:
        type: boolean
        default: true
      retain_candidate:
        type: boolean
        default: false

# Candidate validation may execute PR code. Publishing is a separate main-only job.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      artifact: ${{ steps.candidate.outputs.artifact }}
      attempt: ${{ steps.candidate.outputs.attempt }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: imgapi
          POSTGRES_USER: imgapi
          POSTGRES_PASSWORD: imgapi
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U imgapi -d imgapi"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      FULL: ${{ inputs.full }}
      SOURCE_SHA: ${{ github.sha }}
      MRR_TEST_POSTGRES_URL: jdbc:postgresql://localhost:5432/imgapi
      MRR_TEST_POSTGRES_USERNAME: imgapi
      MRR_TEST_POSTGRES_PASSWORD: imgapi
      NGINX_VERSION: 1.31.8
      WINSW_VERSION: 2.12.0
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend-fantastic-admin/.node-version
          cache: pnpm
          cache-dependency-path: frontend-fantastic-admin/pnpm-lock.yaml
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/cache@v6
        if: inputs.full
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-vitepress-${{ hashFiles('vitepress-doc/package-lock.json') }}
          restore-keys: ${{ runner.os }}-npm-vitepress-
      - name: Validate repository and frozen release identity
        shell: bash
        run: |
          set -euo pipefail
          if [ "${FULL}" = true ]; then python -m unittest discover -s scripts/tests -p 'test_*.py' -v; fi
          python scripts/test_inventory.py --fail-on-focused
          python scripts/release_baseline.py validate
          python scripts/check_main_branch_references.py
          python scripts/check_engineering_docs.py
          test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"
          echo "PRODUCT_VERSION=$(tr -d '\r\n' < VERSION)" >> "${GITHUB_ENV}"
          echo "MRR_GIT_COMMIT=${SOURCE_SHA}" >> "${GITHUB_ENV}"
          echo "MRR_BUILD_TIME=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "${GITHUB_ENV}"
      - name: Validate deployment sources
        if: inputs.full
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem deploy/windows -Filter *.ps1 -Recurse | ForEach-Object {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) { $failed = $true; Write-Error "PowerShell syntax error: $($_.Name)" }
          }
          Get-ChildItem deploy/windows/services -Filter *.xml | ForEach-Object {
            try { [xml](Get-Content $_.FullName -Raw) | Out-Null } catch { $failed = $true }
          }
          if ($failed) { exit 1 }
      - name: Test and package backend once
        working-directory: backend-repo
        run: |
          bash ./mvnw -B -ntp -Drevision="${PRODUCT_VERSION}" clean verify -Dlocal.config.exclude=true
          python ../scripts/check_test_execution.py --reports target/failsafe-reports
          if [ "${FULL}" = true ]; then
            python ../scripts/jacoco_coverage.py --xml target/site/jacoco/jacoco.xml --baseline ../quality/coverage-baseline.json --fail-on-regression --github-summary "${GITHUB_STEP_SUMMARY}"
            python ../scripts/jacoco_coverage.py --xml target/site/jacoco-combined/jacoco.xml --baseline ../quality/coverage-baseline.json --fail-on-regression
          fi
      - name: Verify backend build identity
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t JARS < <(find backend-repo/target -maxdepth 1 -type f -name '*.jar')
          test "${#JARS[@]}" = 1
          BACKEND_JAR="${JARS[0]}"
          unzip -p "${BACKEND_JAR}" META-INF/build-info.properties | grep -F "build.version=${PRODUCT_VERSION}"
          unzip -p "${BACKEND_JAR}" BOOT-INF/classes/git.properties > backend-git.properties
          grep -F "${SOURCE_SHA}" backend-git.properties || grep -F "${SOURCE_SHA:0:7}" backend-git.properties
          echo "BACKEND_JAR=${BACKEND_JAR}" >> "${GITHUB_ENV}"
      - name: Coverage evidence for optional manual reports
        if: always() && inputs.full
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: backend-integration-test-reports
          path: |
            backend-repo/target/site/jacoco
            backend-repo/target/site/jacoco-combined
          retention-days: 3
          if-no-files-found: ignore
      - name: Test, build and embed frontend
        working-directory: frontend-fantastic-admin
        run: |
          pnpm install --frozen-lockfile
          pnpm lint:tsc
          if [ "${FULL}" = true ]; then
            pnpm test:coverage
            python ../scripts/vitest_coverage.py --summary coverage/coverage-summary.json --baseline ../quality/frontend-coverage-baseline.json --fail-on-regression --github-summary "${GITHUB_STEP_SUMMARY}"
          else
            pnpm test:run
          fi
          pnpm build
          pnpm test:compat:chrome86
          grep -R --fixed-strings "${PRODUCT_VERSION}" dist >/dev/null
          grep -R --fixed-strings "${SOURCE_SHA}" dist >/dev/null
          python ../scripts/embed_frontend_in_jar.py embed --jar "../${BACKEND_JAR}" --dist dist
          python ../scripts/embed_frontend_in_jar.py verify --jar "../${BACKEND_JAR}"
      - name: Full browser tests
        working-directory: frontend-fantastic-admin
        env:
          BROWSER_TESTS: ${{ inputs.browser_tests }}
        run: |
          pnpm exec playwright install --with-deps chromium
          if [ "${FULL}" = true ] || [ "${BROWSER_TESTS}" = true ]; then pnpm test:e2e; fi
      - name: Build standalone JAR from the same verified backend
        if: inputs.full
        id: standalone
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/release-assets
          JAR_NAME="MRR-v${PRODUCT_VERSION}-standalone.jar"
          python scripts/build_standalone_jar.py build --source "${BACKEND_JAR}" --output "build/release-assets/${JAR_NAME}" --default-port 8002
          python scripts/build_standalone_jar.py verify --jar "build/release-assets/${JAR_NAME}" --default-port 8002
          (cd build/release-assets && sha256sum "${JAR_NAME}" > "${JAR_NAME}.sha256")
          echo "jar_name=${JAR_NAME}" >> "${GITHUB_OUTPUT}"
      - name: Real login, import, query and refusal against the production candidate JAR
        env:
          STANDALONE: ${{ steps.standalone.outputs.jar_name }}
        run: |
          JAR="${BACKEND_JAR}"
          if [ "${FULL}" = true ]; then JAR="build/release-assets/${STANDALONE}"; fi
          python -m scripts.run_live_e2e --jar "${JAR}" --embedded
      - name: Build documentation for external hosting
        if: inputs.full
        working-directory: vitepress-doc
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MRR_CHANGELOG_GITHUB: 'true'
          MRR_CHANGELOG_BASE_BRANCH: main
        run: |
          npm ci
          npm run docs:changelog:test
          npm run docs:build
          grep -R --fixed-strings "v${PRODUCT_VERSION}" .vitepress/dist-user >/dev/null
          grep -R --fixed-strings "v${PRODUCT_VERSION}" .vitepress/dist-internal >/dev/null
      - name: Download pinned Windows runtime
        if: inputs.full
        shell: bash
        run: |
          set -euo pipefail
          RUNTIME_DIR=build/windows-runtime
          DOWNLOAD_DIR=build/windows-runtime-download
          NGINX_DISTRIBUTION="nginx/Windows-${NGINX_VERSION}"
          mkdir -p "${RUNTIME_DIR}/nginx" "${RUNTIME_DIR}/winsw" "${DOWNLOAD_DIR}"
          curl --fail --location --retry 3 --proto '=https' --tlsv1.2 "https://nginx.org/download/nginx-${NGINX_VERSION}.zip" --output "${DOWNLOAD_DIR}/nginx.zip"
          unzip -q "${DOWNLOAD_DIR}/nginx.zip" -d "${DOWNLOAD_DIR}"
          cp -a "${DOWNLOAD_DIR}/nginx-${NGINX_VERSION}/." "${RUNTIME_DIR}/nginx/"
          curl --fail --location --retry 3 --proto '=https' --tlsv1.2 "https://github.com/winsw/winsw/releases/download/v${WINSW_VERSION}/WinSW-x64.exe" --output "${RUNTIME_DIR}/winsw/WinSW-x64.exe"
          curl --fail --location --retry 3 --proto '=https' --tlsv1.2 "https://raw.githubusercontent.com/winsw/winsw/v${WINSW_VERSION}/LICENSE.txt" --output "${RUNTIME_DIR}/winsw/LICENSE.txt"
          printf '{"nginx":{"distribution":"%s","version":"%s"},"winsw":{"version":"%s"}}\n' "${NGINX_DISTRIBUTION}" "${NGINX_VERSION}" "${WINSW_VERSION}" > "${RUNTIME_DIR}/versions.json"
          (cd "${RUNTIME_DIR}" && find nginx winsw versions.json -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
      - name: Assemble offline package
        if: inputs.full
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE_DIR=build/windows-package
          mkdir -p "${PACKAGE_DIR}/backend" "${PACKAGE_DIR}/frontend" "${PACKAGE_DIR}/docs/user" "${PACKAGE_DIR}/docs/internal" "${PACKAGE_DIR}/deploy/windows" "${PACKAGE_DIR}/runtime"
          cp "${BACKEND_JAR}" "${PACKAGE_DIR}/backend/mrr-backend.jar"
          cp -a frontend-fantastic-admin/dist/. "${PACKAGE_DIR}/frontend/"
          cp -a vitepress-doc/.vitepress/dist-user/. "${PACKAGE_DIR}/docs/user/"
          cp -a vitepress-doc/.vitepress/dist-internal/. "${PACKAGE_DIR}/docs/internal/"
          cp -a deploy/windows/. "${PACKAGE_DIR}/deploy/windows/"
          cp -a build/windows-runtime/. "${PACKAGE_DIR}/runtime/"
          cp VERSION release-baseline.json "${PACKAGE_DIR}/"
          cp "release-notes/${PRODUCT_VERSION}.md" "${PACKAGE_DIR}/release-notes.md"
          test -f "${PACKAGE_DIR}/runtime/nginx/nginx.exe"
          test -f "${PACKAGE_DIR}/runtime/winsw/WinSW-x64.exe"
          test -f "${PACKAGE_DIR}/runtime/SHA256SUMS"
          test -f "${PACKAGE_DIR}/docs/user/index.html"
          test -f "${PACKAGE_DIR}/docs/internal/index.html"
          python scripts/embed_frontend_in_jar.py verify --jar "${PACKAGE_DIR}/backend/mrr-backend.jar"
          python scripts/release_baseline.py manifest --git-commit "${SOURCE_SHA}" --build-time "${MRR_BUILD_TIME}" --output "${PACKAGE_DIR}/manifest.json"
          (cd "${PACKAGE_DIR}" && find backend frontend docs deploy runtime VERSION release-baseline.json manifest.json release-notes.md -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          (cd "${PACKAGE_DIR}" && sha256sum -c SHA256SUMS >/dev/null && zip -qr "../release-assets/MRR-v${PRODUCT_VERSION}.zip" .)
      - name: Bind verified files to this commit and build attempt
        if: inputs.full
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          python -m scripts.release_candidate manifest --directory build/release-assets
          python -m scripts.release_candidate verify --directory build/release-assets
          echo "artifact=release-candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${SOURCE_SHA}" >> "${GITHUB_OUTPUT}"
          echo "attempt=${GITHUB_RUN_ATTEMPT}" >> "${GITHUB_OUTPUT}"
      - name: Share candidate files only with this verification/publishing run
        if: inputs.full && inputs.retain_candidate
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.candidate.outputs.artifact }}
          path: build/release-assets
          retention-days: 1
          if-no-files-found: error
      - name: Share only the candidate JAR and identity for Windows dry-run validation
        if: inputs.full && !inputs.retain_candidate
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.candidate.outputs.artifact }}
          path: |
            build/release-assets/*.jar
            build/release-assets/release-candidate.json
          retention-days: 1
          if-no-files-found: error
