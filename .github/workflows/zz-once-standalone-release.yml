name: 一次性应用单体 JAR 发布流程

on:
  push:
    branches:
      - feat/release-standalone-jar-20260723
    paths:
      - '.github/workflows/zz-once-standalone-release.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/release-standalone-jar-20260723
          fetch-depth: 0

      - name: 修改发布流程和文档
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          workflow_path = Path('.github/workflows/windows-release-package.yml')
          workflow = workflow_path.read_text(encoding='utf-8')

          path_marker = "      - 'scripts/embed_frontend_in_jar.py'\n"
          path_replacement = (
              path_marker
              + "      - 'scripts/build_standalone_jar.py'\n"
              + "      - 'scripts/tests/test_build_standalone_jar.py'\n"
          )
          if workflow.count(path_marker) != 1:
              raise SystemExit('无法定位工作流路径过滤位置')
          workflow = workflow.replace(path_marker, path_replacement, 1)

          frontend_marker = '''          python ../scripts/embed_frontend_in_jar.py verify \\
            --jar "../${BACKEND_JAR}"

      - name: Build documentation
'''
          standalone_step = '''          python ../scripts/embed_frontend_in_jar.py verify \\
            --jar "../${BACKEND_JAR}"

      - name: Build standalone JAR
        id: standalone
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest scripts.tests.test_build_standalone_jar

          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            STANDALONE_NAME="MRR-v${PRODUCT_VERSION}-standalone.jar"
          else
            STANDALONE_NAME="MRR-v${PRODUCT_VERSION}-${SOURCE_SHA:0:8}-standalone.jar"
          fi
          STANDALONE_PATH="build/${STANDALONE_NAME}"

          python scripts/build_standalone_jar.py build \\
            --source "${BACKEND_JAR}" \\
            --output "${STANDALONE_PATH}" \\
            --default-port 8002
          python scripts/build_standalone_jar.py verify \\
            --jar "${STANDALONE_PATH}" \\
            --default-port 8002
          unzip -p "${STANDALONE_PATH}" BOOT-INF/classes/application.properties \\
            | grep -F 'server.port=${SERVER_PORT:8002}'

          echo "jar=${STANDALONE_PATH}" >> "${GITHUB_OUTPUT}"
          echo "jar_name=${STANDALONE_NAME}" >> "${GITHUB_OUTPUT}"

      - name: Build documentation
'''
          if workflow.count(frontend_marker) != 1:
              raise SystemExit('无法定位前端内嵌步骤')
          workflow = workflow.replace(frontend_marker, standalone_step, 1)

          upload_marker = '''      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
'''
          upload_replacement = '''      - name: Upload standalone JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.standalone.outputs.jar_name }}
          path: ${{ steps.standalone.outputs.jar }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
'''
          if workflow.count(upload_marker) != 1:
              raise SystemExit('无法定位 Release 发布步骤')
          workflow = workflow.replace(upload_marker, upload_replacement, 1)

          release_marker = '''          gh release create "${GITHUB_REF_NAME}" \\
            "${{ steps.package.outputs.archive }}" \\
            --title "MRR ${GITHUB_REF_NAME}" \\
'''
          release_replacement = '''          gh release create "${GITHUB_REF_NAME}" \\
            "${{ steps.package.outputs.archive }}" \\
            "${{ steps.standalone.outputs.jar }}" \\
            --title "MRR ${GITHUB_REF_NAME}" \\
'''
          if workflow.count(release_marker) != 1:
              raise SystemExit('无法定位 Release 资产参数')
          workflow = workflow.replace(release_marker, release_replacement, 1)
          workflow_path.write_text(workflow, encoding='utf-8')

          readme_path = Path('README.md')
          readme = readme_path.read_text(encoding='utf-8')
          readme_marker = '详细步骤见 [Windows Server 部署](vitepress-doc/internal/windows-deployment.md)。\n'
          readme_replacement = readme_marker + '''
正式 GitHub Release 同时提供：

- `MRR-vX.Y.Z.zip`：包含 Nginx、WinSW、文档和运维脚本的 Windows 离线包；
- `MRR-vX.Y.Z-standalone.jar`：前端已内嵌、默认监听 `8002` 的直接运行版本。

单体 JAR 仍需通过环境变量或外部参数提供 PostgreSQL、JWT、AES、图片源和 OSS 等配置；可使用 `SERVER_PORT` 覆盖默认端口。
'''
          if readme.count(readme_marker) != 1:
              raise SystemExit('无法定位 README 部署说明')
          readme_path.write_text(readme.replace(readme_marker, readme_replacement, 1), encoding='utf-8')

          changelog_path = Path('CHANGELOG.md')
          changelog = changelog_path.read_text(encoding='utf-8')
          changelog_marker = '## [Unreleased]\n\n'
          changelog_replacement = '''## [Unreleased]

### 变更

- 正式 GitHub Release 除 Windows 离线 ZIP 外，同时发布前端内嵌、默认端口为 `8002` 的单体 JAR。

'''
          if changelog.count(changelog_marker) != 1:
              raise SystemExit('无法定位更新日志 Unreleased 区域')
          changelog_path.write_text(
              changelog.replace(changelog_marker, changelog_replacement, 1),
              encoding='utf-8',
          )
          PY

          python -m unittest scripts.tests.test_build_standalone_jar
          rm -f .github/workflows/zz-once-standalone-release.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/windows-release-package.yml README.md CHANGELOG.md \
            scripts/build_standalone_jar.py scripts/tests/test_build_standalone_jar.py \
            .github/workflows/zz-once-standalone-release.yml
          git commit -m '发布：正式版本同时提供单体 JAR'
          git push origin HEAD:feat/release-standalone-jar-20260723
