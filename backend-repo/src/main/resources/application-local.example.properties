# Copy to `application-local.properties` and adjust for your machine.
# Run with: --spring.profiles.active=local

server.port=18045
image.url=http://localhost:8005/ba-img
spring.datasource.url=jdbc:postgresql://localhost:5432/imgapi?currentSchema=app
spring.datasource.username=postgres
spring.datasource.password=change-me
spring.datasource.driver-class-name=org.postgresql.Driver
image.username=br_admin
image.password=br_password
image.basePath=C:\\path\\to\\img

# Access log retention cleanup
app.log-retention.enabled=false
app.log-retention.cron=0 30 2 * * ?
app.log-retention.retention-days=1095
app.log-retention.batch-size=5000
app.log-retention.max-batches-per-run=20

aes.secret.key=replace-with-32-byte-secret
