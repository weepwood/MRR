# ============================================================================
# Local Development Configuration Template
# ============================================================================
# Instructions:
# 1. Copy this file to `application-local.properties`
# 2. Adjust the values for your local environment
# 3. Run with: --spring.profiles.active=local
# 4. NEVER commit application-local.properties to version control
# ============================================================================

# Server Configuration
server.port=18045

# Image Service Configuration
image.url=http://localhost:8005/ba-img
image.username=change-me
image.password=change-me
image.basePath=C:\\path\\to\\your\\images

# Database Configuration (PostgreSQL)
spring.datasource.url=jdbc:postgresql://localhost:5432/imgapi?currentSchema=app
spring.datasource.username=postgres
spring.datasource.password=change-me
spring.datasource.driver-class-name=org.postgresql.Driver

# Security Configuration
# IMPORTANT: Generate a strong 32-byte secret key for production
# Example: openssl rand -base64 32
aes.secret.key=replace-with-your-own-32-byte-secret-key

# OSS Configuration (Optional for local development)
# oss.endpoint=oss-cn-hangzhou.aliyuncs.com
# oss.bucket=your-bucket-name
# oss.access-key-id=your-access-key-id
# oss.access-key-secret=your-access-key-secret
# oss.region=cn-hangzhou
# oss.base-url=https://your-bucket.oss-cn-hangzhou.aliyuncs.com

# Log Retention Configuration
app.log-retention.enabled=false
app.log-retention.cron=0 30 2 * * ?
app.log-retention.retention-days=1095
app.log-retention.batch-size=5000
app.log-retention.max-batches-per-run=20

# Logging Level (Enable DEBUG for development)
logging.level.com.zjcxph.imgapi.mapper=DEBUG
logging.level.com.zjcxph.imgapi=DEBUG
logging.level.root=INFO

# DevTools and local diagnostics
spring.devtools.restart.enabled=true
management.endpoint.health.show-details=always
