# ============================================================================
# Local Development Configuration Template
# ============================================================================
# Instructions:
# 1. Copy this file to `application-local.properties`
# 2. Adjust the values for your local environment
# 3. Run with: --spring.profiles.active=local
# 4. NEVER commit application-local.properties to version control
# ============================================================================

# Server Configuration
server.port=18045

# Image Service Configuration
image.url=http://localhost:8005/ba-img
image.username=change-me
image.password=change-me
image.basePath=C:\\path\\to\\your\\images

# Database Configuration (PostgreSQL)
spring.datasource.url=jdbc:postgresql://localhost:5432/imgapi?currentSchema=app
spring.datasource.username=postgres
spring.datasource.password=change-me
spring.datasource.driver-class-name=org.postgresql.Driver

# Historical local databases may opt into compatibility explicitly.
# Do not copy these values into production configuration.
spring.flyway.out-of-order=true
spring.flyway.ignore-migration-patterns=*:missing,*:future

# JWT signing secret (local development only; use a random value of at least 32 characters)
jwt.secret-key=replace-with-a-random-secret-of-at-least-32-characters

# External archive integration smoke-test (replace the sample secret before enabling)
# mrr.integration.enabled=true
# mrr.integration.clients[0].client-id=his-system
# mrr.integration.clients[0].secret=replace-with-a-different-random-secret-of-at-least-32-characters
# mrr.integration.clients[0].enabled=true
# mrr.integration.clients[0].allowed-ips[0]=127.0.0.1

# Security Configuration
# IMPORTANT: Generate a strong 32-byte secret key for production
# Example: openssl rand -base64 32
# 密钥为空时后端会 fail-closed（拒绝解密），不会再退化为可预测密钥。
aes.secret.key=replace-with-your-own-32-byte-secret-key

# 加密身份证查询允许的时间戳偏差（秒）。0 或负数表示关闭校验（仅用于临时兼容调用方时钟偏差）。
# aes.id-card-query.timestamp-tolerance-seconds=300

# OSS Configuration (Optional for local development)
# oss.endpoint=oss-cn-hangzhou.aliyuncs.com
# oss.bucket=your-bucket-name
# oss.access-key-id=your-access-key-id
# oss.access-key-secret=your-access-key-secret
# oss.region=cn-hangzhou
# oss.base-url=https://your-bucket.oss-cn-hangzhou.aliyuncs.com

# Log Retention Configuration
app.log-retention.enabled=false
app.log-retention.cron=0 30 2 * * ?
app.log-retention.retention-days=1095
app.log-retention.batch-size=5000
app.log-retention.max-batches-per-run=20

# Logging Level (Enable DEBUG for development)
logging.level.com.zjcxph.imgapi.mapper=DEBUG
logging.level.com.zjcxph.imgapi=DEBUG
logging.level.root=INFO

# DevTools and local diagnostics
spring.devtools.restart.enabled=true
management.endpoint.health.show-details=always

# Experimental encrypted access-audit spool (POSIX lab only; disabled by default).
# Provision an existing owner-only 0700 directory on a local filesystem.
# Set independent 32-byte Base64 MRR_AUDIT_SPOOL_KEY via protected environment.
# Do not reuse JWT/HMAC keys; do not rotate until spool is drained and verified.
# mrr.audit.spool.enabled=false
# mrr.audit.spool.directory=/absolute/private/lab/audit-spool
# mrr.audit.spool.max-records=10000
# mrr.audit.spool.max-bytes=67108864
# Second-generation sealed encrypted group candidate; requires spool.enabled=true.
# Default remains false; drain all v2 segments before downgrading to batch8 binary.
# mrr.audit.spool.grouped=false
# Optional v3 key-ring restart rotation (environment only): MRR_AUDIT_SPOOL_ACTIVE_KEY_ID,
# MRR_AUDIT_SPOOL_KEY_RING (JSON object of id to independent 32-byte Base64 key).
# Retain MRR_AUDIT_SPOOL_KEY for v1/v2. Never remove keys for pending or held segments.
# Explicit replay hold policy; 0 means disabled, not an inferred retention period.
# mrr.audit.spool.max-replay-age-days=0
# Experimental separate internal medical INTENT/OUTCOME ledger, POSIX only.
# mrr.audit.admission.enabled=false
# mrr.audit.admission.directory=/absolute/private/lab/medical-audit
# mrr.audit.admission.max-records=10000
# mrr.audit.admission.max-bytes=67108864
# MRR_MEDICAL_AUDIT_KEY / MRR_MEDICAL_AUDIT_ACTIVE_KEY_ID / MRR_MEDICAL_AUDIT_KEY_RING
# must be independent from ordinary audit keys. Retain all generations until verified.
