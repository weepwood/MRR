# Runtime
server.port=${SERVER_PORT:18045}
image.url=${IMAGE_URL:}
server.compression.enabled=true
server.compression.min-response-size=1024
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain,text/css,application/javascript,text/javascript,application/octet-stream
spring.web.resources.cache.cachecontrol.cache-public=true
spring.web.resources.cache.cachecontrol.max-age=365d
spring.lifecycle.timeout-per-shutdown-phase=${SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE:30s}

# OpenAPI / Swagger UI (protected by documentation access session)
springdoc.api-docs.enabled=${SPRINGDOC_API_DOCS_ENABLED:true}
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=${SPRINGDOC_SWAGGER_UI_ENABLED:true}
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.disable-swagger-default-url=true

# PostgreSQL datasource (override via env vars in non-local environments)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/imgapi?currentSchema=app}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:20}
spring.datasource.hikari.minimum-idle=${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE:5}
spring.datasource.hikari.connection-timeout=${SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT:30000}
spring.datasource.hikari.idle-timeout=${SPRING_DATASOURCE_HIKARI_IDLE_TIMEOUT:300000}
spring.datasource.hikari.max-lifetime=${SPRING_DATASOURCE_HIKARI_MAX_LIFETIME:1800000}

# MyBatis Configuration
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.zjcxph.imgapi.entity
mybatis.configuration.map-underscore-to-camel-case=true

# Flyway Database Migration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration,classpath:db/callback
spring.flyway.schemas=app
spring.flyway.default-schema=app
# 生产默认严格按版本顺序执行；历史测试库兼容只能在 local/test Profile 中显式开启。
spring.flyway.out-of-order=${SPRING_FLYWAY_OUT_OF_ORDER:false}
# 空值覆盖 Spring Boot/Flyway 的宽松默认；仅在已评估的本地环境通过环境变量显式放宽。
spring.flyway.ignore-migration-patterns=${SPRING_FLYWAY_IGNORE_MIGRATION_PATTERNS:}
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true
spring.flyway.validate-migration-naming=true
# CREATE INDEX CONCURRENTLY 不能使用事务级 advisory lock；会话级锁仍保证迁移串行执行。
spring.flyway.postgresql.transactional-lock=${SPRING_FLYWAY_POSTGRESQL_TRANSACTIONAL_LOCK:false}

# Database initialization (handled by Flyway)
spring.sql.init.mode=never

# Logging
# 生产环境建议关闭SQL DEBUG日志,避免性能影响和日志文件过大
logging.level.com.zjcxph.imgapi.mapper=${MAPPER_LOG_LEVEL:WARN}
logging.level.root=INFO
logging.level.com.zjcxph.imgapi=INFO
logging.file.name=${LOG_FILE_NAME:img-api.log}
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30

# Image source credentials/path. Production must provide explicit values.
image.username=${IMAGE_USERNAME:}
image.password=${IMAGE_PASSWORD:}
image.basePath=${IMAGE_BASE_PATH:}
image.server-url-default=${IMAGE_SERVER_URL_DEFAULT:}
image.server-url-ba01=${IMAGE_SERVER_URL_BA01:}
image.server-url-ba02=${IMAGE_SERVER_URL_BA02:}
image.server-url-ba03=${IMAGE_SERVER_URL_BA03:}

# Archive image source resolver.
# Legacy non-OSS images are read through the configured Nginx image URLs first,
# then fall back to IMAGE_BASE_PATH only when the backend can access the files directly.
# NAS/HTTP nodes are map properties, for example:
# ARCHIVE_IMAGE_SOURCE_NAS_NODES_ARCHIVE01_ROOT=\\archive01\medical-images
# ARCHIVE_IMAGE_SOURCE_HTTP_NODES_BA01_BASE_URL=http://10.0.0.11/images/
archive.image-source.prefer-oss=${ARCHIVE_IMAGE_SOURCE_PREFER_OSS:true}
archive.image-source.acquire-timeout=${ARCHIVE_IMAGE_SOURCE_ACQUIRE_TIMEOUT:PT30S}
archive.image-source.local-max-concurrency=${ARCHIVE_IMAGE_SOURCE_LOCAL_MAX_CONCURRENCY:16}
archive.image-source.nginx-max-concurrency=${ARCHIVE_IMAGE_SOURCE_NGINX_MAX_CONCURRENCY:8}
archive.image-source.nginx-connect-timeout=${ARCHIVE_IMAGE_SOURCE_NGINX_CONNECT_TIMEOUT:PT5S}
archive.image-source.nginx-read-timeout=${ARCHIVE_IMAGE_SOURCE_NGINX_READ_TIMEOUT:PT60S}
archive.image-source.nas-max-concurrency=${ARCHIVE_IMAGE_SOURCE_NAS_MAX_CONCURRENCY:8}
archive.image-source.http-max-concurrency=${ARCHIVE_IMAGE_SOURCE_HTTP_MAX_CONCURRENCY:8}
archive.image-source.oss-max-concurrency=${ARCHIVE_IMAGE_SOURCE_OSS_MAX_CONCURRENCY:8}

# Archive asynchronous export and controlled temporary files.
archive.export.temp-directory=${ARCHIVE_EXPORT_TEMP_DIRECTORY:${java.io.tmpdir}/mrr-archive-exports}
archive.export.max-total-bytes=${ARCHIVE_EXPORT_MAX_TOTAL_BYTES:21474836480}
archive.export.max-file-bytes=${ARCHIVE_EXPORT_MAX_FILE_BYTES:10737418240}
archive.export.retention=${ARCHIVE_EXPORT_RETENTION:PT24H}
archive.export.cleanup-interval=${ARCHIVE_EXPORT_CLEANUP_INTERVAL:PT15M}
archive.export.worker-core-size=${ARCHIVE_EXPORT_WORKER_CORE_SIZE:1}
archive.export.worker-max-size=${ARCHIVE_EXPORT_WORKER_MAX_SIZE:2}
archive.export.worker-queue-capacity=${ARCHIVE_EXPORT_WORKER_QUEUE_CAPACITY:20}
archive.export.async-item-threshold=${ARCHIVE_EXPORT_ASYNC_ITEM_THRESHOLD:500}
archive.export.async-estimated-bytes-threshold=${ARCHIVE_EXPORT_ASYNC_ESTIMATED_BYTES_THRESHOLD:1073741824}
archive.export.async-source-count-threshold=${ARCHIVE_EXPORT_ASYNC_SOURCE_COUNT_THRESHOLD:2}
archive.export.fallback-bytes-per-image=${ARCHIVE_EXPORT_FALLBACK_BYTES_PER_IMAGE:5242880}

# Native monitoring endpoint: local-only by default, independent of Docker.
spring.devtools.restart.enabled=${SPRING_DEVTOOLS_RESTART_ENABLED:false}
management.server.port=${MANAGEMENT_SERVER_PORT:18046}
management.server.address=${MANAGEMENT_SERVER_ADDRESS:127.0.0.1}
management.endpoints.web.exposure.include=${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health,info,prometheus}
management.endpoint.health.show-details=${MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS:never}
management.info.env.enabled=${MANAGEMENT_INFO_ENV_ENABLED:true}
management.info.build.enabled=true
management.info.git.enabled=true
management.info.git.mode=full
management.metrics.tags.application=mrr
management.prometheus.metrics.export.enabled=${MANAGEMENT_PROMETHEUS_METRICS_EXPORT_ENABLED:true}
info.app.name=MRR
info.app.versionSource=repository-root-VERSION
# HikariCP connection pool metrics
spring.datasource.hikari.metrics.enabled=true

# Built-in availability history. Leave the frontend URL empty to monitor backend and database only.
app.status.enabled=${APP_STATUS_ENABLED:true}
app.status.check-interval-ms=${APP_STATUS_CHECK_INTERVAL_MS:60000}
app.status.initial-delay-ms=${APP_STATUS_INITIAL_DELAY_MS:60000}
app.status.heartbeat-timeout-ms=${APP_STATUS_HEARTBEAT_TIMEOUT_MS:120000}
app.status.request-timeout-ms=${APP_STATUS_REQUEST_TIMEOUT_MS:3000}
app.status.frontend-health-url=${APP_STATUS_FRONTEND_HEALTH_URL:}
app.status.retention-days=${APP_STATUS_RETENTION_DAYS:365}
app.status.zone-id=${APP_STATUS_ZONE_ID:Asia/Shanghai}

# Data quality checks are manual-only. The background cron is explicitly disabled.
app.data-quality.enabled=false
app.data-quality.cron=-
app.data-quality.sample-limit=${APP_DATA_QUALITY_SAMPLE_LIMIT:200}
app.data-quality.retention-days=${APP_DATA_QUALITY_RETENTION_DAYS:90}

# Access log retention cleanup
app.log-retention.enabled=${APP_LOG_RETENTION_ENABLED:true}
app.log-retention.cron=${APP_LOG_RETENTION_CRON:0 30 2 * * ?}
app.log-retention.retention-days=${APP_LOG_RETENTION_RETENTION_DAYS:1095}
app.log-retention.batch-size=${APP_LOG_RETENTION_BATCH_SIZE:5000}
app.log-retention.max-batches-per-run=${APP_LOG_RETENTION_MAX_BATCHES_PER_RUN:20}

# AES secret key (must be overridden in real environments)
aes.secret.key=${AES_SECRET_KEY:}

# OSS Configuration (S3-compatible via AWS SDK)
oss.endpoint=${OSS_ENDPOINT:oss-cn-hangzhou.aliyuncs.com}
oss.bucket=${OSS_BUCKET:mrr-medical-records}
oss.access-key-id=${OSS_ACCESS_KEY_ID:}
oss.access-key-secret=${OSS_ACCESS_KEY_SECRET:}
oss.region=${OSS_REGION:cn-hangzhou}
oss.base-url=${OSS_BASE_URL:https://mrr-medical-records.oss-cn-hangzhou.aliyuncs.com}
oss.url-expire-seconds=${OSS_URL_EXPIRE_SECONDS:3600}
# Enable for S3-compatible storage addressed as http(s)://endpoint/bucket/object,
# such as an intranet aStor EDS endpoint using an IP address and port.
oss.path-style-access=${OSS_PATH_STYLE_ACCESS:false}

# Caffeine Cache Configuration
spring.cache.type=caffeine
spring.cache.caffeine.spec=initialCapacity=100,maximumSize=1000,expireAfterWrite=10m

# General async task executor configuration
spring.task.execution.pool.core-size=5
spring.task.execution.pool.max-size=10
spring.task.execution.pool.queue-capacity=100
spring.task.execution.thread-name-prefix=async-
