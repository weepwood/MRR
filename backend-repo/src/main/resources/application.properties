# Runtime
server.port=${SERVER_PORT:18045}
image.url=${IMAGE_URL:http://localhost:8005/ba-img}

# PostgreSQL datasource (override via env vars in non-local environments)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/imgapi?currentSchema=app}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:weepwood}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.sql.init.mode=always
spring.sql.init.platform=postgresql
spring.sql.init.schema-locations=classpath:schema-postgresql.sql

# Logging
logging.level.com.zjcxph.imgapi.mapper=DEBUG
logging.level.root=INFO
logging.file.name=${LOG_FILE_NAME:img-api.log}
logging.logback.rollingpolicy.max-file-size=10MB

# Image source credentials/path
image.username=${IMAGE_USERNAME:br_admin}
image.password=${IMAGE_PASSWORD:br_password}
image.basePath=${IMAGE_BASE_PATH:./data/img}

# Dev/Actuator
spring.devtools.restart.enabled=true
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always

# Access log retention cleanup
app.log-retention.enabled=${APP_LOG_RETENTION_ENABLED:true}
app.log-retention.cron=${APP_LOG_RETENTION_CRON:0 30 2 * * ?}
app.log-retention.retention-days=${APP_LOG_RETENTION_RETENTION_DAYS:90}
app.log-retention.batch-size=${APP_LOG_RETENTION_BATCH_SIZE:5000}
app.log-retention.max-batches-per-run=${APP_LOG_RETENTION_MAX_BATCHES_PER_RUN:20}

# AES secret key (must be overridden in real environments)
aes.secret.key=${AES_SECRET_KEY:change-this-in-production-32-bytes}
