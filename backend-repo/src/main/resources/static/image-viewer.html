<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>病案图片浏览 - MRR</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh}
.header{position:sticky;top:0;z-index:100;background:#1e293b;border-bottom:1px solid #334155;padding:16px 24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.header h1{font-size:18px;font-weight:700;color:#38bdf8;white-space:nowrap}
.search-box{display:flex;gap:8px;flex:1;min-width:280px;max-width:520px}
.search-box input{flex:1;padding:9px 14px;background:#0f172a;border:1px solid #334155;border-radius:8px;color:#e2e8f0;font-size:14px;outline:none;transition:border .15s;font-family:inherit}
.search-box input:focus{border-color:#0ea5e9}
.search-box input::placeholder{color:#475569}
.search-box button{padding:9px 20px;background:#0ea5e9;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;transition:background .15s;white-space:nowrap}
.search-box button:hover{background:#0284c7}
.search-box button:disabled{opacity:.5;cursor:not-allowed}
.stats{font-size:13px;color:#64748b;margin-left:auto}
.content{padding:24px;max-width:1400px;margin:0 auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px}
.card{background:#1e293b;border-radius:12px;border:1px solid #334155;overflow:hidden;transition:border-color .2s,transform .15s}
.card:hover{border-color:#0ea5e9;transform:translateY(-2px)}
.card .img-wrap{position:relative;width:100%;aspect-ratio:4/3;background:#0f172a;overflow:hidden;cursor:pointer}
.card .img-wrap img{width:100%;height:100%;object-fit:contain;transition:opacity .3s}
.card .img-wrap img.loading{opacity:0}
.card .img-wrap img.loaded{opacity:1}
.card .img-wrap .placeholder{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#334155;font-size:13px}
.card .info{padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.card .info .row{display:flex;justify-content:space-between;align-items:center}
.card .info .label{font-size:11px;color:#64748b}
.card .info .value{font-size:12px;color:#e2e8f0;font-family:'Cascadia Code','Fira Code',monospace}
.card .info .badge{font-size:10px;padding:2px 8px;border-radius:4px;background:#0ea5e920;color:#38bdf8}
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:80px 20px;color:#64748b;text-align:center}
.empty-state .icon{font-size:48px;margin-bottom:16px;opacity:.4}
.empty-state .title{font-size:18px;font-weight:600;margin-bottom:8px;color:#94a3b8}
.empty-state .desc{font-size:14px;max-width:400px;line-height:1.6}
.spinner{width:20px;height:20px;border:2px solid #334155;border-top-color:#0ea5e9;border-radius:50%;animation:spin .6s linear infinite;display:inline-block;vertical-align:middle;margin-left:8px;display:none}
.spinner.show{display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.modal-overlay{position:fixed;inset:0;z-index:200;background:#000000cc;display:none;align-items:center;justify-content:center;padding:24px;cursor:zoom-out}
.modal-overlay.open{display:flex}
.modal-overlay img{max-width:95vw;max-height:95vh;object-fit:contain;border-radius:4px;box-shadow:0 20px 60px #00000066}
.modal-overlay .modal-close{position:absolute;top:16px;right:16px;width:40px;height:40px;border-radius:50%;background:#1e293b;border:1px solid #334155;color:#e2e8f0;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s}
.modal-overlay .modal-close:hover{background:#334155}
.modal-overlay .modal-counter{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);background:#1e293b;padding:6px 16px;border-radius:20px;font-size:13px;color:#94a3b8;border:1px solid #334155}
.spinner-page{display:flex;align-items:center;justify-content:center;padding:40px;color:#64748b;gap:8px}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:#475569;border-radius:3px}
.load-more{display:flex;justify-content:center;padding:24px;gap:8px}
.load-more button{padding:10px 28px;background:#1e293b;border:1px solid #334155;border-radius:8px;color:#e2e8f0;font-size:14px;cursor:pointer;transition:all .15s;font-family:inherit}
.load-more button:hover{background:#334155;border-color:#0ea5e9}
.load-more button:disabled{opacity:.4;cursor:not-allowed}
.preview-nav{display:flex;gap:12px;position:absolute;bottom:12px;right:12px;opacity:0;transition:opacity .2s}
.card:hover .preview-nav{opacity:1}
.preview-nav button{width:32px;height:32px;border-radius:50%;background:#1e293b;border:1px solid #334155;color:#e2e8f0;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;transition:all .15s}
.preview-nav button:hover{background:#0ea5e9;border-color:#0ea5e9;color:#fff}
</style>
</head>
<body>
<div class="header">
  <h1>🩻 病案图片浏览</h1>
  <div class="search-box">
    <input id="searchInput" placeholder="输入病案号 (BAH) 或上架号 (SJH)..." autofocus>
    <button id="searchBtn" onclick="search()">搜索</button>
  </div>
  <div class="stats" id="stats"></div>
</div>
<div class="content">
  <div id="emptyState" class="empty-state">
    <div class="icon">🔍</div>
    <div class="title">搜索病案图片</div>
    <div class="desc">输入病案号 (BAH) 或上架号 (SJH) 查看对应的影像图片</div>
  </div>
  <div id="results" style="display:none">
    <div class="grid" id="grid"></div>
    <div class="load-more" id="loadMore" style="display:none">
      <button onclick="prevPage()">← 上一页</button>
      <span style="color:#64748b;font-size:13px;align-self:center" id="pageInfo"></span>
      <button onclick="nextPage()">下一页 →</button>
    </div>
  </div>
  <div id="loading" class="spinner-page" style="display:none">
    <div class="spinner show"></div> 查询中...
  </div>
</div>

<div class="modal-overlay" id="modal" onclick="closeModal(event)">
  <button class="modal-close" onclick="closeModal()">✕</button>
  <img id="modalImg" src="" alt="preview">
  <div class="modal-counter" id="modalCounter"></div>
</div>

<script>
let allScans = [];
let currentPage = 1;
const PAGE_SIZE = 50;
let lastQuery = '';
let totalCount = 0;

document.getElementById('searchInput').addEventListener('keydown', e => { if (e.key === 'Enter') search() });

async function search(page) {
  const q = document.getElementById('searchInput').value.trim();
  if (!q) return;
  lastQuery = q;
  document.getElementById('emptyState').style.display = 'none';
  document.getElementById('results').style.display = 'none';
  document.getElementById('loading').style.display = 'flex';
  document.getElementById('stats').textContent = '';
  const btn = document.getElementById('searchBtn');
  btn.disabled = true;
  try {
    let data;
    if (/^\d{6,8}$/.test(q)) {
      const r1 = await fetch('/api/v1/img/' + q);
      const j1 = await r1.json();
      data = j1.data || [];
    } else {
      const r2 = await fetch('/api/v1/img/search?sjh=' + encodeURIComponent(q));
      const j2 = await r2.json();
      data = j2.data || [];
    }
    totalCount = data.length;
    allScans = data;
    currentPage = page || 1;
    renderPage();
  } catch (e) {
    document.getElementById('grid').innerHTML = '<div class="empty-state" style="grid-column:1/-1"><div class="icon">⚠️</div><div class="title">查询失败</div><div class="desc">' + e.message + '</div></div>';
    document.getElementById('results').style.display = 'block';
  } finally {
    document.getElementById('loading').style.display = 'none';
    btn.disabled = false;
  }
}

function renderPage() {
  const grid = document.getElementById('grid');
  const totalPages = Math.ceil(allScans.length / PAGE_SIZE) || 1;
  const start = (currentPage - 1) * PAGE_SIZE;
  const end = Math.min(start + PAGE_SIZE, allScans.length);
  const pageItems = allScans.slice(start, end);

  grid.innerHTML = '';
  pageItems.forEach((s, i) => {
    const folderKey = s.brxh;
    const imgSrc = s.img_url || ('/api/v1/img/image/' + s.bah + '/' + s.brxh + '/' + s.folder + '/' + s.filename);
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="img-wrap" onclick="openModal(${start + i})">
        <div class="placeholder">加载中...</div>
        <img class="loading" src="${imgSrc}" alt="${s.filename}" loading="lazy" onload="this.classList.remove('loading');this.classList.add('loaded');this.previousElementSibling.style.display='none'"
             onerror="this.classList.remove('loading');this.parentElement.querySelector('.placeholder').textContent='❌ 加载失败'">
      </div>
      <div class="info">
        <div class="row"><span class="label">文件名</span><span class="value">${s.filename}</span></div>
        <div class="row"><span class="label">病案号</span><span class="value">${s.bah}</span></div>
        <div class="row"><span class="label">病人序号</span><span class="value">${s.brxh || '-'}</span></div>
        <div class="row"><span class="label">上架号</span><span class="value">${s.sjh || '-'}</span></div>
        <div class="row"><span class="label">文件夹</span><span class="value">${s.folder}</span></div>
        <div class="row"><span class="label">页码</span><span class="badge">${s.pages || '-'}</span></div>
      </div>
    `;
    grid.appendChild(card);
  });

  const totalPagesEl = document.getElementById('loadMore');
  const pageInfo = document.getElementById('pageInfo');
  if (allScans.length > PAGE_SIZE) {
    totalPagesEl.style.display = 'flex';
    pageInfo.textContent = `第 ${currentPage}/${totalPages} 页 (共 ${allScans.length} 张)`;
    document.querySelector('#loadMore button:first-child').disabled = currentPage <= 1;
    document.querySelector('#loadMore button:last-child').disabled = currentPage >= totalPages;
  } else {
    totalPagesEl.style.display = 'none';
  }

  document.getElementById('results').style.display = 'block';
  document.getElementById('stats').textContent = totalCount + ' 张图片';
}

function prevPage() { if (currentPage > 1) { currentPage--; renderPage(); window.scrollTo({top:0,behavior:'smooth'}) } }
function nextPage() { const totalPages = Math.ceil(allScans.length / PAGE_SIZE); if (currentPage < totalPages) { currentPage++; renderPage(); window.scrollTo({top:0,behavior:'smooth'}) } }

function openModal(idx) {
  const s = allScans[idx];
  if (!s) return;
  const imgSrc = s.img_url || ('/api/v1/img/image/' + s.bah + '/' + s.brxh + '/' + s.folder + '/' + s.filename);
  const m = document.getElementById('modal');
  document.getElementById('modalImg').src = imgSrc;
  document.getElementById('modalCounter').textContent = (idx + 1) + ' / ' + allScans.length;
  m.classList.add('open');
  document.body.style.overflow = 'hidden';

  m.onclick = function(e) {
    if (e.target === m) closeModal();
  };
  document.onkeydown = function(e) {
    if (e.key === 'Escape') closeModal();
    if (e.key === 'ArrowLeft' && idx > 0) openModal(idx - 1);
    if (e.key === 'ArrowRight' && idx < allScans.length - 1) openModal(idx + 1);
  };
}

function closeModal() {
  document.getElementById('modal').classList.remove('open');
  document.body.style.overflow = '';
  document.onkeydown = null;
}
</script>
</body>
</html>
