# MRR production configuration for a single Windows Server.
# Sensitive values are imported from the ACL-protected secrets directory.
spring.config.import=optional:file:{{MRR_URI_ROOT}}/secrets/application-secrets.properties

server.address=127.0.0.1
server.port=18045
spring.lifecycle.timeout-per-shutdown-phase=30s

spring.datasource.url=jdbc:postgresql://127.0.0.1:5432/imgapi?currentSchema=app
spring.datasource.username=mrr_app
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5

# Required image source settings.
image.basePath=D:/MRR-Images
image.url=http://127.0.0.1:8005/ba-img
image.server-url-default=http://127.0.0.1:8005/ba-img-00
image.server-url-ba01=http://127.0.0.1:8005/ba-img-01
image.server-url-ba02=http://127.0.0.1:8005/ba-img-02
image.server-url-ba03=http://127.0.0.1:8005/ba-img-03

# Local-only health and built-in metrics. No Prometheus/Grafana deployment is required.
management.server.address=127.0.0.1
management.server.port=18046
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.probes.add-additional-paths=true
management.endpoint.health.group.liveness.include=livenessState,ping
management.endpoint.health.group.readiness.include=readinessState,db,auditSpool
management.info.env.enabled=true
management.prometheus.metrics.export.enabled=false

logging.file.name={{MRR_URI_ROOT}}/logs/backend/img-api.log
logging.error-file.name={{MRR_URI_ROOT}}/logs/backend/mrr-error.log
logging.level.root=INFO
logging.level.com.zjcxph.imgapi=INFO
logging.level.com.zjcxph.imgapi.mapper=WARN

# Critical audit records use PostgreSQL first and this durable local spool as fallback.
app.audit.spool-file={{MRR_URI_ROOT}}/state/audit/audit-events.jsonl
app.audit.replay-interval-ms=30000
# app.audit.hmac-secret must be set in application-secrets.properties.

app.status.enabled=true
app.status.frontend-health-url=http://127.0.0.1/healthz.txt
app.status.zone-id=Asia/Shanghai
app.status.retention-days=365

# Optional secondary backup target, for example a NAS share. Leave empty to use local backups only.
app.backup.secondary-path=

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
