# MRR production configuration for Windows Server.
# Sensitive values are imported from the ACL-protected secrets directory.
spring.config.import=optional:file:{{MRR_URI_ROOT}}/secrets/application-secrets.properties

server.address=127.0.0.1
server.port=18045
spring.lifecycle.timeout-per-shutdown-phase=30s

spring.datasource.url=jdbc:postgresql://127.0.0.1:5432/imgapi?currentSchema=app
spring.datasource.username=mrr_app
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5

# Developer archive legacy mode is disabled by default.
# Set allowed=true only when an old internal system must open /archive without a Token.
# Client IP/CIDR rules are maintained in System Settings -> Developer Mode.
mrr.developer-mode.allowed=false
mrr.developer-mode.trusted-proxy-addresses=127.0.0.1,::1

# Required image source settings. Replace these values before first startup.
image.basePath=D:/MRR-Images
image.url=http://127.0.0.1:8005/ba-img
image.server-url-default=http://127.0.0.1:8005/ba-img-00
image.server-url-ba01=http://127.0.0.1:8005/ba-img-01
image.server-url-ba02=http://127.0.0.1:8005/ba-img-02
image.server-url-ba03=http://127.0.0.1:8005/ba-img-03

management.server.address=127.0.0.1
management.server.port=18046
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=never
management.info.env.enabled=true

logging.file.name={{MRR_URI_ROOT}}/logs/backend/img-api.log
logging.level.root=INFO
logging.level.com.zjcxph.imgapi=INFO
logging.level.com.zjcxph.imgapi.mapper=WARN

app.status.enabled=true
app.status.frontend-health-url=http://127.0.0.1/healthz.txt
app.status.zone-id=Asia/Shanghai
app.status.retention-days=365

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# 每日巡检。生产必须显式声明，不依赖代码默认值。
# statement-timeout-seconds 是单检查项上限：大表全表统计超时后记为 SKIPPED，
# 不会中断整轮巡检，也不会被误读为"无问题"。
app.data-quality.enabled=true
app.data-quality.cron=0 15 2 * * ?
app.data-quality.statement-timeout-seconds=120

# 备份时效。超过该小时数后，部署就绪检查会把 backup 项判为未通过。
app.readiness.maximum-backup-age-hours=48
