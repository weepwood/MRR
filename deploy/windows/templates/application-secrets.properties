# This file contains secrets. Do not commit a populated copy to Git.
# install.ps1 removes inherited ACLs and grants access only to Administrators and SYSTEM.

spring.datasource.password=CHANGE_ME_DATABASE_PASSWORD

# Keep both forms because the application currently reads secrets through Spring properties/environment variables.
JWT_SECRET_KEY=CHANGE_ME_WITH_A_LONG_RANDOM_VALUE
aes.secret.key=CHANGE_ME_WITH_AT_LEAST_32_BYTES

image.username=CHANGE_ME_IMAGE_USERNAME
image.password=CHANGE_ME_IMAGE_PASSWORD

oss.access-key-id=
oss.access-key-secret=

# External archive integration. Keep disabled until the client ID, HMAC secret and IP allowlist are configured.
mrr.integration.enabled=false
mrr.integration.ticket-ttl-seconds=90
mrr.integration.session-ttl-seconds=1800
mrr.integration.timestamp-tolerance-seconds=300
mrr.integration.max-archives-per-ticket=100
mrr.integration.clients[0].client-id=his-system
mrr.integration.clients[0].secret=CHANGE_ME_WITH_A_DIFFERENT_LONG_RANDOM_HMAC_SECRET
mrr.integration.clients[0].enabled=true
mrr.integration.clients[0].allowed-ips[0]=127.0.0.1
