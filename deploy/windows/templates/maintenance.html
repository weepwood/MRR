<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-store">
  <title>MRR · 系统暂时不可用</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: Inter, "HarmonyOS Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      --bg: #f5f7fa; --ink: #172033; --muted: #52637b; --surface: #e8edf5;
      --paper: #ffffff; --line: #8192a8; --accent: #2563eb;
      background: var(--bg); color: var(--ink);
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 32px; }
    main { width: 100%; max-width: 688px; display: grid; grid-template-columns: minmax(0, 280px) minmax(0, 360px); align-items: center; gap: 48px; }
    svg { display: block; width: 100%; height: auto; max-width: 280px; margin: auto; }
    .copy { min-width: 0; display: grid; gap: 12px; }
    .code { color: var(--muted); font-size: 14px; font-weight: 600; letter-spacing: .08em; }
    h1 { margin: 0; font-size: 26px; font-weight: 600; line-height: 1.35; overflow-wrap: anywhere; }
    p, small { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.75; overflow-wrap: anywhere; }
    small { font-size: 12px; }
    button { justify-self: start; margin-top: 8px; padding: 9px 16px; border: 0; border-radius: 8px; background: #2563eb; color: #fff; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; }
    button:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #181e25; --ink: #e6ebf2; --muted: #b2bfd0; --surface: #252f3d; --paper: #202833; --line: #8b9db4; --accent: #91b5fa; }
    }
    @media (max-width: 640px) {
      body { padding: 20px; }
      main { max-width: 360px; grid-template-columns: minmax(0, 1fr); gap: 20px; text-align: center; }
      svg { max-width: 200px; }
      button { justify-self: center; }
    }
  </style>
</head>
<body>
  <main>
    <svg viewBox="0 0 240 176" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
      <rect x="16" y="17" width="208" height="142" rx="24" fill="var(--surface)" />
      <path d="M32 42V33h10m156 0h10v9M32 134v9h10m156 0h10v-9" stroke="var(--line)" opacity=".45" />
      <rect x="54" y="33" width="118" height="38" rx="8" fill="var(--paper)" stroke="var(--line)" />
      <rect x="54" y="78" width="118" height="38" rx="8" fill="var(--paper)" stroke="var(--line)" />
      <path d="M69 52h52m-52 45h52" stroke="var(--line)" stroke-width="3" opacity=".65" />
      <circle cx="151" cy="52" r="3" fill="var(--line)" /><circle cx="151" cy="97" r="3" fill="var(--line)" />
      <circle cx="168" cy="122" r="28" fill="var(--paper)" stroke="var(--line)" />
      <circle cx="168" cy="122" r="15" stroke="var(--accent)" stroke-width="2.5" /><path d="M168 112v10l7 5" stroke="var(--accent)" stroke-width="3" />
    </svg>
    <div class="copy">
      <span class="code">503</span>
      <h1>系统暂时不可用</h1>
      <p id="maintenance-message">系统维护中，请稍后再试。</p>
      <small>运维监控与本机健康检查仍保持运行。</small>
    </div>
  </main>
</body>
</html>
