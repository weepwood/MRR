<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-store">
  <title>MRR 系统维护</title>
  <style>
    :root { color-scheme: light; font-family: "Segoe UI", "Microsoft YaHei", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f4f7f6; color: #17211d; }
    main { width: min(560px, calc(100% - 40px)); padding: 44px; border: 1px solid #dce6e1; border-radius: 18px; background: #fff; box-shadow: 0 18px 60px rgba(24, 63, 45, .08); }
    .mark { width: 52px; height: 52px; display: grid; place-items: center; border-radius: 14px; background: #e7f5ed; color: #087443; font-weight: 700; letter-spacing: .06em; }
    h1 { margin: 26px 0 12px; font-size: 26px; }
    p { margin: 0; color: #5d6b64; line-height: 1.75; }
    small { display: block; margin-top: 28px; color: #87938d; }
  </style>
</head>
<body>
  <main>
    <div class="mark">MRR</div>
    <h1>系统暂时不可用</h1>
    <p id="maintenance-message">系统维护中，请稍后再试。</p>
    <small>运维监控与本机健康检查仍保持运行。</small>
  </main>
</body>
</html>
