worker_processes 1;
error_log {{MRR_URI_ROOT}}/logs/nginx/error.log warn;
pid {{MRR_URI_ROOT}}/state/nginx.pid;

events {
    worker_connections 2048;
}

http {
    include {{MRR_URI_ROOT}}/runtime/nginx/conf/mime.types;
    default_type application/octet-stream;

    # Vite assets carry content hashes and can be cached permanently. The SPA
    # entry and browser routes must be revalidated after each managed release.
    map $uri $mrr_frontend_cache_control {
        default                 "no-cache";
        ~^/assets/              "public, max-age=31536000, immutable";
        ~^/browser_upgrade/     "public, max-age=31536000, immutable";
    }

    # 不使用 $request 和 $http_referer，避免 Query String、外部票据或 Token
    # 通过入口日志以明文形式落盘。详细业务参数由应用审计按敏感字段策略保存。
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request_method $uri $server_protocol" '
                    '$status $body_bytes_sent "$http_origin" '
                    '"$http_user_agent" rt=$request_time';

    # 入口层结构化审计日志：记录所有到达 Nginx 的请求，包括后端未启动、
    # 维护模式、代理超时和被 Nginx 直接拒绝的访问。
    log_format audit_json escape=json
        '{'
          '"time":"$time_iso8601",'
          '"remote_addr":"$remote_addr",'
          '"forwarded_for":"$http_x_forwarded_for",'
          '"method":"$request_method",'
          '"uri":"$uri",'
          '"protocol":"$server_protocol",'
          '"status":$status,'
          '"body_bytes_sent":$body_bytes_sent,'
          '"request_time":$request_time,'
          '"upstream_status":"$upstream_status",'
          '"upstream_response_time":"$upstream_response_time",'
          '"request_id":"$sent_http_x_request_id",'
          '"origin":"$http_origin",'
          '"user_agent":"$http_user_agent"'
        '}';

    access_log {{MRR_URI_ROOT}}/logs/nginx/access.log main;
    access_log {{MRR_URI_ROOT}}/logs/nginx/access-audit.jsonl audit_json;

    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 100m;
    server_tokens off;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    upstream mrr_backend {
        server 127.0.0.1:18045;
        keepalive 32;
    }

    server {
        listen 80 default_server;
        server_name _;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        error_page 503 /maintenance.html;

        location = /maintenance.html {
            root {{MRR_URI_ROOT}}/shared;
            internal;
            add_header Cache-Control "no-store" always;
        }

        location = /healthz.txt {
            root {{MRR_URI_ROOT}}/shared;
            default_type text/plain;
            add_header Cache-Control "no-store" always;
        }

        location = /status {
            include {{MRR_URI_ROOT}}/config/nginx/maintenance.inc;
            add_header Cache-Control "no-store" always;
            include {{MRR_URI_ROOT}}/config/nginx/frontend-mode.inc;
        }

        location ^~ /api/v1/status/ {
            proxy_pass http://mrr_backend;
            include {{MRR_URI_ROOT}}/config/nginx/proxy.inc;
        }

        location ^~ /api/v1/system/status/ {
            proxy_pass http://mrr_backend;
            include {{MRR_URI_ROOT}}/config/nginx/proxy.inc;
        }

        location /api/ {
            include {{MRR_URI_ROOT}}/config/nginx/maintenance.inc;
            proxy_pass http://mrr_backend;
            include {{MRR_URI_ROOT}}/config/nginx/proxy.inc;
        }

        location /api-docs/ {
            proxy_pass http://mrr_backend/swagger-ui/;
            include {{MRR_URI_ROOT}}/config/nginx/proxy.inc;
        }

        location /v3/api-docs {
            proxy_pass http://mrr_backend;
            include {{MRR_URI_ROOT}}/config/nginx/proxy.inc;
        }

        location /docs/internal/ {
            alias {{MRR_URI_ROOT}}/current/docs/internal/;
            try_files $uri $uri.html $uri/ /docs/internal/index.html;
        }

        location /docs/ {
            alias {{MRR_URI_ROOT}}/current/docs/user/;
            try_files $uri $uri.html $uri/ /docs/index.html;
        }

        location / {
            include {{MRR_URI_ROOT}}/config/nginx/maintenance.inc;
            add_header Cache-Control $mrr_frontend_cache_control always;
            include {{MRR_URI_ROOT}}/config/nginx/frontend-mode.inc;
        }
    }
}
