worker_processes 1;
error_log {{MRR_URI_ROOT}}/logs/nginx/error.log warn;
pid {{MRR_URI_ROOT}}/state/nginx.pid;

events {
    worker_connections 2048;
}

http {
    include {{MRR_URI_ROOT}}/runtime/nginx/conf/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time '
                    'gateway_request_id=$request_id backend_request_id=$upstream_http_x_request_id';
    access_log {{MRR_URI_ROOT}}/logs/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 100m;
    server_tokens off;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    upstream mrr_backend {
        server 127.0.0.1:18045;
        keepalive 32;
    }

    server {
        listen 80 default_server;
        server_name _;
        root {{MRR_URI_ROOT}}/current/frontend;
        index index.html;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        error_page 503 /maintenance.html;

        location = /maintenance.html {
            root {{MRR_URI_ROOT}}/shared;
            internal;
            add_header Cache-Control "no-store" always;
        }

        location = /healthz.txt {
            root {{MRR_URI_ROOT}}/shared;
            default_type text/plain;
            add_header Cache-Control "no-store" always;
        }

        location = /status {
            try_files /index.html =404;
            add_header Cache-Control "no-store" always;
        }

        location ^~ /assets/ {
            try_files $uri =404;
            expires 7d;
            add_header Cache-Control "public, max-age=604800, immutable";
        }

        location ^~ /api/v1/status/ {
            proxy_pass http://mrr_backend;
            include {{MRR_URI_ROOT}}/config/nginx/proxy.inc;
        }

        location ^~ /api/v1/system/status/ {
            proxy_pass http://mrr_backend;
            include {{MRR_URI_ROOT}}/config/nginx/proxy.inc;
        }

        # Public status and external probes must remain reachable during maintenance mode.
        location ^~ /api/v1/public/status/ {
            proxy_pass http://mrr_backend;
            include {{MRR_URI_ROOT}}/config/nginx/proxy.inc;
        }

        location /api/ {
            include {{MRR_URI_ROOT}}/config/nginx/maintenance.inc;
            proxy_pass http://mrr_backend;
            include {{MRR_URI_ROOT}}/config/nginx/proxy.inc;
        }

        location /api-docs/ {
            proxy_pass http://mrr_backend/swagger-ui/;
            include {{MRR_URI_ROOT}}/config/nginx/proxy.inc;
        }

        location /v3/api-docs {
            proxy_pass http://mrr_backend;
            include {{MRR_URI_ROOT}}/config/nginx/proxy.inc;
        }

        location /docs/internal/ {
            alias {{MRR_URI_ROOT}}/current/docs/internal/;
            try_files $uri $uri.html $uri/ /docs/internal/index.html;
        }

        location /docs/ {
            alias {{MRR_URI_ROOT}}/current/docs/user/;
            try_files $uri $uri.html $uri/ /docs/index.html;
        }

        location / {
            include {{MRR_URI_ROOT}}/config/nginx/maintenance.inc;
            try_files $uri $uri/ /index.html;
        }
    }
}
