# Optional offline OCR runtime. Copy into server-only configuration after doctor validation.
# Paths reference one immutable runtime release; never accept these from API requests.
ocr.runtime.profiles.rapidocr-cpu.executable=C:/MRR/ocr/releases/CHOOSE_VERSION/python/python.exe
ocr.runtime.profiles.rapidocr-cpu.script=C:/MRR/ocr/releases/CHOOSE_VERSION/worker.py
ocr.runtime.profiles.rapidocr-cpu.model-directory=C:/MRR/ocr/releases/CHOOSE_VERSION/models
ocr.runtime.profiles.rapidocr-cpu.manifest-sha256=
ocr.runtime.temp-directory=C:/MRR/data/ocr-temp
ocr.runtime.max-workers=1
ocr.runtime.max-input-bytes=52428800
ocr.runtime.read-timeout-millis=30000
# Must come from normal image-viewing measurements before enabling history.
ocr.runtime.image-p95-baseline-millis=0
# Automatic formal changes remain off without independently reviewed local evidence.
ocr.runtime.auto-apply-allowed=false
ocr.runtime.auto-types=
ocr.runtime.validation-report=
ocr.runtime.validation-report-sha256=
