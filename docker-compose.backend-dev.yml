services:
  postgres:
    image: postgres:16-alpine
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - track_io_timing=on
    environment:
      POSTGRES_DB: imgapi
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/backend-docker.ps1 setup first}
    ports:
      - "127.0.0.1:${MRR_POSTGRES_PORT:-15432}:5432"
    volumes:
      - backend_dev_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d imgapi"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: backend-repo/Dockerfile.dev
      args:
        SOURCE_REVISION: ${MRR_GIT_COMMIT:?Use scripts/backend-docker.ps1 to build}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/imgapi?currentSchema=app
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/backend-docker.ps1 setup first}
      AES_SECRET_KEY: ${AES_SECRET_KEY:?Run scripts/backend-docker.ps1 setup first}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Run scripts/backend-docker.ps1 setup first}
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: "18045"
      MANAGEMENT_SERVER_PORT: "18046"
      APP_LOG_RETENTION_ENABLED: "false"
      APP_LOG_RETENTION_RETENTION_DAYS: "1095"
    ports:
      - "127.0.0.1:${MRR_BACKEND_PORT:-18045}:18045"

volumes:
  backend_dev_postgres_data: