name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend-fantastic-admin/.node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm lint:tsc

      - name: Lint ESLint
        run: pnpm lint:eslint

      - name: Lint Stylelint
        run: pnpm lint:stylelint

      - name: Run tests
        run: pnpm test:run

      - name: Build
        run: pnpm build
