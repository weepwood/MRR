<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!--
      国产双核浏览器（360 安全/极速、QQ、搜狗、2345 等）访问内网 IP 时常默认切到 IE 兼容内核，
      直接落到「浏览器不受支持」拦截页。renderer / force-rendering 让它们优先使用 Chromium 内核；
      X-UA-Compatible 让仍处于 IE 内核的环境至少使用最高文档模式，拦截提示可以正常显示。
    -->
    <meta name="renderer" content="webkit" />
    <meta name="force-rendering" content="webkit" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" sizes="any" />
    <!--
      预加载界面字体子集：登录页与导航首帧就会用到常规与中粗两档，
      不预加载时首屏先用系统字体渲染、字体到达后整体重排（FOUT），按钮宽度会跳一下。
      完整字库（约 4MB/个）只在出现子集外的生僻字时按 unicode-range 懒加载，不在此预加载。
    -->
    <link rel="preload" href="/fonts/harmonyos-sans-sc-ui-regular-8d2cc5f76603.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/harmonyos-sans-sc-ui-medium-472b22229854.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" sizes="180x180" href="/pwa/apple-touch-icon.png" />
    <link rel="stylesheet" href="/browser_upgrade/index.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
    <script>
      /*
       * 动效偏好必须在首帧之前写到根节点。
       * 设置 store 的 watch 虽然是 immediate，但要等 Pinia 初始化、设置读回之后才执行，
       * 关闭了动效的用户每次进入都会先看一遍入场动画。这里直接读本地缓存抢在渲染前设置。
       * 读取失败（隐私模式、旧的或损坏的存储）时静默跳过，由 store 的 watch 兜底。
       */
      (function () {
        try {
          var raw = window.localStorage.getItem('MRR-ADMIN:app-settings')
          if (!raw) {
            return
          }
          var saved = JSON.parse(raw)
          if (saved && saved.app && saved.app.colorScheme === 'dark') {
            document.documentElement.classList.add('dark')
          }
          if (saved && saved.app && saved.app.enableMotion === false) {
            document.documentElement.dataset.motion = 'off'
          }
        }
        catch (error) {
          /* 使用默认值：开启动效 */
        }
      })()
    </script>
    <meta name="application-name" content="MRR" />
    <!-- 亮色沿用品牌主色；暗色系统下改用暗色导航底，避免浏览器标题栏一条明亮色带压在暗色界面上。 -->
    <meta name="theme-color" content="#2563EB" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#131821" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="MRR" />
    <meta http-equiv="Expires" content="0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Cache-control" content="no-cache">
    <meta http-equiv="Cache" content="no-cache">
    <title>%VITE_APP_TITLE%</title>
  </head>
  <body>
    <div id="browser-compat-blocker" role="alert" aria-live="assertive" aria-atomic="true">
      <div class="browser-compat-content">
        <div class="browser-compat-icon" aria-hidden="true">!</div>
        <div class="browser-compat-copy">
          <div id="browser-compat-title" class="browser-compat-title">浏览器不受支持</div>
          <div id="browser-compat-message" class="browser-compat-message">
            当前浏览器缺少系统启动所需的关键运行能力，请更换浏览器后重试。
          </div>
          <div id="browser-compat-requirement" class="browser-compat-requirement">
            正式验收基线：Edge 111、Chrome 86、Firefox 114、Safari 16.4。
          </div>
          <div id="browser-compat-actions" class="browser-compat-actions" hidden>
            <button id="browser-compat-reload" class="browser-compat-button" type="button">重新加载</button>
            <button id="browser-compat-back" class="browser-compat-button" type="button">返回上一页</button>
          </div>
        </div>
      </div>
    </div>
    <div data-app-loading id="mrr-startup-shell" hidden>
      <div class="startup-classic-loader" aria-hidden="true"></div>
      <div class="startup-status">
        <div class="startup-copy" role="status" aria-live="polite" aria-atomic="true">
          <h1 id="startup-title">正在启动 MRR</h1>
          <p id="startup-message">正在加载应用资源…</p>
        </div>
        <div class="startup-actions" id="startup-actions" hidden>
          <button class="browser-compat-button" id="startup-reload" type="button">重新加载</button>
          <button class="browser-compat-button" id="startup-back" type="button" hidden>返回上一页</button>
        </div>
      </div>
    </div>
    <aside id="browser-compat-notice" class="browser-compat-notice" hidden>
      <div role="status" class="startup-copy">
        <strong>当前浏览器版本较低</strong>
        <p id="browser-compat-notice-message"></p>
      </div>
      <button type="button" id="browser-compat-dismiss" class="browser-compat-button" aria-label="关闭兼容性提示">关闭</button>
    </aside>
    <noscript><p>MRR 需要 JavaScript 才能安全运行。请启用 JavaScript 后重新加载。</p></noscript>
    <div id="app"></div>
    <script>
      (function () {
        var minimumVersions = {
          Edge: '111',
          Chrome: '86',
          Firefox: '114',
          Safari: '16.4'
        }
        var revealTimer
        var startupTimeout
        var startupReady = false
        var startupFailed = false
        var compatibilityWarning = ''
        var shell = document.getElementById('mrr-startup-shell')
        var title = document.getElementById('startup-title')
        var message = document.getElementById('startup-message')
        var actions = document.getElementById('startup-actions')
        var notice = document.getElementById('browser-compat-notice')
        var blocker = document.getElementById('browser-compat-blocker')
        document.documentElement.setAttribute('data-mrr-startup', 'pending')

        function compareVersions(current, minimum) {
          var currentParts = String(current || '0').split('.')
          var minimumParts = String(minimum || '0').split('.')
          var length = Math.max(currentParts.length, minimumParts.length)
          var index

          for (index = 0; index < length; index += 1) {
            var currentPart = parseInt(currentParts[index] || '0', 10)
            var minimumPart = parseInt(minimumParts[index] || '0', 10)
            if (currentPart > minimumPart) {
              return 1
            }
            if (currentPart < minimumPart) {
              return -1
            }
          }
          return 0
        }

        function detectBrowser() {
          var userAgent = window.navigator.userAgent || ''
          var match

          if (document.documentMode || /MSIE|Trident\//.test(userAgent)) {
            return { name: 'Internet Explorer', version: '', unsupported: true }
          }

          match = userAgent.match(/Edge\/([\d.]+)/)
          if (match) {
            return { name: '旧版 Microsoft Edge', version: match[1], unsupported: true }
          }

          match = userAgent.match(/Edg\/([\d.]+)/)
          if (match) {
            return { name: 'Edge', version: match[1] }
          }

          match = userAgent.match(/Firefox\/([\d.]+)/)
          if (match) {
            return { name: 'Firefox', version: match[1] }
          }

          match = userAgent.match(/Version\/([\d.]+).*Safari\//)
          if (match && !/Chrome|Chromium|CriOS|Edg\//.test(userAgent)) {
            return { name: 'Safari', version: match[1] }
          }

          // Chromium 内核浏览器不一定携带 Chrome 标识，例如 Chromium 本身。
          // 低于认证版本仅作为预警；实际能力由启动检查决定。
          match = userAgent.match(/(?:Chrome|Chromium|CriOS)\/([\d.]+)/)
          if (match) {
            return { name: 'Chrome', version: match[1] }
          }

          return { name: '当前浏览器', version: '' }
        }

        function clearTimers() {
          window.clearTimeout(revealTimer)
          window.clearTimeout(startupTimeout)
        }

        function revealShell() {
          if (!startupReady && !window.__MRR_APP_STARTUP_BLOCKED__) {
            shell.hidden = false
          }
        }

        function goBack() {
          if (window.history.length > 1) {
            window.history.back()
          } else {
            window.location.href = '/'
          }
        }

        function blockApplication() {
          window.__MRR_APP_STARTUP_BLOCKED__ = true
          clearTimers()
          shell.hidden = true
          document.documentElement.setAttribute('data-mrr-startup', 'blocked')
          document.getElementById('browser-compat-message').textContent =
            '当前浏览器缺少系统启动所需的关键运行能力，请切换到现代浏览器后重试。'
          document.getElementById('browser-compat-actions').hidden = false
          blocker.style.display = 'flex'
        }

        function reportStartupFailure(kind) {
          if (startupReady || window.__MRR_APP_STARTUP_BLOCKED__) return
          startupFailed = true
          clearTimers()
          revealShell()
          shell.setAttribute('data-startup-state', 'failed')
          title.textContent = kind === 'resource' ? '应用资源加载失败' : '系统启动失败'
          message.textContent = window.navigator.onLine === false
            ? '当前设备处于离线状态。请恢复网络连接后重新加载。'
            : '请重新加载页面。若问题持续，请联系管理员检查网络或服务器。'
          actions.hidden = false
          document.getElementById('startup-back').hidden = false
        }

        function showStartupDelay() {
          if (startupReady || startupFailed || window.__MRR_APP_STARTUP_BLOCKED__) return
          window.__MRR_APP_STARTUP_DELAYED__ = true
          revealShell()
          shell.setAttribute('data-startup-state', 'slow')
          title.textContent = '系统仍在加载'
          message.textContent = '响应时间较长，系统会自动继续初始化。'
          actions.hidden = false
        }

        document.getElementById('startup-reload').addEventListener('click', function () {
          window.location.reload()
        })
        document.getElementById('startup-back').addEventListener('click', goBack)
        document.getElementById('browser-compat-reload').addEventListener('click', function () {
          window.location.reload()
        })
        document.getElementById('browser-compat-back').addEventListener('click', goBack)
        document.getElementById('browser-compat-dismiss').addEventListener('click', function () {
          notice.hidden = true
        })

        // Only non-polyfillable prerequisites are checked before the Vite polyfill bundle.
        // UA is not a capability or security check. IE document mode is an actual engine signal.
        if (document.documentMode || typeof window.Proxy !== 'function'
          || !('noModule' in document.createElement('script'))) {
          blockApplication()
          return
        }

        var browser = detectBrowser()
        var minimumVersion = minimumVersions[browser.name]
        if (browser.unsupported || (minimumVersion && compareVersions(browser.version, minimumVersion) < 0)) {
          compatibilityWarning = '检测到 ' + browser.name + ' ' + browser.version
            + '，低于正式验收基线。可以尝试继续使用，但部分功能可能受限，建议升级浏览器。'
        }

        revealTimer = window.setTimeout(revealShell, 500)
        startupTimeout = window.setTimeout(showStartupDelay, 15000)

        function updateStartupStage(event) {
          if (startupReady || startupFailed || window.__MRR_APP_STARTUP_BLOCKED__) return
          if (event.detail === 'runtime') {
            message.textContent = '正在初始化应用运行环境…'
          } else if (event.detail === 'route') {
            message.textContent = '正在完成会话校验与页面初始化…'
          } else if (event.detail === 'visual') {
            message.textContent = '正在准备首屏显示…'
          }
        }
        window.addEventListener('mrr:startup-stage', updateStartupStage)
        window.addEventListener('mrr:app-incompatible', blockApplication, { once: true })
        window.addEventListener('mrr:app-ready', function () {
          if (window.__MRR_APP_STARTUP_BLOCKED__) return
          startupReady = true
          window.__MRR_APP_STARTUP_READY__ = true
          window.__MRR_APP_STARTUP_DELAYED__ = false
          clearTimers()
          window.removeEventListener('mrr:startup-stage', updateStartupStage)
          window.removeEventListener('error', handleStartupError, true)
          window.removeEventListener('mrr:app-incompatible', blockApplication)
          document.documentElement.removeAttribute('data-mrr-startup')
          // Reveal ready content immediately; only a visible loader fades out.
          if (!shell.hidden && document.documentElement.dataset.motion !== 'off'
            && !window.matchMedia('(prefers-reduced-motion: reduce)').matches
            && !startupFailed) {
            shell.setAttribute('data-startup-state', 'leaving')
            shell.setAttribute('aria-hidden', 'true')
            window.setTimeout(function () {
              if (shell.parentNode) shell.parentNode.removeChild(shell)
            }, 150)
          } else {
            shell.parentNode.removeChild(shell)
          }
          if (compatibilityWarning) {
            document.getElementById('browser-compat-notice-message').textContent = compatibilityWarning
            notice.hidden = false
          }
        }, { once: true })
        window.addEventListener('mrr:app-startup-failed', function () {
          reportStartupFailure('runtime')
        }, { once: true })
        function handleStartupError(event) {
          var target = event.target
          if (target && (target.tagName === 'SCRIPT' || (target.tagName === 'LINK' && target.rel === 'stylesheet'))) {
            reportStartupFailure('resource')
          } else if (event.error) {
            reportStartupFailure('runtime')
          }
        }
        window.addEventListener('error', handleStartupError, true)
        // Noncritical async tasks can reject before the router is ready. Only explicit
        // startup failures or resource errors are shown here; business errors keep their own UI.
      })()
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
