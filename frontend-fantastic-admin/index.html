<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!--
      国产双核浏览器（360 安全/极速、QQ、搜狗、2345 等）访问内网 IP 时常默认切到 IE 兼容内核，
      直接落到「浏览器不受支持」拦截页。renderer / force-rendering 让它们优先使用 Chromium 内核；
      X-UA-Compatible 让仍处于 IE 内核的环境至少使用最高文档模式，拦截提示可以正常显示。
    -->
    <meta name="renderer" content="webkit" />
    <meta name="force-rendering" content="webkit" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!--
      预加载界面字体子集：登录页与导航首帧就会用到常规与中粗两档，
      不预加载时首屏先用系统字体渲染、字体到达后整体重排（FOUT），按钮宽度会跳一下。
      完整字库（约 4MB/个）只在出现子集外的生僻字时按 unicode-range 懒加载，不在此预加载。
    -->
    <link rel="preload" href="/fonts/harmonyos-sans-sc-ui-regular-8d2cc5f76603.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/harmonyos-sans-sc-ui-medium-472b22229854.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/pwa/icon-192.svg" />
    <link rel="stylesheet" href="/browser_upgrade/index.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
    <script>
      /*
       * 动效偏好必须在首帧之前写到根节点。
       * 设置 store 的 watch 虽然是 immediate，但要等 Pinia 初始化、设置读回之后才执行，
       * 关闭了动效的用户每次进入都会先看一遍入场动画。这里直接读本地缓存抢在渲染前设置。
       * 读取失败（隐私模式、旧的或损坏的存储）时静默跳过，由 store 的 watch 兜底。
       */
      (function () {
        try {
          var raw = window.localStorage.getItem('MRR-ADMIN:app-settings')
          if (!raw) {
            return
          }
          var saved = JSON.parse(raw)
          if (saved && saved.app && saved.app.enableMotion === false) {
            document.documentElement.dataset.motion = 'off'
          }
        }
        catch (error) {
          /* 使用默认值：开启动效 */
        }
      })()
    </script>
    <meta name="application-name" content="MRR" />
    <!-- 亮色沿用品牌图标蓝；暗色系统下改用暗色导航底，避免浏览器标题栏一条亮蓝压在暗色界面上。 -->
    <meta name="theme-color" content="#0b63ce" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#131821" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="MRR" />
    <meta http-equiv="Expires" content="0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Cache-control" content="no-cache">
    <meta http-equiv="Cache" content="no-cache">
    <title>%VITE_APP_TITLE%</title>
  </head>
  <body>
    <div id="browser-compat-blocker" role="alert" aria-live="assertive" aria-atomic="true">
      <div class="browser-compat-content">
        <div class="browser-compat-icon" aria-hidden="true">!</div>
        <div class="browser-compat-copy">
          <div id="browser-compat-title" class="browser-compat-title">浏览器不受支持</div>
          <div id="browser-compat-message" class="browser-compat-message">
            此系统无法在当前浏览器中继续运行，请升级浏览器后重试。
          </div>
          <div id="browser-compat-requirement" class="browser-compat-requirement">
            最低支持：Edge 111、Chrome 86、Firefox 114、Safari 16.4。
          </div>
          <div id="browser-compat-actions" class="browser-compat-actions" hidden>
            <button id="browser-compat-continue" class="browser-compat-button browser-compat-button-primary" type="button">继续等待</button>
            <button id="browser-compat-reload" class="browser-compat-button" type="button">重新加载</button>
            <button id="browser-compat-back" class="browser-compat-button" type="button">返回上一页</button>
          </div>
        </div>
      </div>
    </div>
    <div id="app"></div>
    <script>
      (function () {
        var minimumVersions = {
          Edge: '111',
          Chrome: '86',
          Firefox: '114',
          Safari: '16.4'
        }
        var startupTimeout
        var initialStartupTimeoutMs = 15000
        var continuedStartupTimeoutMs = 60000

        function compareVersions(current, minimum) {
          var currentParts = String(current || '0').split('.')
          var minimumParts = String(minimum || '0').split('.')
          var length = Math.max(currentParts.length, minimumParts.length)
          var index

          for (index = 0; index < length; index += 1) {
            var currentPart = parseInt(currentParts[index] || '0', 10)
            var minimumPart = parseInt(minimumParts[index] || '0', 10)
            if (currentPart > minimumPart) {
              return 1
            }
            if (currentPart < minimumPart) {
              return -1
            }
          }
          return 0
        }

        function detectBrowser() {
          var userAgent = window.navigator.userAgent || ''
          var match

          if (document.documentMode || /MSIE|Trident\//.test(userAgent)) {
            return { name: 'Internet Explorer', version: '', unsupported: true }
          }

          match = userAgent.match(/Edge\/([\d.]+)/)
          if (match) {
            return { name: '旧版 Microsoft Edge', version: match[1], unsupported: true }
          }

          match = userAgent.match(/Edg\/([\d.]+)/)
          if (match) {
            return { name: 'Edge', version: match[1] }
          }

          match = userAgent.match(/Firefox\/([\d.]+)/)
          if (match) {
            return { name: 'Firefox', version: match[1] }
          }

          match = userAgent.match(/Version\/([\d.]+).*Safari\//)
          if (match && !/Chrome|Chromium|CriOS|Edg\//.test(userAgent)) {
            return { name: 'Safari', version: match[1] }
          }

          // Chromium 内核浏览器不一定携带 Chrome 标识，例如 Chromium 本身。
          // 统一按内核主版本判断，低于 86 时必须显示升级提示。
          match = userAgent.match(/(?:Chrome|Chromium|CriOS)\/([\d.]+)/)
          if (match) {
            return { name: 'Chrome', version: match[1] }
          }

          return { name: '当前浏览器', version: '' }
        }

        function lacksRequiredFeatures() {
          // 这里只检测会阻断应用启动的基础能力。color-mix()、backdrop-filter
          // 等视觉增强能力允许在 Chrome 86 中降级，不能作为启动阻断条件。
          return typeof window.Promise !== 'function'
            || typeof window.fetch !== 'function'
            || typeof window.URL !== 'function'
            || typeof window.TextEncoder !== 'function'
            || typeof Array.prototype.at !== 'function'
            || typeof Array.prototype.findLast !== 'function'
        }

        function showApplicationOverlay(reason, title, options) {
          var blocker = document.getElementById('browser-compat-blocker')
          var message = document.getElementById('browser-compat-message')
          var titleElement = document.getElementById('browser-compat-title')
          var requirement = document.getElementById('browser-compat-requirement')
          var actions = document.getElementById('browser-compat-actions')

          if (!blocker || !message || !titleElement || !requirement || !actions) {
            return
          }

          titleElement.textContent = title
          message.textContent = reason
          requirement.textContent = options.requirement || ''
          requirement.style.display = options.requirement ? 'block' : 'none'
          actions.hidden = !options.showActions
          blocker.style.display = 'flex'
        }

        function hideRecoverableOverlay() {
          var blocker = document.getElementById('browser-compat-blocker')
          var actions = document.getElementById('browser-compat-actions')

          if (window.__MRR_APP_STARTUP_BLOCKED__) {
            return
          }
          window.__MRR_APP_STARTUP_DELAYED__ = false
          if (actions) {
            actions.hidden = true
          }
          if (blocker) {
            blocker.style.display = 'none'
          }
        }

        function blockApplication(reason, title) {
          window.__MRR_APP_STARTUP_BLOCKED__ = true
          window.clearTimeout(startupTimeout)
          showApplicationOverlay(reason, title, {
            requirement: '最低支持：Edge 111、Chrome 86、Firefox 114、Safari 16.4。',
            showActions: false
          })
        }

        function reportStartupFailure(reason) {
          if (window.__MRR_APP_STARTUP_READY__ || window.__MRR_APP_STARTUP_BLOCKED__) {
            return
          }
          blockApplication(reason, '系统启动失败')
        }

        function showStartupDelay() {
          if (window.__MRR_APP_STARTUP_READY__ || window.__MRR_APP_STARTUP_BLOCKED__) {
            return
          }
          window.__MRR_APP_STARTUP_DELAYED__ = true
          showApplicationOverlay(
            '当前网络速度较慢或服务器响应时间较长，系统仍在后台加载。您可以继续等待，也可以重新加载页面。',
            '系统启动较慢',
            {
              requirement: '继续等待不会绕过登录、权限或安全校验。',
              showActions: true
            }
          )
        }

        function scheduleStartupTimeout(timeout) {
          window.clearTimeout(startupTimeout)
          startupTimeout = window.setTimeout(showStartupDelay, timeout)
        }

        var continueButton = document.getElementById('browser-compat-continue')
        var reloadButton = document.getElementById('browser-compat-reload')
        var backButton = document.getElementById('browser-compat-back')

        if (continueButton) {
          continueButton.addEventListener('click', function () {
            hideRecoverableOverlay()
            scheduleStartupTimeout(continuedStartupTimeoutMs)
          })
        }
        if (reloadButton) {
          reloadButton.addEventListener('click', function () {
            window.location.reload()
          })
        }
        if (backButton) {
          backButton.addEventListener('click', function () {
            if (window.history.length > 1) {
              window.history.back()
            } else {
              window.location.href = '/'
            }
          })
        }

        var browser = detectBrowser()
        if (browser.unsupported) {
          blockApplication('检测到不受支持的 ' + browser.name + '。请使用受支持版本的浏览器访问系统。', '浏览器不受支持')
          return
        }

        var minimumVersion = minimumVersions[browser.name]
        if (minimumVersion && compareVersions(browser.version, minimumVersion) < 0) {
          blockApplication(
            '检测到 ' + browser.name + ' ' + browser.version + '，低于最低支持版本 ' + browser.name + ' ' + minimumVersion + '。请升级浏览器后重试。',
            '浏览器不受支持'
          )
          return
        }

        if (!minimumVersion && lacksRequiredFeatures()) {
          blockApplication('当前浏览器缺少系统运行所需的关键功能，请升级浏览器后重试。', '浏览器不受支持')
          return
        }

        scheduleStartupTimeout(initialStartupTimeoutMs)

        window.addEventListener('mrr:app-ready', function () {
          window.__MRR_APP_STARTUP_READY__ = true
          window.clearTimeout(startupTimeout)
          hideRecoverableOverlay()
        }, { once: true })

        window.addEventListener('mrr:app-startup-failed', function () {
          reportStartupFailure('系统启动失败。请刷新页面；若问题持续，请联系管理员并提供浏览器版本信息。')
        }, { once: true })

        window.addEventListener('error', function (event) {
          var target = event.target
          if (event.error || (target && target.tagName === 'SCRIPT')) {
            reportStartupFailure('系统启动失败。请刷新页面；若问题持续，请联系管理员并提供浏览器版本信息。')
          }
        }, true)

        window.addEventListener('unhandledrejection', function () {
          reportStartupFailure('系统启动失败。请刷新页面；若问题持续，请联系管理员并提供浏览器版本信息。')
        })
      })()
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
