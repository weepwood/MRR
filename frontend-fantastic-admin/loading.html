<style>
:root {
  color-scheme: light;
  --loading-bg: #f4f8fb;
  --loading-card: rgb(255 255 255 / 82%);
  --loading-text: #102a43;
  --loading-muted: #627d98;
  --loading-accent: #168aad;
  --loading-accent-soft: rgb(22 138 173 / 14%);
  --loading-border: rgb(22 138 173 / 16%);
}

@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --loading-bg: #0d1b2a;
    --loading-card: rgb(18 36 54 / 82%);
    --loading-text: #e6f1f5;
    --loading-muted: #9fb3c8;
    --loading-accent: #55c2d8;
    --loading-accent-soft: rgb(85 194 216 / 16%);
    --loading-border: rgb(85 194 216 / 18%);
  }
}

* { box-sizing: border-box; }

html,
body {
  width: 100%;
  height: 100%;
  margin: 0;
}

body {
  overflow: hidden;
  font-family: Inter, "Segoe UI", "Microsoft YaHei", sans-serif;
  background: var(--loading-bg);
}

.loading-container {
  position: fixed;
  inset: 0;
  z-index: 10000;
  display: grid;
  overflow: hidden;
  color: var(--loading-text);
  background:
    radial-gradient(circle at 16% 12%, var(--loading-accent-soft), transparent 30%),
    radial-gradient(circle at 86% 88%, var(--loading-accent-soft), transparent 32%),
    var(--loading-bg);
  place-items: center;
  user-select: none;
}

.loading-container::before,
.loading-container::after {
  position: absolute;
  width: 22rem;
  height: 22rem;
  content: "";
  border: 1px solid var(--loading-border);
  border-radius: 50%;
  opacity: 0.65;
}

.loading-container::before { transform: translate(-42vw, -34vh); }
.loading-container::after { transform: translate(42vw, 34vh) scale(0.72); }

.loading-shell {
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  width: min(360px, calc(100vw - 40px));
  padding: 42px 32px 34px;
  text-align: center;
  background: var(--loading-card);
  border: 1px solid var(--loading-border);
  border-radius: 24px;
  box-shadow: 0 24px 70px rgb(16 42 67 / 12%), inset 0 1px rgb(255 255 255 / 70%);
  backdrop-filter: blur(18px);
}

.loading-mark {
  display: grid;
  width: 72px;
  height: 72px;
  margin-bottom: 24px;
  color: var(--loading-accent);
  background: var(--loading-accent-soft);
  border: 1px solid var(--loading-border);
  border-radius: 22px;
  box-shadow: 0 10px 28px var(--loading-accent-soft);
  place-items: center;
}

.loading {
  position: relative;
  width: 34px;
  height: 34px;
  animation: loading-rotate 1.8s linear infinite;
}

.loading::before,
.loading::after,
.loading .square::before,
.loading .square::after {
  position: absolute;
  width: 8px;
  height: 8px;
  content: "";
  background: currentcolor;
  border-radius: 50%;
  box-shadow: 0 0 0 4px var(--loading-accent-soft);
}

.loading::before { top: 0; left: 13px; }
.loading::after { top: 13px; right: 0; }
.loading .square::before { right: 13px; bottom: 0; }
.loading .square::after { bottom: 13px; left: 0; }

.loading .square {
  position: absolute;
  inset: 0;
}

@keyframes loading-rotate {
  to { transform: rotate(360deg); }
}

.name {
  max-width: 100%;
  overflow: hidden;
  font-size: clamp(20px, 4vw, 24px);
  font-weight: 700;
  letter-spacing: 0.02em;
  line-height: 1.4;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.tips {
  display: inline-flex;
  align-items: center;
  margin-top: 10px;
  font-size: 14px;
  color: var(--loading-muted);
  line-height: 1.5;
}

.tips::after {
  width: 1.2em;
  overflow: hidden;
  content: "…";
  text-align: left;
}

@media (prefers-reduced-motion: reduce) {
  .loading { animation: none; }
}
</style>

<div class="loading-container" role="status" aria-live="polite" aria-busy="true">
  <div class="loading-shell">
    <div class="loading-mark" aria-hidden="true">
      <div class="loading">
        <div class="square"></div>
      </div>
    </div>
    <div class="name">%VITE_APP_TITLE%</div>
    <div class="tips">正在加载</div>
  </div>
</div>
