map $uri $mrr_cache_control {
    default     "no-cache";
    ~^/assets/  "public, max-age=31536000, immutable";
}

server {
    listen       80;
    server_name  localhost;
    server_tokens off;

    root   /usr/share/nginx/html;
    index  index.html;

    sendfile on;
    tcp_nopush on;

    # 优先直接发送 Vite 生成的 .gz 文件，避免每次请求动态压缩。
    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/javascript image/svg+xml application/wasm;

    # 缓存静态文件元数据，降低高并发下的文件系统查询开销。
    open_file_cache max=1000 inactive=60s;
    open_file_cache_valid 120s;
    open_file_cache_min_uses 2;
    open_file_cache_errors off;

    # Vite 的 /assets/ 文件名包含内容哈希，可长期缓存；HTML 和接口始终重新验证。
    add_header Cache-Control $mrr_cache_control always;

    # 安全策略头
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https:; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self';" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    location ^~ /assets/ {
        try_files $uri =404;
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:18045;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
