map $uri $mrr_cache_control {
    default                             "no-cache";
    ~^/assets/                          "public, max-age=31536000, immutable";
    ~^/browser_upgrade/                 "public, max-age=31536000, immutable";
    ~^/docs/internal/assets/            "private, max-age=31536000, immutable";
    ~^/docs/assets/                     "private, max-age=31536000, immutable";
}

map $http_x_forwarded_proto $mrr_forwarded_proto {
    default $scheme;
    https   https;
}

upstream mrr_backend {
    server backend:18045;
    keepalive 32;
}

server {
    listen       80;
    server_name  localhost;
    server_tokens off;

    root   /usr/share/nginx/html;
    index  index.html;

    sendfile on;
    tcp_nopush on;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/javascript image/svg+xml application/wasm;

    open_file_cache max=2000 inactive=60s;
    open_file_cache_valid 120s;
    open_file_cache_min_uses 2;
    open_file_cache_errors off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https:; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self';" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    location = /healthz.txt {
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        return 200 "ok\n";
    }

    location = /_documentation_access {
        internal;
        proxy_pass http://mrr_backend/api/v1/documentation/access;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $mrr_forwarded_proto;
    }

    location @documentation_login {
        return 302 /help?docsAuth=required;
    }

    location @documentation_forbidden {
        default_type application/json;
        return 403 '{"code":403,"message":"当前账号没有访问内部文档的权限"}';
    }

    location = /docs {
        return 301 /docs/;
    }

    location = /docs/internal {
        return 301 /docs/internal/;
    }

    location ^~ /docs/internal/assets/ {
        auth_request /_documentation_access;
        error_page 401 = @documentation_login;
        error_page 403 = @documentation_forbidden;
        add_header Cache-Control $mrr_cache_control always;
        try_files $uri =404;
        access_log off;
    }

    location ^~ /docs/internal/ {
        auth_request /_documentation_access;
        error_page 401 = @documentation_login;
        error_page 403 = @documentation_forbidden;
        add_header Cache-Control $mrr_cache_control always;
        try_files $uri $uri.html $uri/ /docs/internal/404.html;
    }

    location ^~ /docs/assets/ {
        auth_request /_documentation_access;
        error_page 401 = @documentation_login;
        error_page 403 = @documentation_forbidden;
        add_header Cache-Control $mrr_cache_control always;
        try_files $uri =404;
        access_log off;
    }

    location ^~ /docs/ {
        auth_request /_documentation_access;
        error_page 401 = @documentation_login;
        error_page 403 = @documentation_forbidden;
        add_header Cache-Control $mrr_cache_control always;
        try_files $uri $uri.html $uri/ /docs/404.html;
    }

    location = /api-docs {
        return 301 /api-docs/;
    }

    location = /api-docs/ {
        auth_request /_documentation_access;
        error_page 401 = @documentation_login;
        error_page 403 = @documentation_forbidden;
        proxy_pass http://mrr_backend/swagger-ui/index.html;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $mrr_forwarded_proto;
    }

    location ^~ /api-docs/ {
        auth_request /_documentation_access;
        error_page 401 = @documentation_login;
        error_page 403 = @documentation_forbidden;
        rewrite ^/api-docs/(.*)$ /swagger-ui/$1 break;
        proxy_pass http://mrr_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $mrr_forwarded_proto;
    }

    location ^~ /swagger-ui/ {
        auth_request /_documentation_access;
        error_page 401 = @documentation_login;
        error_page 403 = @documentation_forbidden;
        proxy_pass http://mrr_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $mrr_forwarded_proto;
    }

    location ^~ /v3/api-docs {
        auth_request /_documentation_access;
        error_page 401 = @documentation_login;
        error_page 403 = @documentation_forbidden;
        proxy_pass http://mrr_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $mrr_forwarded_proto;
    }

    location /api/ {
        proxy_pass http://mrr_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $mrr_forwarded_proto;
    }

    location / {
        add_header Cache-Control $mrr_cache_control always;
        proxy_pass http://mrr_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $mrr_forwarded_proto;
    }
}
