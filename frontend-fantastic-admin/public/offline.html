<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b63ce" />
    <title>MRR 暂时无法连接</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
        background: #f5f7fa;
        color: #172033;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(circle at top left, rgba(20, 118, 223, 0.14), transparent 36%),
          #f5f7fa;
      }

      main {
        width: min(100%, 520px);
        padding: 32px;
        border: 1px solid rgba(15, 67, 123, 0.12);
        border-radius: 20px;
        background: rgba(255, 255, 255, 0.94);
        box-shadow: 0 18px 50px rgba(17, 44, 78, 0.12);
      }

      img {
        width: 72px;
        height: 72px;
        display: block;
        margin-bottom: 22px;
      }

      h1 {
        margin: 0 0 12px;
        font-size: 24px;
      }

      p {
        margin: 0;
        color: #556176;
        line-height: 1.75;
      }

      .notice {
        margin-top: 18px;
        padding: 14px 16px;
        border-radius: 12px;
        background: #eef6ff;
        color: #184d83;
        font-size: 14px;
      }

      button {
        width: 100%;
        margin-top: 24px;
        padding: 12px 18px;
        border: 0;
        border-radius: 12px;
        background: #0b63ce;
        color: #fff;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }

      button:focus-visible {
        outline: 3px solid rgba(11, 99, 206, 0.28);
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/pwa/icon-192.svg" alt="MRR" />
      <h1>暂时无法连接 MRR 服务</h1>
      <p>请检查内网、VPN、服务器或代理连接。恢复连接后重新加载即可继续使用。</p>
      <div class="notice">出于病案数据安全考虑，MRR 不会离线保存业务接口响应、患者信息或影像内容。</div>
      <button type="button" onclick="window.location.reload()">重新加载</button>
    </main>
  </body>
</html>
