global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    project: mrr

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: mrr-backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["backend:18046"]

  - job_name: mrr-postgresql
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: mrr-node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
