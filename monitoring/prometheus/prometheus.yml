global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    project: mrr

rule_files:
  - rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["127.0.0.1:9093"]

scrape_configs:
  - job_name: mrr-backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["127.0.0.1:18046"]

  - job_name: mrr-postgresql
    static_configs:
      - targets: ["127.0.0.1:9187"]

  # 当前项目主要运行在 Windows，windows_exporter 默认监听 9182。
  # Linux 部署可将目标改为 node_exporter 的 127.0.0.1:9100。
  - job_name: mrr-host
    static_configs:
      - targets: ["127.0.0.1:9182"]

  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]
