groups:
  - name: mrr-availability
    rules:
      - alert: MrrBackendDown
        expr: up{job="mrr-backend"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: MRR 后端监控端点不可用
          description: Prometheus 连续 1 分钟无法抓取 MRR Actuator 指标。

      - alert: MrrPostgreSQLDown
        expr: up{job="mrr-postgresql"} == 0 OR pg_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: PostgreSQL 不可用
          description: postgres_exporter 连续 1 分钟无法连接数据库。

      - alert: MrrHttp5xxRateHigh
        expr: |
          sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m]))
          /
          clamp_min(sum(rate(http_server_requests_seconds_count[5m])), 0.001) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: MRR HTTP 5xx 错误率超过 5%
          description: 后端连续 5 分钟出现较高服务端错误率，请使用 requestId/traceId 检索错误日志。

      - alert: MrrHttpP95LatencyHigh
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(http_server_requests_seconds_bucket[10m]))
          ) > 3
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: MRR API P95 响应时间超过 3 秒
          description: API P95 延迟连续 10 分钟超过性能预算。

  - name: mrr-database
    rules:
      - alert: MrrDatabaseConnectionsHigh
        expr: sum(pg_stat_activity_count{datname="imgapi"}) / clamp_min(max(pg_settings_max_connections), 1) > 0.80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: PostgreSQL 连接使用率超过 80%
          description: 数据库连接连续 5 分钟高于最大连接数的 80%。

      - alert: MrrDatabaseConnectionsCritical
        expr: sum(pg_stat_activity_count{datname="imgapi"}) / clamp_min(max(pg_settings_max_connections), 1) > 0.90
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: PostgreSQL 连接使用率超过 90%
          description: 数据库连接接近耗尽，可能导致新请求失败。

      - alert: MrrDatabaseDeadlockDetected
        expr: increase(pg_stat_database_deadlocks{datname="imgapi"}[5m]) > 0
        labels:
          severity: critical
        annotations:
          summary: PostgreSQL 检测到死锁
          description: 最近 5 分钟数据库出现死锁，请检查事务与锁等待。

      - alert: MrrHikariPoolPending
        expr: hikaricp_connections_pending{application="imgapi"} > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: HikariCP 出现连接等待
          description: 后端线程连续 2 分钟等待数据库连接。

      - alert: MrrHikariPoolNearExhaustion
        expr: hikaricp_connections_active{application="imgapi"} / clamp_min(hikaricp_connections_max{application="imgapi"}, 1) > 0.90
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: HikariCP 连接池接近耗尽
          description: 活跃连接连续 2 分钟超过连接池上限的 90%。

      - alert: MrrHikariConnectionTimeout
        expr: increase(hikaricp_connections_timeout_total{application="imgapi"}[5m]) > 0
        labels:
          severity: critical
        annotations:
          summary: HikariCP 获取连接超时
          description: 最近 5 分钟发生数据库连接获取超时。

  - name: mrr-audit
    rules:
      - alert: MrrAuditPersistenceFailed
        expr: increase(mrr_audit_persist_total{result="failed"}[5m]) > 0
        labels:
          severity: critical
        annotations:
          summary: 关键审计事件无法持久化
          description: 审计事件同时写入 PostgreSQL 和本地持久化队列失败，需要立即处理。

      - alert: MrrAuditSpoolBacklog
        expr: mrr_audit_spool_events > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 审计事件正在本地队列等待重放
          description: PostgreSQL 写入曾失败，当前仍有审计事件等待重新写入数据库。

      - alert: MrrAuditSpoolCritical
        expr: mrr_audit_spool_events > 10000
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: 审计持久化队列严重积压
          description: 等待重放的审计事件超过 10000 条，readiness 将进入 OUT_OF_SERVICE。

  - name: mrr-jvm
    rules:
      - alert: MrrJvmHeapHigh
        expr: |
          sum(jvm_memory_used_bytes{area="heap",application="imgapi"})
          /
          clamp_min(sum(jvm_memory_max_bytes{area="heap",application="imgapi"}), 1) > 0.85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: MRR JVM 堆内存使用率超过 85%
          description: 请结合 JFR、GC 日志和请求负载检查内存增长原因。

      - alert: MrrJvmGcPauseHigh
        expr: rate(jvm_gc_pause_seconds_sum{application="imgapi"}[5m]) > 0.10
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: MRR JVM GC 暂停时间偏高
          description: 最近 5 分钟每秒平均 GC 暂停超过 100ms。

  - name: mrr-capacity
    rules:
      - alert: MrrHostDiskSpaceLow
        expr: |
          (
            windows_logical_disk_free_bytes{volume!~"HarddiskVolume.*"}
            /
            clamp_min(windows_logical_disk_size_bytes{volume!~"HarddiskVolume.*"}, 1)
          ) < 0.15
          or
          (
            node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"}
            /
            clamp_min(node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs"}, 1)
          ) < 0.15
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: 主机磁盘可用空间低于 15%
          description: 磁盘 {{ $labels.volume }}{{ $labels.mountpoint }} 可用空间持续低于 15%。

      - alert: MrrHostDiskSpaceCritical
        expr: |
          (
            windows_logical_disk_free_bytes{volume!~"HarddiskVolume.*"}
            /
            clamp_min(windows_logical_disk_size_bytes{volume!~"HarddiskVolume.*"}, 1)
          ) < 0.08
          or
          (
            node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"}
            /
            clamp_min(node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs"}, 1)
          ) < 0.08
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: 主机磁盘可用空间低于 8%
          description: 磁盘 {{ $labels.volume }}{{ $labels.mountpoint }} 即将耗尽。

      - alert: MrrDatabaseGrowthAbnormal
        expr: |
          (mrr_database_size_bytes - mrr_database_size_bytes offset 24h)
          /
          clamp_min(mrr_database_size_bytes offset 24h, 1) > 0.10
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: MRR 数据库 24 小时增长超过 10%
          description: 请检查批量导入、审计日志增长、索引膨胀和异常任务。

  - name: mrr-data-quality
    rules:
      - alert: MrrDataQualityCriticalIssues
        expr: mrr_data_quality_issues{severity="CRITICAL"} > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: MRR 数据质量检查发现严重问题
          description: 最近一次手动检查中，{{ $labels.check_code }} 发现 {{ $value }} 条严重异常。

      - alert: MrrDataQualityRunStuck
        expr: mrr_data_quality_running == 1
        for: 30m
        labels:
          severity: critical
        annotations:
          summary: 数据质量检查运行超过 30 分钟
          description: 手动检查可能卡住，请检查数据库锁和后端日志。
