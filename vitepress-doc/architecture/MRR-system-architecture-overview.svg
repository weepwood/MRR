<rect width="1400" height="850" fill="#f8fafc"/><text class="t" x="700" y="36" text-anchor="middle">MRR 医疗病案与影像档案管理系统 · 总体架构</text><text class="s" x="700" y="60" text-anchor="middle">Vue 3 SPA + Spring Boot 4 + PostgreSQL 16 + 本地 / OSS 影像存储</text>
