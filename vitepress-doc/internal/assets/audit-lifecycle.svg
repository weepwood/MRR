<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" role="img" aria-labelledby="title desc">
<title id="title">默认访问审计可靠性边界</title>
<desc id="desc">异步内存模式：监控不等于持久性；请求完成：生成审计记录，异步提交；内存缓冲：等待及在途 1000，满容量可能丢弃；数据库写入：批量写入与重试，核对已有记录；监控处置：积压 / 丢弃指标，核对采集及通知；进程崩溃、停机超时及拒绝提交仍有丢失风险；不把重启归零当作恢复。</desc>
<rect width="960" height="340" rx="18" fill="#f1f5f9"/>
<g font-family="HarmonyOS Sans SC, Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif">
<text x="32" y="44" font-size="26" font-weight="700" fill="#020817">默认访问审计可靠性边界</text>
<text x="32" y="72" font-size="15" fill="#526175">异步内存模式：监控不等于持久性</text>
<rect x="32.0" y="101" width="206.0" height="163" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
<rect x="44.0" y="114" width="34" height="27" rx="7" fill="#2563eb"/>
<text x="61.0" y="133" font-size="14" font-weight="700" text-anchor="middle" fill="#fff">01</text>
<text x="46.0" y="164" font-size="20" font-weight="700" fill="#020817">请求完成</text>
<text x="46.0" y="190" font-size="14" fill="#42536a">生成审计记录</text>
<text x="46.0" y="212" font-size="14" fill="#42536a">异步提交</text>
<path d="M242.0 182 h16 m-6 -6 6 6 -6 6" stroke="#8194a8" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="262.0" y="101" width="206.0" height="163" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
<rect x="274.0" y="114" width="34" height="27" rx="7" fill="#367c68"/>
<text x="291.0" y="133" font-size="14" font-weight="700" text-anchor="middle" fill="#fff">02</text>
<text x="276.0" y="164" font-size="20" font-weight="700" fill="#020817">内存缓冲</text>
<text x="276.0" y="190" font-size="14" fill="#42536a">等待及在途 1000</text>
<text x="276.0" y="212" font-size="14" fill="#42536a">满容量可能丢弃</text>
<path d="M472.0 182 h16 m-6 -6 6 6 -6 6" stroke="#8194a8" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="492.0" y="101" width="206.0" height="163" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
<rect x="504.0" y="114" width="34" height="27" rx="7" fill="#5b648d"/>
<text x="521.0" y="133" font-size="14" font-weight="700" text-anchor="middle" fill="#fff">03</text>
<text x="506.0" y="164" font-size="20" font-weight="700" fill="#020817">数据库写入</text>
<text x="506.0" y="190" font-size="14" fill="#42536a">批量写入与重试</text>
<text x="506.0" y="212" font-size="14" fill="#42536a">核对已有记录</text>
<path d="M702.0 182 h16 m-6 -6 6 6 -6 6" stroke="#8194a8" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="722.0" y="101" width="206.0" height="163" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
<rect x="734.0" y="114" width="34" height="27" rx="7" fill="#987444"/>
<text x="751.0" y="133" font-size="14" font-weight="700" text-anchor="middle" fill="#fff">04</text>
<text x="736.0" y="164" font-size="20" font-weight="700" fill="#020817">监控处置</text>
<text x="736.0" y="190" font-size="14" fill="#42536a">积压 / 丢弃指标</text>
<text x="736.0" y="212" font-size="14" fill="#42536a">核对采集及通知</text>
<rect x="32" y="282" width="896" height="38" rx="8" fill="#e2e8f0"/>
<text x="48" y="306" font-size="14" fill="#34465a">进程崩溃、停机超时及拒绝提交仍有丢失风险；不把重启归零当作恢复。</text>
</g></svg>
