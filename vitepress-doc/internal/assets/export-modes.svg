<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 490" role="img" aria-labelledby="title desc">
<title id="title">导出执行模式与归属</title>
<desc id="desc">计划决定客户端 PDF、后台流或后台任务三种模式，结果必须属于当前请求</desc>
<rect width="900" height="490" rx="16" fill="#f5f7fa"/>
<g font-family="HarmonyOS Sans SC, Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" fill="#223344">
<text x="28" y="41" font-size="25" font-weight="700" fill="#26394b" text-anchor="start">导出执行模式与结果归属</text><text x="28" y="70" font-size="15" font-weight="400" fill="#526678" text-anchor="start">同一业务入口，根据实际文件范围和资源预算选择执行方式</text><rect x="280" y="90" width="340" height="55" rx="10" fill="#e1efea" stroke="#9dbeb1"/><text x="450" y="124" font-size="20" font-weight="700" fill="#26394b" text-anchor="middle">实际选页 / 整案 → 请求计划</text><path d="M450 145 V168 H162 V186 M450 168 V186 M450 168 H738 V186" fill="none" stroke="#78909e" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><rect x="28" y="186" width="268" height="132" rx="10" fill="#fff" stroke="#d5dfe5"/><text x="46" y="220" font-size="21" font-weight="700" fill="#26394b" text-anchor="start">CLIENT_PDF</text><text x="46" y="248" font-size="17" font-weight="400" fill="#26394b" text-anchor="start">浏览器取图与解码</text><text x="46" y="272" font-size="17" font-weight="400" fill="#26394b" text-anchor="start">在预算内生成 Blob</text><text x="46" y="296" font-size="17" font-weight="400" fill="#26394b" text-anchor="start">离页取消失效读取</text><rect x="316" y="186" width="268" height="132" rx="10" fill="#fff" stroke="#d5dfe5"/><text x="334" y="220" font-size="21" font-weight="700" fill="#26394b" text-anchor="start">BACKEND_STREAM</text><text x="334" y="248" font-size="17" font-weight="400" fill="#26394b" text-anchor="start">后端直接生成文件流</text><text x="334" y="272" font-size="17" font-weight="400" fill="#26394b" text-anchor="start">检查响应和内容</text><text x="334" y="296" font-size="17" font-weight="400" fill="#26394b" text-anchor="start">仅保存当前请求结果</text><rect x="604" y="186" width="268" height="132" rx="10" fill="#fff" stroke="#d5dfe5"/><text x="622" y="220" font-size="21" font-weight="700" fill="#26394b" text-anchor="start">BACKEND_JOB</text><text x="622" y="248" font-size="17" font-weight="400" fill="#26394b" text-anchor="start">服务端创建后台任务</text><text x="622" y="272" font-size="17" font-weight="400" fill="#26394b" text-anchor="start">轮询、取消与重新下载</text><text x="622" y="296" font-size="17" font-weight="400" fill="#26394b" text-anchor="start">检查任务终态</text><path d="M162 318 V342 H450 M450 318 V357 M738 318 V342 H450" fill="none" stroke="#78909e" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><rect x="245" y="357" width="410" height="55" rx="10" fill="#e1efea" stroke="#9dbeb1"/><text x="450" y="391" font-size="20" font-weight="700" fill="#26394b" text-anchor="middle">核对请求归属 → 保存当前文件</text><rect x="28" y="432" width="844" height="42" rx="7" fill="#e4edf0" stroke="none"/><text x="44" y="459" font-size="16" font-weight="400" fill="#26394b" text-anchor="start">旧任务、过期响应与改变后的选页不混用；后台取消以实际服务端状态为准。</text>
</g>
</svg>
