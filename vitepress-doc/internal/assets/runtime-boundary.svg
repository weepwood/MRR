<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-labelledby="title desc">
<title id="title">Windows 单机运行边界</title>
<desc id="desc">浏览器及 HIS 通过 Nginx 访问单体应用；应用分别访问 PostgreSQL 与配置的影像来源，监控独立观察。</desc>
<rect width="960" height="430" rx="18" fill="#f5f7fa"/>
<g font-family="HarmonyOS Sans SC, Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" fill="#182638">
<text x="32" y="44" font-size="26" font-weight="700">Windows 单机运行边界</text>
<text x="32" y="72" font-size="15" fill="#526175">模块化单体 · 数据库与文件来源是两条独立依赖</text>
<rect x="32" y="106" width="190" height="102" rx="12" fill="#fff" stroke="#d7e0e8"/>
<text x="50" y="142" font-size="19" font-weight="700">浏览器 / HIS</text>
<text x="50" y="170" font-size="14" fill="#42536a">访问业务与受控调阅</text>
<rect x="259" y="106" width="190" height="102" rx="12" fill="#fff" stroke="#d7e0e8"/>
<text x="277" y="142" font-size="19" font-weight="700">Nginx</text>
<text x="277" y="170" font-size="14" fill="#42536a">统一入口 / 外置文档</text>
<rect x="486" y="106" width="220" height="102" rx="12" fill="#e6f0ee" stroke="#91b9ad"/>
<text x="504" y="142" font-size="19" font-weight="700">Spring Boot JAR</text>
<text x="504" y="170" font-size="14" fill="#42536a">API / 授权 / 内嵌前端</text>
<rect x="744" y="89" width="184" height="108" rx="12" fill="#fff" stroke="#d7e0e8"/>
<text x="762" y="126" font-size="19" font-weight="700">PostgreSQL 16</text>
<text x="762" y="152" font-size="14" fill="#42536a">app 业务 Schema</text>
<rect x="744" y="221" width="184" height="108" rx="12" fill="#fff" stroke="#d7e0e8"/>
<text x="762" y="257" font-size="19" font-weight="700">影像来源</text>
<text x="762" y="282" font-size="14" fill="#42536a">本地 / NAS / HTTP</text>
<text x="762" y="304" font-size="14" fill="#42536a">Nginx / OSS</text>
<g stroke="#71879a" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
<path d="M222 157 H251 m-6 -6 6 6 -6 6 M449 157 H478 m-6 -6 6 6 -6 6 M706 143 H736 m-6 -6 6 6 -6 6 M706 176 H724 V275 H736 m-6 -6 6 6 -6 6"/>
<path d="M596 208 V241" stroke-dasharray="5 5"/>
</g>
<rect x="486" y="241" width="220" height="88" rx="12" fill="#fff" stroke="#d7e0e8"/>
<text x="504" y="275" font-size="18" font-weight="700">运维观察面</text>
<text x="504" y="301" font-size="14" fill="#42536a">Actuator / 可选监控</text>
<rect x="32" y="367" width="896" height="42" rx="8" fill="#e7edf2"/>
<text x="48" y="393" font-size="14" fill="#34465a">授权与业务逻辑由应用负责；运维端点、数据库及源文件不应直接暴露给普通用户。</text>
</g></svg>
