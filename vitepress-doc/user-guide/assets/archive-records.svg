<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="title desc">
<title id="title">病案资料关系图</title>
<desc id="desc">主档关联统计、扫描和装箱，患者按病案号遗留匹配</desc>
<rect width="900" height="430" rx="16" fill="#f1f5f9"/>
<g font-family="HarmonyOS Sans SC, Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" fill="#020817">
<text x="28" y="41" font-size="25" font-weight="700" fill="#020817" text-anchor="start">一份病案涉及哪些资料？</text><text x="28" y="70" font-size="15" font-weight="400" fill="#526678" text-anchor="start">主档是关联中心；遗留患者匹配需要单独核实</text><rect x="316" y="95" width="268" height="91" rx="10" fill="#eff6ff" stroke="#e2e8f0"/><text x="334" y="129" font-size="21" font-weight="700" fill="#020817" text-anchor="start">病案主档</text><text x="334" y="157" font-size="17" font-weight="400" fill="#020817" text-anchor="start">稳定编号 archive_id</text><path d="M450 186 V216 H162 V243 M450 216 V243 M450 216 H738 V243" fill="none" stroke="#78909e" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><rect x="28" y="243" width="268" height="106" rx="10" fill="#fff" stroke="#e2e8f0"/><text x="46" y="277" font-size="21" font-weight="700" fill="#020817" text-anchor="start">统计记录</text><text x="46" y="305" font-size="17" font-weight="400" fill="#020817" text-anchor="start">扫描页数、业务统计</text><text x="46" y="329" font-size="17" font-weight="400" fill="#020817" text-anchor="start">通过主档编号关联</text><rect x="316" y="243" width="268" height="106" rx="10" fill="#fff" stroke="#e2e8f0"/><text x="334" y="277" font-size="21" font-weight="700" fill="#020817" text-anchor="start">扫描记录</text><text x="334" y="305" font-size="17" font-weight="400" fill="#020817" text-anchor="start">图片元数据与页次</text><text x="334" y="329" font-size="17" font-weight="400" fill="#020817" text-anchor="start">通过主档编号关联</text><rect x="604" y="243" width="268" height="106" rx="10" fill="#fff" stroke="#e2e8f0"/><text x="622" y="277" font-size="21" font-weight="700" fill="#020817" text-anchor="start">实体装箱</text><text x="622" y="305" font-size="17" font-weight="400" fill="#020817" text-anchor="start">箱号、位置、状态</text><text x="622" y="329" font-size="17" font-weight="400" fill="#020817" text-anchor="start">通过主档编号关联</text><path d="M584 140 H635" fill="none" stroke="#78909e" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 5"/><rect x="635" y="95" width="237" height="91" rx="10" fill="#fff5e8" stroke="#ddc6a6"/><text x="652" y="128" font-size="19" font-weight="700" fill="#020817" text-anchor="start">患者基础资料</text><text x="652" y="155" font-size="16" font-weight="400" fill="#020817" text-anchor="start">按 BAH 遗留匹配</text><rect x="28" y="370" width="844" height="42" rx="7" fill="#e2e8f0" stroke="none"/><text x="44" y="397" font-size="16" font-weight="400" fill="#020817" text-anchor="start">关系异常时回到原始资料核对；患者匹配只是证据，不等于外键。</text>
</g>
</svg>
