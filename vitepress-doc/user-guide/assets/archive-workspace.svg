<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 575" role="img" aria-labelledby="title desc">
<title id="title">影像档案袋区域示意</title>
<desc id="desc">病案摘要、图片导航、阅读区域和操作区域的功能关系，非截图</desc>
<rect width="900" height="575" rx="16" fill="#f5f7fa"/>
<g font-family="HarmonyOS Sans SC, Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" fill="#223344">
<text x="28" y="41" font-size="25" font-weight="700" fill="#26394b" text-anchor="start">影像档案袋：四个主要区域</text><text x="28" y="70" font-size="15" font-weight="400" fill="#526678" text-anchor="start">标准浏览的功能布局示意 · 不包含实际医疗影像</text><rect x="28" y="95" width="844" height="398" rx="12" fill="#fff" stroke="#cad6df"/><rect x="43" y="110" width="814" height="53" rx="6" fill="#e6f0ed" stroke="none"/><text x="58" y="142" font-size="19" font-weight="700" fill="#26394b" text-anchor="start">01  病案摘要：BAH / SJH / 图片数量</text><rect x="43" y="174" width="215" height="253" rx="6" fill="#f2f5f8" stroke="#dce4eb"/><text x="57" y="204" font-size="18" font-weight="700" fill="#26394b" text-anchor="start">02  图片导航</text><text x="57" y="229" font-size="15" font-weight="400" fill="#26394b" text-anchor="start">类型筛选 · 缩略图</text><rect x="57" y="244" width="39" height="44" rx="4" fill="#fff" stroke="#b8c6d2"/><path d="M65 255 H87 M65 264 H87 M65 273 H82" fill="none" stroke="#78909e" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="109" y="271" font-size="16" font-weight="400" fill="#26394b" text-anchor="start">第 1 页</text><rect x="57" y="301" width="39" height="44" rx="4" fill="#fff" stroke="#b8c6d2"/><path d="M65 312 H87 M65 321 H87 M65 330 H82" fill="none" stroke="#78909e" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="109" y="328" font-size="16" font-weight="400" fill="#26394b" text-anchor="start">第 2 页</text><rect x="57" y="358" width="39" height="44" rx="4" fill="#fff" stroke="#b8c6d2"/><path d="M65 369 H87 M65 378 H87 M65 387 H82" fill="none" stroke="#78909e" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="109" y="385" font-size="16" font-weight="400" fill="#26394b" text-anchor="start">第 3 页</text><rect x="270" y="174" width="587" height="253" rx="6" fill="#e9eef2" stroke="#dce4eb"/><text x="287" y="204" font-size="18" font-weight="700" fill="#26394b" text-anchor="start">03  影像阅读区</text><rect x="453" y="216" width="204" height="190" rx="5" fill="#fff" stroke="#becbd5"/><text x="555" y="242" font-size="15" font-weight="700" fill="#26394b" text-anchor="middle">合成文书示意</text><path d="M475 267 H631" fill="none" stroke="#78909e" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M475 287 H613" fill="none" stroke="#78909e" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M475 307 H595" fill="none" stroke="#78909e" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M475 327 H631" fill="none" stroke="#78909e" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M475 347 H613" fill="none" stroke="#78909e" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M475 367 H595" fill="none" stroke="#78909e" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><rect x="43" y="437" width="814" height="41" rx="6" fill="#e6f0ed" stroke="none"/><text x="57" y="464" font-size="18" font-weight="700" fill="#26394b" text-anchor="start">04  操作区域</text><text x="273" y="464" font-size="17" font-weight="400" fill="#26394b" text-anchor="start">选择数量 · 打印 · ZIP · PDF</text><rect x="28" y="513" width="844" height="42" rx="7" fill="#e4edf0" stroke="none"/><text x="44" y="540" font-size="16" font-weight="400" fill="#26394b" text-anchor="start">先确认当前病案，再选择页面与输出范围；实际按钮受权限、设置限制。</text>
</g>
</svg>
