<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" role="img" aria-labelledby="title desc">
<title id="title">影像导出生命周期</title>
<desc id="desc">区分内容生成、文件下载与最终核对；确认范围：整案或已选图片，确认编号和数量；生成：直接或后台处理，查看进度和错误；下载：成功后保存文件，按条件重新下载；核对：打开文件确认页数，检查顺序和完整性；切换病案、取消或权限变更时，不将旧文件当作当前导出结果。</desc>
<rect width="960" height="340" rx="18" fill="#f1f5f9"/>
<g font-family="HarmonyOS Sans SC, Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif">
