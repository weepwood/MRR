<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 420" role="img" aria-labelledby="title desc">
<title id="title">病案查询表单区域</title>
<desc id="desc">基于实际 Mock 空态居中查询卡片，病案号与上架号同排，身份证号和查询按钮同排，下方规则和最近查询；合成示例。</desc>
<rect width="660" height="420" rx="12" fill="#f1f5f9"/>
<g font-family="HarmonyOS Sans SC, PingFang SC, Microsoft YaHei, sans-serif">
<rect x="50" y="26" width="560" height="368" rx="18" fill="#ffffff" stroke="#e2e8f0"/><text x="75" y="66" font-size="24" font-weight="700" fill="#020817" text-anchor="start">住院病案</text><text x="75" y="103" font-size="15" font-weight="400" fill="#020817" text-anchor="start">病案号</text><text x="335" y="103" font-size="15" font-weight="400" fill="#020817" text-anchor="start">上架号</text><rect x="75" y="112" width="250" height="35" rx="8" fill="#ffffff" stroke="#e2e8f0"/><text x="200.0" y="134.5" font-size="15" font-weight="400" fill="#020817" text-anchor="middle">00800001</text><rect x="335" y="112" width="250" height="35" rx="8" fill="#ffffff" stroke="#e2e8f0"/><text x="460.0" y="134.5" font-size="15" font-weight="400" fill="#020817" text-anchor="middle">上架号</text><text x="75" y="168" font-size="15" font-weight="400" fill="#020817" text-anchor="start">身份证号</text><rect x="75" y="178" width="418" height="35" rx="8" fill="#ffffff" stroke="#e2e8f0"/><text x="284.0" y="200.5" font-size="15" font-weight="400" fill="#020817" text-anchor="middle">身份证号</text><rect x="505" y="178" width="80" height="35" rx="8" fill="#2563eb" stroke="#2563eb"/><text x="545.0" y="200.5" font-size="15" font-weight="400" fill="#ffffff" text-anchor="middle">查询</text><text x="75" y="239" font-size="13" font-weight="400" fill="#64748b" text-anchor="start">病案号或上架号填写其一即可；高位病案号须同时填写上架号。</text><text x="75" y="259" font-size="13" font-weight="400" fill="#64748b" text-anchor="start">填写身份证号时优先按身份证查询，并列出关联病案。</text><path d="M75 276H585V276" fill="none" stroke="#e2e8f0" stroke-width="1"/><text x="75" y="309" font-size="18" font-weight="700" fill="#020817" text-anchor="start">最近查询</text><text x="585" y="309" font-size="14" font-weight="400" fill="#2563eb" text-anchor="end">全部记录</text><text x="330" y="354" font-size="15" font-weight="400" fill="#64748b" text-anchor="middle">还没有查询记录</text><circle cx="64" cy="118" r="15" fill="#2563eb" stroke="white" stroke-width="2"/><text x="64" y="123" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><circle cx="64" cy="184" r="15" fill="#2563eb" stroke="white" stroke-width="2"/><text x="64" y="189" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">2</text><circle cx="589" cy="191" r="15" fill="#2563eb" stroke="white" stroke-width="2"/><text x="589" y="196" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
</g>
</svg>
