<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" role="img" aria-labelledby="title desc">
<title id="title">病案编号查询决策图</title>
<desc id="desc">病案号、上架号和身份证三种查询方式以及高位病案号限制</desc>
<rect width="900" height="480" rx="16" fill="#f5f7fa"/>
<g font-family="HarmonyOS Sans SC, Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" fill="#223344">
<text x="28" y="41" font-size="25" font-weight="700" fill="#26394b" text-anchor="start">该用哪种编号查询？</text><text x="28" y="70" font-size="15" font-weight="400" fill="#526678" text-anchor="start">从已知信息开始，核对返回的病案身份</text><rect x="300" y="93" width="300" height="53" rx="10" fill="#e1efea" stroke="#9dbeb1"/><text x="450" y="126" font-size="21" font-weight="700" fill="#26394b" text-anchor="middle">你手头有什么信息？</text><path d="M450 146 V169 H162 V187 M450 169 V187 M450 169 H738 V187" fill="none" stroke="#78909e" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><rect x="28" y="187" width="268" height="120" rx="10" fill="#fff" stroke="#d5dfe5"/><text x="46" y="221" font-size="21" font-weight="700" fill="#26394b" text-anchor="start">病案号 BAH</text><text x="46" y="249" font-size="17" font-weight="400" fill="#26394b" text-anchor="start">小于 10000000：单独查</text><text x="46" y="273" font-size="17" font-weight="400" fill="#26394b" text-anchor="start">达到阈值：同时填写 SJH</text><rect x="316" y="187" width="268" height="120" rx="10" fill="#fff" stroke="#d5dfe5"/><text x="334" y="221" font-size="21" font-weight="700" fill="#26394b" text-anchor="start">上架号 SJH</text><text x="334" y="249" font-size="17" font-weight="400" fill="#26394b" text-anchor="start">非空、唯一时可单独查</text><text x="334" y="273" font-size="17" font-weight="400" fill="#26394b" text-anchor="start">核对原始归档编号</text><rect x="604" y="187" width="268" height="120" rx="10" fill="#fff" stroke="#d5dfe5"/><text x="622" y="221" font-size="21" font-weight="700" fill="#26394b" text-anchor="start">身份证查询</text><text x="622" y="249" font-size="17" font-weight="400" fill="#26394b" text-anchor="start">在查询表单中输入</text><text x="622" y="273" font-size="17" font-weight="400" fill="#26394b" text-anchor="start">选择正确关联病案</text><path d="M162 307 V327 H450 M450 307 V344 M738 307 V327 H450" fill="none" stroke="#78909e" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><rect x="260" y="344" width="380" height="54" rx="10" fill="#e1efea" stroke="#9dbeb1"/><text x="450" y="378" font-size="20" font-weight="700" fill="#26394b" text-anchor="middle">核对病案、上架号与返回摘要</text><rect x="28" y="419" width="844" height="42" rx="7" fill="#e4edf0" stroke="none"/><text x="44" y="446" font-size="16" font-weight="400" fill="#26394b" text-anchor="start">1234 和 00001234 都保留原样；不要自行补零或删除前导零。</text>
</g>
</svg>
